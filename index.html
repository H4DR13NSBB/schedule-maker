function packLanes(shifts){
  // Group by employee first so one person's morning+afternoon segments always share a column;
  // two different employees only share a lane if none of their segments overlap at all (non-overlapping half-days).
  var byEmp={};
  shifts.forEach(function(s){ (byEmp[s.employeeId]=byEmp[s.employeeId]||[]).push(s); });
  var empIds=Object.keys(byEmp).sort(function(a,b){
    var aMin=Math.min.apply(null, byEmp[a].map(function(s){return toMin(s.start);}));
    var bMin=Math.min.apply(null, byEmp[b].map(function(s){return toMin(s.start);}));
    return aMin-bMin;
  });
  var lanes=[]; // lanes[i] = list of {start,end} intervals already occupying that lane
  var laneOfEmp={};
  empIds.forEach(function(empId){
    var segs=byEmp[empId].map(function(s){ return {start:toMin(s.start), end:toMin(s.end)}; });
    var laneIdx=-1;
    for(var i=0;i<lanes.length;i++){
      var conflict=lanes[i].some(function(placed){
        return segs.some(function(seg){ return overlap(placed.start,placed.end,seg.start,seg.end); });
      });
      if(!conflict){ laneIdx=i; break; }
    }
    if(laneIdx===-1){ laneIdx=lanes.length; lanes.push([]); }
    lanes[laneIdx]=lanes[laneIdx].concat(segs);
    laneOfEmp[empId]=laneIdx;
  });
  var placed=shifts.map(function(s){ return {shift:s, lane:laneOfEmp[s.employeeId]}; });
  return {placed:placed, laneCount: lanes.length};
}

function renderGrid(validation){
  // A read-only employee doesn't need room to drag/resize precisely: a denser grid fits more of
  // the week on screen. Kept in sync with the CSS var the day-body stripes are drawn from.
  ROW_MIN = (currentProfile && currentProfile.role==="employee") ? 15 : 20;
  document.documentElement.style.setProperty("--row-h", ROW_MIN+"px");
  var flex=document.getElementById("grid-flex");
  flex.innerHTML="";
  var store=getStore(state.ui.currentStoreId);
  if(!store){ flex.innerHTML="<p class='empty-note'>Aucun magasin. Ajoutez-en dans Configuration.</p>"; return; }
  var weekKey=state.ui.currentWeekKey;
  var dates=weekDates(weekKey);
  var dayHoursList=dates.map(function(d){ return resolveStoreHours(store, dateStr(d)); });

  var axisStart=Infinity, axisEnd=-Infinity;
  dayHoursList.forEach(function(h){ if(h){ axisStart=Math.min(axisStart,workStartMin(h)); axisEnd=Math.max(axisEnd,workEndMin(h)); } });
  if(axisStart===Infinity){ flex.innerHTML="<p class='empty-note'>Ce magasin est fermé toute la semaine.</p>"; return; }
  axisStart=Math.floor(axisStart/30)*30; axisEnd=Math.ceil(axisEnd/30)*30;
  gridAxisStart=axisStart; // shared by all day-bodies this render; drag handlers use it to place the ghost
  var slotCount=(axisEnd-axisStart)/30;
  var bodyHeight=slotCount*ROW_MIN;

  var axisCol=document.createElement("div"); axisCol.className="axis-col";
  for(var m=axisStart; m<axisEnd; m+=30){
    var lab=document.createElement("div"); lab.className="axis-label";
    if(m%60===0) lab.innerHTML="<span>"+fromMin(m)+"</span>";
    axisCol.appendChild(lab);
  }
  flex.appendChild(axisCol);

  var week=getWeek(weekKey);
  var coverage=validation.coverage[store.id]||{};

  dates.forEach(function(d, dayIdx){
    var ds=dateStr(d);
    var hours=dayHoursList[dayIdx];
    var col=document.createElement("div"); col.className="day-col";
    var dayShifts=week.shifts.filter(function(s){ return s.storeId===store.id && s.date===ds; });
    var packed=packLanes(dayShifts);
    var laneCount=Math.max(1, packed.laneCount);
    var laneWidthPct=100/Math.max(4, laneCount); // percentage of the day column: bars default to a quarter-width even with 1-3 employees, only shrinking further past 4 concurrent — column itself is responsive (flex), so this scales with screen size

    var head=document.createElement("div"); head.className="day-head";
    var holiday=isHoliday(ds, store.id);
    var hoursLabel=(hours?(hours.open+"–"+hours.close):"Fermé")+(holiday?" · "+escAttr(holidayLabel(ds, store.id)||"Férié"):"");
    head.innerHTML="<div class='dname'>"+DOW_LABELS[dayIdx]+"</div><div class='ddate'>"+fmtHuman(d)+"</div><div class='dhours'"+(holiday?" style='color:var(--warn);font-weight:600'":"")+">"+hoursLabel+"</div>";
    col.appendChild(head);

    var body=document.createElement("div"); body.className="day-body"; body.style.height=bodyHeight+"px"; body.dataset.date=ds;

    var bufferStart = hours ? workStartMin(hours) : null;
    var bufferEnd = hours ? workEndMin(hours) : null;
    var lunchClosure=storeLunchClosure(store, ds);
    var lunchStart=lunchClosure?toMin(lunchClosure.start):null, lunchEnd=lunchClosure?toMin(lunchClosure.end):null;
    for(var mi=0; mi<slotCount; mi++){
      var slotStart=axisStart+mi*30;
      if(!hours || slotStart<bufferStart || slotStart>=bufferEnd){
        var closedBand=document.createElement("div"); closedBand.className="slot-band closed";
        closedBand.style.top=(mi*ROW_MIN)+"px"; closedBand.style.height=ROW_MIN+"px";
        body.appendChild(closedBand);
        continue;
      }
      if(slotStart<toMin(hours.open) || slotStart>=toMin(hours.close)){
        var bufBand=document.createElement("div"); bufBand.className="slot-band buffer";
        bufBand.title = slotStart<toMin(hours.open) ? "Marge d'ouverture anticipée (nettoyage, préparation) — pas d'effectif requis" : "Après la fermeture, jusqu'au départ (rangement, caisse) — pas d'effectif requis";
        bufBand.style.top=(mi*ROW_MIN)+"px"; bufBand.style.height=ROW_MIN+"px";
        body.appendChild(bufBand);
        continue;
      }
      if(lunchClosure && slotStart>=lunchStart && slotStart<lunchEnd){
        var lunchBand=document.createElement("div"); lunchBand.className="slot-band closed";
        lunchBand.title="Pause de midi (magasin fermé) — pas d'effectif requis";
        lunchBand.style.top=(mi*ROW_MIN)+"px"; lunchBand.style.height=ROW_MIN+"px";
        body.appendChild(lunchBand);
        continue;
      }
      var slotInfo=(coverage[ds]||[]).find(function(s){return s.start===slotStart;});
      if(slotInfo && slotInfo.actual<slotInfo.required){
        var b1=document.createElement("div"); b1.className="slot-band understaff";
        b1.style.top=(mi*ROW_MIN)+"px"; b1.style.height=ROW_MIN+"px"; body.appendChild(b1);
      } else if(slotInfo && slotInfo.max!=null && slotInfo.actual>slotInfo.max){
        var b2=document.createElement("div"); b2.className="slot-band overstaff";
        b2.style.top=(mi*ROW_MIN)+"px"; b2.style.height=ROW_MIN+"px"; body.appendChild(b2);
      }
    }

    packed.placed.forEach(function(p){
      var s=p.shift; var emp=getEmployee(s.employeeId);
      var top=((toMin(s.start)-axisStart)/30)*ROW_MIN;
      var height=((toMin(s.end)-toMin(s.start))/30)*ROW_MIN;
      var block=document.createElement("div");
      var notMine = currentProfile && currentProfile.role==="employee" && s.employeeId!==currentProfile.employee_id;
      block.className="shift-block"+(s.source==="fixed"?" fixed":"")+(validation.conflictShiftIds[s.id]?" conflict":"")+(notMine?" not-mine":"");
      block.style.top=top+"px"; block.style.height=Math.max(height,8)+"px";
      block.style.left="calc("+(p.lane*laneWidthPct)+"% + 2px)"; block.style.width="calc("+laneWidthPct+"% - 4px)";
      block.style.background = emp ? emp.color : "#999";
      var conflictLabels={absence:"jour de repos / indisponibilité", "double":"double réservation", "saturday-rule":"règle samedi : fin à 17:00 requise cette semaine", "store-restriction":"employé non autorisé dans ce magasin", "fixed-overage":"dépasse l'horaire fixe récurrent de ce jour", "short-shift":"moins de "+((state.settings.minShiftMinutes||240)/60)+"h de travail ce jour-là au total", "split-gap":"deux créneaux ce jour-là séparés de plus d'1h", "missing-break":"pause obligatoire manquante ou trop courte ce jour-là", "workdays-over":"dépasse le nombre de jours travaillés autorisé cette semaine"};
      var conflictKey=validation.conflictShiftIds[s.id];
      var title = (emp?emp.name:"?")+" "+s.start+"–"+s.end+(conflictKey?" ⚠ "+(conflictLabels[conflictKey]||conflictKey):"");
      block.title=title;
      block.innerHTML = (emp?escAttr(emp.initials||emp.name):"?") + (s.locked?"<span class='lock-ico'>🔒</span>":"");
      block.appendChild(makeHandle("top", s, store.id, ds, body, block));
      block.appendChild(makeHandle("bottom", s, store.id, ds, body, block));
      attachBlockDrag(block, s, store.id, ds, body);
      block.addEventListener("click", function(ev){
        if(ev.__dragged) return;
        if(isWeekFrozen(weekKey)){ alert(FROZEN_MSG); return; }
        openShiftModal(s.id, weekKey);
      });
      body.appendChild(block);
    });

    var effectiveHours = hours ? {open: fromMin(bufferStart), close: hours.close} : null;
    // A read-only employee must not be able to create shifts by dragging on the empty grid, or
    // schedule a colleague by dropping them on it (the sidebar drag source is hidden for them too).
    if(!(currentProfile && currentProfile.role==="employee")){
      attachCreateDrag(body, store.id, ds, axisStart, effectiveHours);
      attachEmployeeDrop(body, store.id, ds, axisStart, hours, weekKey);
    }
    col.appendChild(body);
    flex.appendChild(col);
  });
}
function makeHandle(pos, shift, storeId, ds, bodyEl, block){
  var h=document.createElement("div"); h.className="handle "+pos;
  h.addEventListener("mousedown", function(e){
    e.stopPropagation(); e.preventDefault();
    startDrag(e, {mode: pos==="top"?"resize-top":"resize-bottom", shiftId:shift.id, storeId:storeId, date:ds, bodyEl:bodyEl, el:block});
  });
  return h;
}
function attachBlockDrag(block, shift, storeId, ds, bodyEl){
  block.addEventListener("mousedown", function(e){
    if(e.target.classList.contains("handle")) return;
    e.preventDefault();
    startDrag(e, {mode:"move", shiftId:shift.id, storeId:storeId, date:ds, el:block, bodyEl:bodyEl});
  });
}
function attachCreateDrag(body, storeId, ds, axisStart, hours){
  body.addEventListener("mousedown", function(e){
    if(e.target!==body) return;
    if(!hours) return;
    e.preventDefault();
    startDrag(e, {mode:"create", storeId:storeId, date:ds, axisStart:axisStart, bodyEl:body, hours:hours});
  });
}
var draggedEmployeeId=null;
function attachEmployeeDrop(body, storeId, ds, axisStart, hours, weekKey){
  if(!hours) return;
  body.addEventListener("dragover", function(e){ if(draggedEmployeeId) e.preventDefault(); });
  body.addEventListener("drop", function(e){
    e.preventDefault();
    var empId=draggedEmployeeId; draggedEmployeeId=null;
    if(!empId) return;
    if(isWeekFrozen(weekKey)){ alert(FROZEN_MSG); return; }
    var dropEmp=getEmployee(empId);
    if(isMandatorilyBlocked(empId, ds)){
      alert((dropEmp?dropEmp.name:"Cet employé")+" a un repos obligatoire ce jour-là. Choisissez un autre jour ou un autre employé.");
      return;
    }
    var openMin=toMin(hours.open), closeMin=toMin(hours.close);
    var week=getWeek(weekKey);
    var noonClosure = closeMin>=toMin("11:30") && closeMin<=toMin("14:30");
    var lunchClosure=storeLunchClosure(getStore(storeId), ds);
    var segments=[];
    if(noonClosure){
      segments.push([openMin, closeMin]);
    } else if(lunchClosure){
      // the store itself closes for lunch — that shared closure is everyone's break, no staggering needed
      var slot=[toMin(lunchClosure.start), toMin(lunchClosure.end)];
      var morningEnd=Math.max(openMin, Math.min(slot[0], closeMin));
      var afternoonStart=Math.min(closeMin, Math.max(slot[1], openMin));
      if(morningEnd>openMin) segments.push([openMin, morningEnd]);
      if(closeMin>afternoonStart) segments.push([afternoonStart, closeMin]);
      if(!segments.length) segments.push([openMin, closeMin]);
    } else {
      var existingCount=new Set(week.shifts.filter(function(s){return s.storeId===storeId && s.date===ds && s.employeeId!==empId;}).map(function(s){return s.employeeId;})).size;
      var anchor=staggeredBreakStarts(existingCount+1)[existingCount];
      var slot=[anchor, anchor+60];
      var morningEnd=Math.max(openMin, Math.min(slot[0], closeMin));
      var afternoonStart=Math.min(closeMin, Math.max(slot[1], openMin));
      if(morningEnd>openMin) segments.push([openMin, morningEnd]);
      if(closeMin>afternoonStart) segments.push([afternoonStart, closeMin]);
      if(!segments.length) segments.push([openMin, closeMin]);
    }
    segments.forEach(function(seg){
      week.shifts.push({id:uid(), storeId:storeId, employeeId:empId, date:ds, start:fromMin(seg[0]), end:fromMin(seg[1]), source:"manual", locked:false, note:""});
    });
    saveState(); renderSchedule();
  });
}

function startDrag(e, ctx){
  var weekKey=state.ui.currentWeekKey;
  if(isWeekFrozen(weekKey)) return; // frozen: no moving, resizing or drawing
  var week=getWeek(weekKey);
  var shift = ctx.shiftId ? week.shifts.find(function(s){return s.id===ctx.shiftId;}) : null;
  dragState={
    mode:ctx.mode, startY:e.clientY, startX:e.clientX, moved:false,
    originStart: shift? toMin(shift.start): null, originEnd: shift? toMin(shift.end): null,
    shiftId: ctx.shiftId, storeId: ctx.storeId, date: ctx.date, originDate: ctx.date, targetDate: ctx.date,
    el: ctx.el, targetBodyEl: null, willDelete: false, ghostBodyEl: null,
    axisStart: ctx.axisStart, hours: ctx.hours, bodyEl: ctx.bodyEl,
    anchorMin:null, createStartMin:null, createEndMin:null
  };
  if(ctx.mode==="create"){
    var openMin=toMin(ctx.hours.open), closeMin=workEndMin(ctx.hours); // a drawn shift may run on until Départ
    var rect=ctx.bodyEl.getBoundingClientRect();
    var yWithin=e.clientY-rect.top;
    var anchorMin=Math.max(openMin, Math.min(closeMin, ctx.axisStart + snap15((yWithin/ROW_MIN)*30)));
    dragState.anchorMin=anchorMin;
    dragState.createStartMin=anchorMin;
    dragState.createEndMin=anchorMin;
  }
  if((ctx.mode==="move"||ctx.mode==="resize-top"||ctx.mode==="resize-bottom") && ctx.el){
    ctx.el.classList.add("dragging-source"); // dim the original while its shadow shows the prospective position
  }
  document.onmousemove=onDragMove;
  document.onmouseup=onDragEnd;
}
function snap15(min){ return Math.round(min/15)*15; }
function onDragMove(e){
  if(!dragState) return;
  var dy=e.clientY-dragState.startY;
  var dx=e.clientX-dragState.startX;
  if(Math.abs(dy)>3 || Math.abs(dx)>3) dragState.moved=true;
  var deltaMin=snap15((dy/ROW_MIN)*30);
  var weekKey=state.ui.currentWeekKey;

  if(dragState.mode==="create"){
    var openMin=toMin(dragState.hours.open), closeMin=workEndMin(dragState.hours);
    var rect=dragState.bodyEl.getBoundingClientRect();
    var yWithin=e.clientY-rect.top;
    var cursorMin=Math.max(openMin, Math.min(closeMin, dragState.axisStart + snap15((yWithin/ROW_MIN)*30)));
    var lo=Math.min(dragState.anchorMin, cursorMin), hi=Math.max(dragState.anchorMin, cursorMin);
    if(hi-lo<15){ hi=Math.min(closeMin, lo+15); lo=hi-15; }
    dragState.createStartMin=lo; dragState.createEndMin=hi;
    drawGhost(dragState.bodyEl, dragState.axisStart, dragState.createStartMin, dragState.createEndMin);
    return;
  }
  if(dragState.mode==="move"){
    var newStart=dragState.originStart+deltaMin, newEnd=dragState.originEnd+deltaMin;
    dragState.previewStart=newStart; dragState.previewEnd=newEnd;
    // Which day (if any) the cursor is currently over — lets a horizontal drag retarget the shift
    // to a different day. Only counts as "dropped outside" (delete) once the cursor leaves the
    // whole grid area entirely (sidebar, header, page margin) — briefly overshooting above/below
    // a day-body while just adjusting time (the common case) must not flag it for deletion.
    var overEl=document.elementFromPoint(e.clientX, e.clientY);
    var overBody=overEl?overEl.closest(".day-body"):null;
    var gridFlexEl=document.getElementById("grid-flex");
    var insideGrid=overEl && gridFlexEl && (overEl===gridFlexEl || gridFlexEl.contains(overEl));
    if(dragState.targetBodyEl && dragState.targetBodyEl!==overBody) dragState.targetBodyEl.classList.remove("drop-target-day");
    dragState.targetBodyEl=overBody; // only for the highlight — may legitimately be null
    if(overBody){
      overBody.classList.add("drop-target-day");
      dragState.targetDate=overBody.dataset.date; // last real day hovered; persists through insideGrid gaps below
      dragState.willDelete=false;
    } else if(insideGrid){
      // Over the grid (axis column, day header, ...) but not a specific day-body — keep whatever
      // day was last targeted (dragState.targetDate untouched) and don't flag for deletion.
      dragState.willDelete=false;
    } else {
      dragState.willDelete=true;
    }
    if(dragState.el) dragState.el.classList.toggle("will-delete", dragState.willDelete);
  } else if(dragState.mode==="resize-top"){
    dragState.previewStart=Math.min(dragState.originEnd-15, dragState.originStart+deltaMin);
    dragState.previewEnd=dragState.originEnd;
  } else if(dragState.mode==="resize-bottom"){
    dragState.previewStart=dragState.originStart;
    dragState.previewEnd=Math.max(dragState.originStart+15, dragState.originEnd+deltaMin);
  }
  // Shadow of where the shift would land: follows the target day (looked up by date, so it stays
  // correct even while hovering the axis/header strip between day columns) while moving — none
  // while marked for deletion — or stays put in its own column while resizing.
  var ghostHostEl = dragState.mode==="move"
    ? (dragState.willDelete ? null : document.querySelector('.day-body[data-date="'+dragState.targetDate+'"]'))
    : dragState.bodyEl;
  if(dragState.ghostBodyEl && dragState.ghostBodyEl!==ghostHostEl){
    var oldGhost=dragState.ghostBodyEl.querySelector(".ghost-block");
    if(oldGhost) oldGhost.remove();
    dragState.ghostBodyEl=null;
  }
  if(ghostHostEl){
    drawGhost(ghostHostEl, gridAxisStart, dragState.previewStart, dragState.previewEnd);
    dragState.ghostBodyEl=ghostHostEl;
  }
}
function drawGhost(bodyEl, axisStart, startMin, endMin){
  var g=bodyEl.querySelector(".ghost-block");
  if(!g){ g=document.createElement("div"); g.className="ghost-block"; bodyEl.appendChild(g); }
  g.style.top=(((startMin-axisStart)/30)*ROW_MIN)+"px";
  g.style.height=Math.max(8,(((endMin-startMin)/30)*ROW_MIN))+"px";
  g.style.left="2px"; g.style.right="2px";
}
function onDragEnd(e){
  document.onmousemove=null; document.onmouseup=null;
  if(!dragState) return;
  var ds=dragState;
  dragState=null;
  if(ds.targetBodyEl) ds.targetBodyEl.classList.remove("drop-target-day");
  if(ds.el){ ds.el.classList.remove("will-delete"); ds.el.classList.remove("dragging-source"); }
  if(ds.ghostBodyEl){ var dsGhost=ds.ghostBodyEl.querySelector(".ghost-block"); if(dsGhost) dsGhost.remove(); }
  var weekKey=state.ui.currentWeekKey;
  var week=getWeek(weekKey);

  if(ds.mode==="create"){
    var g=ds.bodyEl.querySelector(".ghost-block"); if(g) g.remove();
    if(!ds.moved || ds.createEndMin==null || (ds.createEndMin-ds.createStartMin)<15) return;
    openCreateModal(ds.storeId, ds.date, fromMin(ds.createStartMin), fromMin(ds.createEndMin));
    return;
  }
  if(!ds.moved){
    // treat as click, handled by block's click listener naturally; mark to avoid move-noop render
    return;
  }
  var shift=week.shifts.find(function(s){return s.id===ds.shiftId;});
  if(!shift) return;
  if(ds.mode==="move" && ds.willDelete){
    // Dragged out of every day column (sidebar, header, page margin, ...) — same "Supprimer" as
    // the edit modal's delete button, just via drag; the global undo stack covers it either way.
    week.shifts=week.shifts.filter(function(s){return s.id!==shift.id;});
    saveState(); renderSchedule();
    return;
  }
  var targetDate = ds.mode==="move" ? ds.targetDate : ds.date;
  if(ds.mode==="move" && targetDate!==ds.originDate && isMandatorilyBlocked(shift.employeeId, targetDate)){
    var emp=getEmployee(shift.employeeId);
    alert((emp?emp.name:"Cet employé")+" a un repos obligatoire ce jour-là. Choisissez un autre jour.");
    return;
  }
  var store=getStore(ds.storeId);
  var hours=resolveStoreHours(store, targetDate);
  var newStart=ds.previewStart, newEnd=ds.previewEnd;
  if(hours){
    newStart=Math.max(workStartMin(hours), newStart); newEnd=Math.min(workEndMin(hours), newEnd);
  }
  if(newEnd-newStart<15) return;
  shift.date=targetDate;
  shift.start=fromMin(newStart); shift.end=fromMin(newEnd);
  if(shift.source==="fixed") shift.source="manual"; // manual edit overrides the recurring pattern from now on
  saveState(); renderSchedule();
}

function openCreateModal(storeId, ds, startTime, endTime){
  var root=document.getElementById("modal-root");
  var weekKey=state.ui.currentWeekKey;
  var html="<div class='modal-overlay'><div class='modal'><h3>Nouveau créneau</h3>";
  html+="<div class='field'><label>Employé</label><select id='cm-emp'>"+
    state.employees.map(function(e){
      var busy=!isEmployeeAvailable(e.id, ds, toMin(startTime), toMin(endTime));
      var notAllowed=!employeeAllowedAtStore(e, storeId);
      var onlyIfNecessary=prefersNotAtStore(e.id, storeId);
      var mandatoryBlocked=isMandatorilyBlocked(e.id, ds);
      var soft=prefersOff(e.id, ds);
      var flag=[(busy && !mandatoryBlocked)?"indisponible":null, notAllowed?"pas autorisé ici":null,
        onlyIfNecessary?"seulement si nécessaire":null,
        mandatoryBlocked?"repos obligatoire — bloqué":null, (soft && !mandatoryBlocked)?"repos souhaité":null].filter(Boolean).join(", ");
      return "<option value='"+e.id+"'>"+escAttr(e.name)+(flag?" ("+flag+")":"")+"</option>";
    }).join("")+"</select></div>";
  html+="<div class='row'><div class='field'><label>Début</label><input type='time' id='cm-start' value='"+startTime+"'></div>"+
        "<div class='field'><label>Fin</label><input type='time' id='cm-end' value='"+endTime+"'></div></div>";
  html+="<div class='modal-actions'><div class='left'></div><div style='display:flex;gap:8px'><button class='btn' data-action='cancel'>Annuler</button><button class='btn btn-primary' data-action='save'>Ajouter</button></div></div>";
  html+="</div></div>";
  root.innerHTML=html;
  root.querySelector("[data-action=cancel]").addEventListener("click", function(){ root.innerHTML=""; });
  root.querySelector("[data-action=save]").addEventListener("click", function(){
    var empId=document.getElementById("cm-emp").value;
    var s=document.getElementById("cm-start").value, e=document.getElementById("cm-end").value;
    if(toMin(e)<=toMin(s)){ alert("L'heure de fin doit être après le début."); return; }
    var emp=getEmployee(empId);
    if(isMandatorilyBlocked(empId, ds)){
      alert((emp?emp.name:"Cet employé")+" a un repos obligatoire ce jour-là. Choisissez un autre employé ou une autre date.");
      return;
    }
    var week=getWeek(weekKey);
    week.shifts.push({id:uid(), storeId:storeId, employeeId:empId, date:ds, start:s, end:e, source:"manual", locked:false, note:""});
    saveState(); root.innerHTML=""; renderSchedule();
  });
}
function openShiftModal(shiftId, weekKey){
  var week=getWeek(weekKey);
  var shift=week.shifts.find(function(s){return s.id===shiftId;});
  if(!shift) return;
  // A day with a break is stored as two separate shift pieces. When this is exactly that simple
  // 2-piece case, edit them together as one "whole day + break" span instead of just the one piece
  // that happened to be clicked — otherwise (a single piece, or an unusual 3+ piece day) edit just
  // the clicked shift on its own, same as before.
  var siblings=week.shifts.filter(function(s){ return s.employeeId===shift.employeeId && s.date===shift.date; }).sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
  var mergeWhole=siblings.length===2;
  var dayShifts=mergeWhole?siblings:[shift];
  var dayStart=dayShifts[0].start, dayEnd=dayShifts[dayShifts.length-1].end;
  var hasBreak=mergeWhole;
  var breakStart=mergeWhole?dayShifts[0].end:"", breakEnd=mergeWhole?dayShifts[1].start:"";
  var root=document.getElementById("modal-root");
  var html="<div class='modal-overlay'><div class='modal'><h3>Modifier le créneau</h3>";
  html+="<div class='field'><label>Employé</label><select id='em-emp'>"+
    state.employees.map(function(e){
      var flag=isMandatorilyBlocked(e.id, shift.date)?" (repos obligatoire — bloqué)":(prefersOff(e.id, shift.date)?" (repos souhaité)":"");
      return "<option value='"+e.id+"' "+(e.id===shift.employeeId?"selected":"")+">"+escAttr(e.name)+flag+"</option>";
    }).join("")+"</select></div>";
  html+="<div class='row'><div class='field'><label>Début</label><input type='time' id='em-start' value='"+dayStart+"'></div>"+
        "<div class='field'><label>Fin</label><input type='time' id='em-end' value='"+dayEnd+"'></div></div>";
  html+="<div class='field'><label><input type='checkbox' id='em-hasbreak' "+(hasBreak?"checked":"")+"> Pause</label></div>";
  html+="<div class='row' id='em-break-row' style='"+(hasBreak?"":"display:none")+"'><div class='field'><label>Pause de</label><input type='time' id='em-breakstart' value='"+breakStart+"'></div>"+
        "<div class='field'><label>à</label><input type='time' id='em-breakend' value='"+breakEnd+"'></div></div>";
  html+="<div class='field'><label><input type='checkbox' id='em-locked' "+(shift.locked?"checked":"")+"> Verrouillé (protégé contre la génération automatique)</label></div>";
  html+="<div class='hint'>Source : "+({fixed:"horaire fixe récurrent", manual:"saisie manuelle", auto:"proposition automatique"}[shift.source]||shift.source)+"</div>";
  html+="<div class='modal-actions'><button class='btn btn-danger' data-action='delete'>Supprimer</button><div style='display:flex;gap:8px'><button class='btn' data-action='cancel'>Annuler</button><button class='btn btn-primary' data-action='save'>Enregistrer</button></div></div>";
  html+="</div></div>";
  root.innerHTML=html;
  document.getElementById("em-hasbreak").addEventListener("change", function(e){
    document.getElementById("em-break-row").style.display = e.target.checked ? "" : "none";
    if(e.target.checked){
      var bs=document.getElementById("em-breakstart"), be=document.getElementById("em-breakend");
      if(!bs.value) bs.value="12:00";
      if(!be.value) be.value="13:00";
    }
  });
  root.querySelector("[data-action=cancel]").addEventListener("click", function(){ root.innerHTML=""; });
  root.querySelector("[data-action=delete]").addEventListener("click", function(){
    if(!confirm("Supprimer ce créneau ?")) return;
    var idsToRemove=dayShifts.map(function(s){return s.id;});
    week.shifts=week.shifts.filter(function(s){return idsToRemove.indexOf(s.id)<0;});
    saveState(); root.innerHTML=""; renderSchedule();
  });
  root.querySelector("[data-action=save]").addEventListener("click", function(){
    var s=document.getElementById("em-start").value, e=document.getElementById("em-end").value;
    if(toMin(e)<=toMin(s)){ alert("L'heure de fin doit être après le début."); return; }
    var newEmpId=document.getElementById("em-emp").value;
    var newEmp=getEmployee(newEmpId);
    if(isMandatorilyBlocked(newEmpId, shift.date)){
      alert((newEmp?newEmp.name:"Cet employé")+" a un repos obligatoire ce jour-là. Choisissez un autre employé ou une autre date.");
      return;
    }
    var wantsBreak=document.getElementById("em-hasbreak").checked;
    var bs=document.getElementById("em-breakstart").value, be=document.getElementById("em-breakend").value;
    if(wantsBreak){
      if(!bs || !be || toMin(be)<=toMin(bs)){ alert("La pause doit avoir une heure de fin après son heure de début."); return; }
      if(toMin(bs)<toMin(s) || toMin(be)>toMin(e)){ alert("La pause doit être comprise entre le début et la fin du créneau."); return; }
    }
    var locked=document.getElementById("em-locked").checked;
    var newSource = shift.source==="fixed" ? "manual" : shift.source;
    var idsToRemove=dayShifts.map(function(s){return s.id;});
    week.shifts=week.shifts.filter(function(sh){return idsToRemove.indexOf(sh.id)<0;});
    if(wantsBreak){
      week.shifts.push({id:uid(), storeId:shift.storeId, employeeId:newEmpId, date:shift.date, start:s, end:bs, source:newSource, locked:locked, note:shift.note||""});
      week.shifts.push({id:uid(), storeId:shift.storeId, employeeId:newEmpId, date:shift.date, start:be, end:e, source:newSource, locked:locked, note:""});
    } else {
      week.shifts.push({id:uid(), storeId:shift.storeId, employeeId:newEmpId, date:shift.date, start:s, end:e, source:newSource, locked:locked, note:shift.note||""});
    }
    saveState(); root.innerHTML=""; renderSchedule();
  });
}

/* ---------- 9. Print ---------- */
function buildPrintPage(store, weekKey){
  var dates=weekDates(weekKey);
  var week=getWeek(weekKey);
  var dayHoursList=dates.map(function(d){ return resolveStoreHours(store, dateStr(d)); });
  var axisStart=Infinity, axisEnd=-Infinity;
  dayHoursList.forEach(function(h){ if(h){ axisStart=Math.min(axisStart,workStartMin(h)); axisEnd=Math.max(axisEnd,workEndMin(h)); } });
  var hasHours = axisStart!==Infinity;
  if(hasHours){ axisStart=Math.floor(axisStart/30)*30; axisEnd=Math.ceil(axisEnd/30)*30; }
  var SLOT=15; // print rows are 15 min, so breaks show at their exact times (12:00, 12:30, 13:00, 45 min…)
  var slotCount = hasHours ? (axisEnd-axisStart)/SLOT : 0;

  var empIds=Array.from(new Set(week.shifts.filter(function(s){return s.storeId===store.id;}).map(function(s){return s.employeeId;})));
  var earliestStart={};
  empIds.forEach(function(empId){
    var mins=week.shifts.filter(function(s){return s.employeeId===empId && s.storeId===store.id;}).map(function(s){return toMin(s.start);});
    earliestStart[empId]=Math.min.apply(null, mins);
  });
  var employees=empIds.map(getEmployee).filter(Boolean).sort(function(a,b){
    var diff=earliestStart[a.id]-earliestStart[b.id];
    return diff!==0 ? diff : (a.name||"").localeCompare(b.name||"");
  });

  // Every store must fit on exactly one printed page (grid + hours table and logo + signature table).
  // The page is a fixed-height column with the signatures pushed to its bottom. The grid rows share
  // what's left after the fixed blocks; if that's too tight, the signature rows get shorter first
  // (down to 9mm). The budget below is deliberately well short of A4's real printable height: a
  // phone's print path (AirPrint / Android print service) routinely ignores the @page size/margin
  // CSS below and substitutes its own paper size and margins (often Letter, often bigger margins
  // than 8mm), so sizing to the full A4 area made the page fit perfectly on a computer and spill onto
  // a second sheet from a phone. This smaller budget leaves enough slack to still fit after that.
  var USABLE_HEIGHT_MM=230, TITLE_BLOCK_MM=24, GRID_GAP_MM=6, DAY_HEADER_MM=14, LEGEND_HEADER_MM=8, LEGEND_ROW_MM=7, SIGN_GAP_MM=6, SIGN_HEADER_MM=8;
  var MIN_ROW_MM=1.5, MAX_ROW_MM=6; // per 15-min row
  var LOGO_MM=40; // fixed logo height, next to the hours table
  var legendRows=Math.max(1, employees.length);
  var legendHeightMM = LEGEND_HEADER_MM + legendRows*LEGEND_ROW_MM;
  var signRows=Math.max(1, employees.length);
  // The row with the hours table and the logo is as tall as the taller of the two; the grid takes up
  // the rest, so the signatures land at the bottom of the page.
  var bottomRowMM = Math.max(legendHeightMM, logoSrc ? LOGO_MM : 0);
  var fixedMM = TITLE_BLOCK_MM + GRID_GAP_MM + DAY_HEADER_MM + bottomRowMM + SIGN_GAP_MM + SIGN_HEADER_MM;
  var SIGN_ROW_MM = Math.max(9, Math.min(16, (USABLE_HEIGHT_MM - fixedMM - MIN_ROW_MM*slotCount)/signRows));
  var remainingMM = USABLE_HEIGHT_MM - fixedMM - signRows*SIGN_ROW_MM;
  var rowMM = slotCount>0 ? remainingMM/slotCount : 3;
  rowMM = Math.max(MIN_ROW_MM, Math.min(MAX_ROW_MM, rowMM));
  var rowStyle="height:"+rowMM.toFixed(2)+"mm";

  var html="<div class='print-page'>";
  html+="<h2>"+escAttr(store.name)+"</h2>";
  html+="<div class='sub'>Semaine "+weekKey+" — "+fmtHuman(dates[0])+" au "+fmtHuman(dates[6])+" — généré le "+fmtHuman(new Date())+"</div>";

  if(!hasHours){
    html+="<p>Ce magasin est fermé toute la semaine.</p>";
  } else {
    html+="<div class='pgrid-wrap'>";
    html+="<table class='pgrid-axis'><thead><tr><th style='height:"+DAY_HEADER_MM+"mm'></th></tr></thead><tbody>";
    for(var mi=0; mi<slotCount; mi++){
      var slotStart=axisStart+mi*SLOT;
      html+="<tr style='"+rowStyle+"'><td>"+(slotStart%60===0?fromMin(slotStart):"")+"</td></tr>";
    }
    html+="</tbody></table>";
    dates.forEach(function(d, dayIdx){
      var ds=dateStr(d);
      var hours=dayHoursList[dayIdx];
      var holiday=isHoliday(ds, store.id);
      var dayShifts=week.shifts.filter(function(s){ return s.storeId===store.id && s.date===ds; });
      var packed=packLanes(dayShifts);
      // Print always reserves at least 4 lane-columns per day, so no employee's cell ever prints
      // wider than a quarter of the day's width — a quiet 1-2 person day stays visually consistent
      // with a busy one instead of stretching to fill the space. A day that genuinely needs more
      // than 4 (5, 6, ...) still grows past that floor.
      var laneCount=Math.max(4, packed.laneCount);
      var grid=[];
      for(var l=0;l<laneCount;l++){ grid.push(new Array(slotCount).fill(null)); }
      packed.placed.forEach(function(p){
        var s=p.shift;
        var startIdx=Math.max(0, Math.round((toMin(s.start)-axisStart)/SLOT));
        var endIdx=Math.min(slotCount, Math.round((toMin(s.end)-axisStart)/SLOT));
        for(var i=startIdx;i<endIdx;i++){ grid[p.lane][i]=s; }
      });
      var hoursLabel=hours?(hours.open+"–"+hours.close):"Fermé";
      html+="<table class='pgrid-day'><thead><tr><th colspan='"+laneCount+"' style='height:"+DAY_HEADER_MM+"mm'>"+DOW_LABELS[dayIdx]+"<br>"+fmtHuman(d)+"<br>"+(holiday?(escAttr(holidayLabel(ds, store.id)||"Férié")):hoursLabel)+"</th></tr></thead><tbody>";
      var bufferStart = hours ? workStartMin(hours) : null;
      var bufferEnd = hours ? workEndMin(hours) : null;
      var lunchClosure=storeLunchClosure(store, ds);
      var lunchStart=lunchClosure?toMin(lunchClosure.start):null, lunchEnd=lunchClosure?toMin(lunchClosure.end):null;
      var openMin = hours ? toMin(hours.open) : null, closeMin = hours ? toMin(hours.close) : null;
      for(var row=0; row<slotCount; row++){
        // Dotted line every 30 min (row pairs), as on the editor grid.
        html+="<tr style='"+rowStyle+"'"+((axisStart+(row+1)*SLOT)%30===0?" class='half'":"")+">";
        for(var lane=0; lane<laneCount; lane++){
          var shift=grid[lane][row];
          if(shift){
            if(row>0 && grid[lane][row-1]===shift) continue; // absorbed by rowspan above
            var span=1;
            while(row+span<slotCount && grid[lane][row+span]===shift) span++;
            var emp=getEmployee(shift.employeeId);
            var label=emp?(emp.name||emp.initials):"?";
            html+="<td class='pgrid-block' rowspan='"+span+"' style='background:"+(emp?emp.color:"#ccc")+"'><div class='pgrid-label'>"+escAttr(label)+"</div></td>";
          } else {
            var slotStart=axisStart+row*SLOT;
            var inLunch = lunchClosure && slotStart>=lunchStart && slotStart<lunchEnd;
            var closed = !hours || slotStart<bufferStart || slotStart>=bufferEnd || inLunch;
            // Arrivée before opening and Départ after closing: hatched, so opening hours stand out.
            var buffer = !closed && (slotStart<openMin || slotStart>=closeMin);
            html+="<td class='"+(closed?"slot-closed":(buffer?"slot-buffer":"slot-open"))+"'></td>";
          }
        }
        html+="</tr>";
      }
      html+="</tbody></table>";
    });
    html+="</div>";
  }

  html+="<div class='pbottom-row'><table class='plegend'><thead><tr style='height:"+LEGEND_HEADER_MM+"mm'><th style='text-align:left'>Employé</th>"+dates.map(function(d,i){return "<th>"+DOW_SHORT[i]+"</th>";}).join("")+"<th>Total</th></tr></thead><tbody>";
  employees.forEach(function(emp){
    var total=0;
    html+="<tr style='height:"+LEGEND_ROW_MM+"mm'><td class='pname' style='background:"+emp.color+"'>"+escAttr(emp.name)+"</td>";
    dates.forEach(function(d){
      var ds=dateStr(d);
      var mins=week.shifts.filter(function(s){return s.storeId===store.id && s.employeeId===emp.id && s.date===ds;})
        .reduce(function(sum,s){ return sum+(toMin(s.end)-toMin(s.start)); },0);
      total+=mins;
      html+="<td>"+(mins?(mins/60).toFixed(1):"-")+"</td>";
    });
    html+="<td>"+(total/60).toFixed(1)+"</td></tr>";
  });
  if(!employees.length) html+="<tr><td colspan='"+(dates.length+2)+"'>Aucun créneau planifié.</td></tr>";
  html+="</tbody></table>";
  // Logo in the space to the right of the hours table.
  html+="<div class='plogo-box' style='height:"+bottomRowMM+"mm'>"+(logoSrc?"<img class='print-logo' src='"+escAttr(logoSrc)+"' alt=''>":"")+"</div></div>";

  html+="<table class='psign' style='margin-top:auto'><thead><tr style='height:"+SIGN_HEADER_MM+"mm'><th colspan='2' style='text-align:left'>Signatures</th></tr></thead><tbody>";
  employees.forEach(function(emp){
    html+="<tr style='height:"+SIGN_ROW_MM+"mm'><td class='psign-name'>"+escAttr(emp.name)+"</td><td class='psign-box'></td></tr>";
  });
  if(!employees.length) html+="<tr><td colspan='2'>Aucun employé.</td></tr>";
  html+="</tbody></table>";
  html+="</div>";
  return html;
}
function doPrint(stores, title){
  var area=document.getElementById("printArea");
  area.innerHTML = stores.map(function(s){ return buildPrintPage(s, state.ui.currentWeekKey); }).join("");
  var oldTitle=document.title;
  document.title=title;
  window.addEventListener("afterprint", function restore(){ document.title=oldTitle; window.removeEventListener("afterprint", restore); });
  window.print();
}
// Compact combined printout: every store on one page, no signatures -- a quick overview rather
// than the per-store document above. Half-hour rows, initials instead of full names, no logo: the
// goal is fitting as much as will reasonably fit, not an exact one-page guarantee -- a lot of open
// stores/hours can still spill onto a second sheet, same as any print layout would.
function buildPrintPageCompact(store, weekKey){
  var dates=weekDates(weekKey);
  var week=getWeek(weekKey);
  var dayHoursList=dates.map(function(d){ return resolveStoreHours(store, dateStr(d)); });
  var axisStart=Infinity, axisEnd=-Infinity;
  dayHoursList.forEach(function(h){ if(h){ axisStart=Math.min(axisStart,workStartMin(h)); axisEnd=Math.max(axisEnd,workEndMin(h)); } });
  var hasHours = axisStart!==Infinity;
  if(hasHours){ axisStart=Math.floor(axisStart/30)*30; axisEnd=Math.ceil(axisEnd/30)*30; }
  var SLOT=30;
  var slotCount = hasHours ? (axisEnd-axisStart)/SLOT : 0;
  var ROW_MM=2.3;
  var html="<div class='pstore-compact'>";
  html+="<h3>"+escAttr(store.name)+"</h3>";
  if(!hasHours){ html+="<p class='pcompact-closed'>Fermé toute la semaine.</p></div>"; return html; }
  html+="<div class='pgrid-wrap'>";
  html+="<table class='pgrid-axis'><thead><tr><th></th></tr></thead><tbody>";
  for(var mi=0; mi<slotCount; mi++){
    var slotStart0=axisStart+mi*SLOT;
    html+="<tr style='height:"+ROW_MM+"mm'><td>"+fromMin(slotStart0)+"</td></tr>";
  }
  html+="</tbody></table>";
  dates.forEach(function(d, dayIdx){
    var ds=dateStr(d);
    var dayShifts=week.shifts.filter(function(s){ return s.storeId===store.id && s.date===ds; });
    var packed=packLanes(dayShifts);
    var laneCount=Math.max(2, packed.laneCount);
    var grid=[];
    for(var l=0;l<laneCount;l++){ grid.push(new Array(slotCount).fill(null)); }
    packed.placed.forEach(function(p){
      var s2=p.shift;
      var startIdx=Math.max(0, Math.round((toMin(s2.start)-axisStart)/SLOT));
      var endIdx=Math.min(slotCount, Math.round((toMin(s2.end)-axisStart)/SLOT));
      for(var i=startIdx;i<endIdx;i++){ grid[p.lane][i]=s2; }
    });
    var hours=dayHoursList[dayIdx];
    var holiday=isHoliday(ds, store.id);
    var hoursLabel=hours?(hours.open+"–"+hours.close):"Fermé";
    html+="<table class='pgrid-day pgrid-day-compact'><thead><tr><th colspan='"+laneCount+"'>"+DOW_SHORT[dayIdx]+" "+pad2(d.getDate())+"."+pad2(d.getMonth()+1)+"<br>"+(holiday?"Férié":hoursLabel)+"</th></tr></thead><tbody>";
    var bufferStart = hours ? workStartMin(hours) : null;
    var bufferEnd = hours ? workEndMin(hours) : null;
    var lunchClosure=storeLunchClosure(store, ds);
    var lunchStart=lunchClosure?toMin(lunchClosure.start):null, lunchEnd=lunchClosure?toMin(lunchClosure.end):null;
    for(var row=0; row<slotCount; row++){
      html+="<tr style='height:"+ROW_MM+"mm'>";
      for(var lane=0; lane<laneCount; lane++){
        var shift=grid[lane][row];
        if(shift){
          if(row>0 && grid[lane][row-1]===shift) continue;
          var span=1;
          while(row+span<slotCount && grid[lane][row+span]===shift) span++;
          var emp=getEmployee(shift.employeeId);
          var label=emp?(emp.initials||emp.name):"?";
          html+="<td class='pgrid-block' rowspan='"+span+"' style='background:"+(emp?emp.color:"#ccc")+"'><div class='pgrid-label-h'>"+escAttr(label)+"</div></td>";
        } else {
          var slotStart=axisStart+row*SLOT;
          var inLunch = lunchClosure && slotStart>=lunchStart && slotStart<lunchEnd;
          var closed = !hours || slotStart<bufferStart || slotStart>=bufferEnd || inLunch;
          html+="<td class='"+(closed?"slot-closed":"slot-open")+"'></td>";
        }
      }
      html+="</tr>";
    }
    html+="</tbody></table>";
  });
  html+="</div></div>";
  return html;
}
function doPrintCompact(stores, title){
  var area=document.getElementById("printArea");
  area.innerHTML = "<div class='print-page print-page-compact'>"+stores.map(function(s){ return buildPrintPageCompact(s, state.ui.currentWeekKey); }).join("")+"</div>";
  var oldTitle=document.title;
  document.title=title;
  window.addEventListener("afterprint", function restore(){ document.title=oldTitle; window.removeEventListener("afterprint", restore); });
  window.print();
}


/* ---------- 9b. Données: per-employee summary ---------- */
// Computed from the app's data (the same content as the JSON saves). Only planned weeks count, so
// months not scheduled yet don't show as missing hours. Fixed-pattern shifts are filled in just by
// browsing to a week, so they don't make it planned: it needs generated or hand-placed shifts, or
// to have been printed.
// month -1 = whole year; lastMonth remembers the month to return to when leaving whole-year view.
var dataPeriod={year:new Date().getFullYear(), month:new Date().getMonth(), lastMonth:new Date().getMonth()};
// Arrows step one month (rolling over the year), or one year in whole-year view.
function shiftDataPeriod(delta){
  if(dataPeriod.month<0){ dataPeriod.year+=delta; }
  else {
    var m=dataPeriod.month+delta;
    dataPeriod.year+=Math.floor(m/12);
    dataPeriod.month=dataPeriod.lastMonth=((m%12)+12)%12;
  }
  renderData();
}
function weekIsPlanned(weekKey){
  var w=state.weeks[weekKey];
  if(!w) return false;
  return !!w.printedAt || (w.shifts||[]).some(function(s){ return s.source!=="fixed"; });
}
function employeePeriodSummary(emp, from, to){
  var r={worked:0, target:0, daysWorked:0, vacation:0, dayoff:0, unavailable:0, sick:0, satOff:0, satPlanned:0};
  r.hasTarget=false; r.employedDays=0; r.types=[]; r.fteDays=0; r.rates=[];
  for(var d=parseDateStr(from); dateStr(d)<=to; d.setDate(d.getDate()+1)){
    var ds=dateStr(d), dow=d.getDay(), wk=weekKeyOf(d);
    var contract=contractOn(emp, ds) || (isEmployedOn(emp, ds) ? {type:emp.contractType} : null);
    if(!contract) continue; // not employed that day
    r.employedDays++;
    if(r.types.indexOf(contract.type)<0) r.types.push(contract.type);
    var dayFte=fteOn(emp, ds); r.fteDays+=dayFte;
    if(r.rates.indexOf(dayFte)<0) r.rates.push(dayFte);
    var hasTarget = contract.type!=="hourly" && !emp.worksFromHome;
    if(hasTarget) r.hasTarget=true;
    var holiday=employeeObservesHoliday(emp, ds);
    if(weekIsPlanned(wk) && dow===6 && !holiday){ // holiday Saturdays aren't free Saturdays
      r.satPlanned++;
      if(!state.weeks[wk].shifts.some(function(s){ return s.employeeId===emp.id && s.date===ds; })) r.satOff++;
    }
    // Absence days count Monday–Friday only, public holidays excluded, and only on days this
    // employee would actually have worked -- someone on a reduced schedule (e.g. 80% = 4 work days/
    // week via a recurring day off) isn't charged a vacation day for their day off same as everyone
    // else isn't charged for a Saturday or Sunday. Same rule for every contract type (salaried or
    // hourly): the recurring-day-off pattern is what actually drives how many days a week they work.
    // recurringDaysOff uses Monday=0..Sunday=6 (dowFromDate), not getDay()'s Sunday=0 -- compare
    // the right one or this silently excludes/includes the wrong weekday.
    if(dow>=1 && dow<=5 && !holiday && (emp.recurringDaysOff||[]).indexOf(dowFromDate(d))<0){
      (emp.absences||[]).forEach(function(ab){
        if(ab.startTime || ds<ab.startDate || ds>ab.endDate) return;
        if(ab.type==="vacation") r.vacation++; else if(ab.type==="dayoff") r.dayoff++; else if(ab.type==="sick") r.sick++; else r.unavailable++;
      });
    }
  }
  // Hours worked and target come from whole weeks — the weekly totals are the reference. A week
  // belongs to the month of its Saturday (like the free Saturdays), so a week across two months or
  // years is counted once, entirely, in one of them.
  for(var wd=parseDateStr(dateStr(weekDates(weekKeyOf(parseDateStr(from)))[0])); dateStr(wd)<=to; wd.setDate(wd.getDate()+7)){
    var wk=weekKeyOf(wd), satDs=dateStr(weekDates(wk)[5]);
    if(satDs<from || satDs>to || !weekIsPlanned(wk)) continue;
    var dates={};
    state.weeks[wk].shifts.forEach(function(s){
      if(s.employeeId!==emp.id) return;
      r.worked+=toMin(s.end)-toMin(s.start); dates[s.date]=true;
    });
    r.daysWorked+=Object.keys(dates).length;
    if(emp.worksFromHome || contractTypeInWeek(emp, wk)==="hourly") continue;
    if(!weekDates(wk).some(function(d){ return isEmployedOn(emp, dateStr(d)); })) continue;
    // Leave out carried-over hours (rattrapage): they only move an earlier week's gap forward,
    // and counting them again here would double that gap in the overtime.
    var adj=(state.weeks[wk].employeeAdjustments||{})[emp.id]||{};
    var t=employeeTargetMinutes(emp, wk);
    if(adj.targetOverrideMinutes==null) t-=(adj.rattrapageMinutes||0)+(adj.autoCarryMinutes||0)+(adj.yearCarryMinutes||0);
    r.target+=t;
  }
  // A flexible (worksFromHome) employee's confirmed logged hours ("Mes heures") count as worked
  // too -- their weeks usually hold no shift rows at all (weekIsPlanned above would otherwise skip
  // them entirely), so without this their logged time would never show up here.
  var loggedDates={};
  hourLogs.filter(function(h){ return h.employee_id===emp.id && h.status==="approved" && h.log_date>=from && h.log_date<=to; })
    .forEach(function(h){ r.worked+=Math.round(h.hours*60); loggedDates[h.log_date]=true; });
  r.daysWorked+=Object.keys(loggedDates).length;
  return r;
}
function fmtH(mins){ return (mins/60).toFixed(1); }
function fmtDelta(mins){
  var h=Math.round(mins/6)/10;
  if(h===0) return "0.0";
  return "<span class='"+(h>0?"delta-pos":"delta-neg")+"'>"+(h>0?"+":"−")+Math.abs(h).toFixed(1)+"</span>";
}

    "<th class='num'>Vacances (j)</th><th class='num' title='Droit annuel (au prorata du taux et des jours sous contrat) − vacances prises sur toute l&#39;année'>Solde vacances "+y+"</th><th class='num'>Congés (j)</th><th class='num'>Maladie (j)</th><th class='num'>Indispo. (j)</th><th class='num'>Samedis libres</th></tr></thead><tbody>";
  var tot={worked:0, target:0, delta:0, vacation:0, dayoff:0, unavailable:0, sick:0};
  var yearFrom=y+"-01-01", yearTo=y+"-12-31";
  var daysInYear=Math.round((new Date(y+1,0,1)-new Date(y,0,1))/86400000);
  emps.forEach(function(emp){

    var balance="—";
    var carriedDays=yearCarryVacationDays(emp, y), carriedMin=yearCarryHoursMinutes(emp, y);
    if(emp.vacationDaysPerYear!=null || carriedDays){
      var entitled=emp.vacationDaysPerYear!=null ? Math.round(emp.vacationDaysPerYear*yr.fteDays/daysInYear*2)/2 : 0; // each day at the rate in force that day
      balance=(entitled+carriedDays-yr.vacation)+" / "+(entitled+carriedDays);

    }
    // Whole year: the hours carried over from last year are part of the year's overtime.
    var overtime="—";
    if(r.hasTarget){
      var carriedHere = m<0 ? carriedMin : 0;
      overtime=fmtDelta(r.worked-r.target+carriedHere);
      if(carriedHere) overtime="<span title='dont "+fmtDelta(carriedMin).replace(/<[^>]+>/g,"")+" h reportées de "+(y-1)+"'>"+overtime+" *</span>";
    }
    var notes=yearCarryEntries(emp, y).map(function(c){ return c.note; }).filter(Boolean).join(" · ");
    tot.worked+=r.worked; tot.vacation+=r.vacation; tot.dayoff+=r.dayoff; tot.sick+=r.sick; tot.unavailable+=r.unavailable;
    if(r.hasTarget){ tot.target+=r.target; tot.delta+=r.worked-r.target+(m<0?carriedMin:0); }
    var contract = emp.worksFromHome ? "Flexible" : r.types.map(contractLabel).join(" → ");
    html+="<tr><td><span class='emp-swatch' style='display:inline-block;margin-right:6px;background:"+emp.color+"'></span>"+escAttr(emp.name)+(notes?" <span title='"+escAttr("Report "+(y-1)+" : "+notes)+"' style='cursor:help'>📝</span>":"")+"</td>"+
      "<td class='num'>"+r.rates.map(function(f){ return Math.round(f*100)+" %"; }).join(" → ")+"</td><td>"+contract+"</td>"+
      "<td class='num'>"+r.daysWorked+"</td><td class='num'>"+fmtH(r.worked)+"</td>"+
      "<td class='num'>"+overtime+"</td>"+
      "<td class='num'>"+r.vacation+"</td><td class='num'>"+balance+"</td><td class='num'>"+r.dayoff+"</td><td class='num'>"+r.sick+"</td><td class='num'>"+r.unavailable+"</td>"+
      "<td class='num'>"+(r.satPlanned?r.satOff+" / "+r.satPlanned:"—")+"</td></tr>";
  });
  html+="</tbody><tfoot><tr><td colspan='4'>Total</td><td class='num'>"+fmtH(tot.worked)+"</td><td class='num'>"+fmtDelta(tot.delta)+"</td>"+
    "<td class='num'>"+tot.vacation+"</td><td></td><td class='num'>"+tot.dayoff+"</td><td class='num'>"+tot.sick+"</td><td class='num'>"+tot.unavailable+"</td><td></td></tr></tfoot></table>";
  html+="<p class='hint'>Seules les semaines planifiées sont comptées (heures, cible, samedis) : une semaine imprimée, ou contenant des créneaux générés ou ajoutés à la main — les horaires fixes seuls ne suffisent pas. Jours et heures travaillés, heures sup. : par semaine entière, comptée dans le mois de son samedi (les totaux hebdomadaires font foi). Heures sup. = heures travaillées − cible, sans les reports d'une semaine à l'autre ; sur toute l'année, + les heures reportées de l'année passée (marquées *) ; non calculées pour les contrats horaires et les employés flexibles. Jours d'absence comptés du lundi au vendredi, jours fériés exclus. Solde vacances = jours restants / droit de l'année (vacances à 100 % × taux, au prorata des jours sous contrat, + jours reportés de l'année passée, marqués *). Les employés hors contrat sur la période ne sont pas listés. Samedis libres = samedis sans créneau sur les samedis planifiés (un samedi férié ne compte pas comme samedi libre).</p>";
  el.innerHTML=html;
}

/* ---------- Leave requests (vacances / congé) ---------- */
var LEAVE_TYPE_LABELS={vacation:"Vacances", dayoff:"Congé", unavailable:"Indisponibilité", sick:"Maladie"};
var LEAVE_STATUS_LABELS={pending:"En attente", approved:"Approuvée", rejected:"Refusée"};
var leaveFilter={employee:"", type:"", status:""}; // staff "Demandes" tab only -- not persisted
function renderLeaveTab(){
  var el=document.getElementById("card-leave");
  if(!currentProfile) return;
  if(currentProfile.role==="employee") renderLeaveTabEmployee(el);
  else renderLeaveTabStaff(el);
}
// Admin and manager both decide (a manager's fetch is already scoped to their own store by the
// database's row rules, same as the employee list). Requests whose last day is already past are
// tucked into a collapsed section -- still there for the record, just out of the way day to day.
function renderLeaveTabStaff(el){
  var canDecide=currentProfile.role==="admin" || currentProfile.role==="manager";
  // Overtime hour-log entries (a flexible employee going over their weekly target) show up here
  // alongside leave requests -- same "needs a decision" shape, just a different source table.
  var hourItems=hourLogs.filter(function(h){ return h.overtime; }).map(function(h){
    return {_kind:"hours", id:h.id, employee_id:h.employee_id, type:"overtime", start_date:h.log_date, end_date:h.log_date, note:h.note, status:h.status, hours:h.hours};
  });
  var allItems=leaveRequests.map(function(r){ var c=clone(r); c._kind="leave"; return c; }).concat(hourItems);
  var html="<h2>Demandes de congé</h2>";
  if(!allItems.length){ html+="<p class='empty-note'>Aucune demande.</p>"; el.innerHTML=html; return; }
  var today=dateStr(new Date());
  var empOptions=Array.from(new Set(allItems.map(function(r){ return r.employee_id; })))
    .map(function(id){ var e=getEmployee(id); return {id:id, name:e?e.name:id}; })
    .sort(function(a,b){ return a.name.localeCompare(b.name); });
  var typeLabels=Object.assign({overtime:"Heures supp."}, LEAVE_TYPE_LABELS);
  html+="<div class='row' style='align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap'>";
  html+="<div class='field' style='flex:none;width:180px'><label>Employé</label><select id='lf-emp'><option value=''>Tous</option>"+
    empOptions.map(function(o){ return "<option value='"+o.id+"' "+(leaveFilter.employee===o.id?"selected":"")+">"+escAttr(o.name)+"</option>"; }).join("")+"</select></div>";
  html+="<div class='field' style='flex:none;width:150px'><label>Type</label><select id='lf-type'><option value=''>Tous</option>"+
    Object.keys(typeLabels).map(function(t){ return "<option value='"+t+"' "+(leaveFilter.type===t?"selected":"")+">"+typeLabels[t]+"</option>"; }).join("")+"</select></div>";
  html+="<div class='field' style='flex:none;width:150px'><label>Statut</label><select id='lf-status'><option value=''>Tous</option>"+
    Object.keys(LEAVE_STATUS_LABELS).map(function(s){ return "<option value='"+s+"' "+(leaveFilter.status===s?"selected":"")+">"+LEAVE_STATUS_LABELS[s]+"</option>"; }).join("")+"</select></div>";
  if(leaveFilter.employee || leaveFilter.type || leaveFilter.status) html+="<div class='field' style='flex:none'><button class='btn btn-sm' id='lf-reset'>Réinitialiser</button></div>";
  html+="</div>";

  var filtered=allItems.filter(function(r){
    return (!leaveFilter.employee || r.employee_id===leaveFilter.employee)
      && (!leaveFilter.type || r.type===leaveFilter.type)
      && (!leaveFilter.status || r.status===leaveFilter.status);
  });
  function sortRank(a,b){
    var rank={pending:0, approved:1, rejected:2};

    return a.start_date<b.start_date?1:-1;
  }

  var past=filtered.filter(function(r){ return r.end_date<today; }).sort(sortRank);
  function rowsTable(list){
    var h="<table><thead><tr><th>Employé</th><th>Type</th><th>Du</th><th>Au</th><th># jours</th><th>Note</th><th>Statut</th>"+(canDecide?"<th></th>":"")+"</tr></thead><tbody>";
    list.forEach(function(r){
      var emp=getEmployee(r.employee_id);
      var amount = r._kind==="hours" ? r.hours+"h" : (emp?countLeaveDays(emp, r.start_date, r.end_date):"—");
      h+="<tr data-req-kind='"+r._kind+"' data-req-id='"+r.id+"'><td>"+(emp?escAttr(emp.name):r.employee_id)+"</td>"+
        "<td>"+(typeLabels[r.type]||r.type)+"</td><td>"+r.start_date+"</td><td>"+r.end_date+"</td>"+
        "<td class='num'>"+amount+"</td>"+
        "<td>"+escAttr(r.note||"")+"</td><td><span class='leave-status "+r.status+"'>"+LEAVE_STATUS_LABELS[r.status]+"</span>"+
        (r.cancel_requested?" <span class='leave-status pending' title=\"L'employé(e) a demandé l'annulation de ce congé déjà approuvé\">Annulation demandée</span>":"")+"</td>";
      if(canDecide){
        var actions = r.cancel_requested ?
          "<button class='btn btn-sm btn-danger' data-action='confirm-cancel'>Confirmer l'annulation</button> <button class='btn btn-sm' data-action='keep'>Garder</button>" :
          r.status==="pending" ?
          "<button class='btn btn-sm' data-action='approve'>Approuver</button> <button class='btn btn-sm btn-danger' data-action='reject'>Refuser</button>" :
          "<button class='btn btn-sm' data-action='reopen'>Remettre en attente</button>";
        h+="<td class='row-actions'>"+actions+"</td>";
      }
      h+="</tr>";
    });
    h+="</tbody></table>";
    return h;
  }
  if(!filtered.length) html+="<p class='empty-note'>Aucune demande ne correspond aux filtres.</p>";
  else {
    html+=upcoming.length ? rowsTable(upcoming) : "<p class='empty-note'>Aucune demande à venir.</p>";
    if(past.length) html+="<details style='margin-top:14px'><summary class='setup-group-title'>Demandes passées ("+past.length+")</summary>"+rowsTable(past)+"</details>";
  }
  el.innerHTML=html;
  function filterSelect(id, key){

  var resetBtn=el.querySelector("#lf-reset");
  if(resetBtn) resetBtn.addEventListener("click", function(){ leaveFilter={employee:"", type:"", status:""}; renderLeaveTab(); });
  if(!canDecide) return;
  el.querySelectorAll("tr[data-req-id]").forEach(function(tr){
    var id=tr.getAttribute("data-req-id"), kind=tr.getAttribute("data-req-kind");
    var approveBtn=tr.querySelector("[data-action=approve]");
    if(approveBtn) approveBtn.addEventListener("click", function(){ decideRequestItem(kind, id, "approved").then(renderLeaveTab).catch(function(){}); });
    var rejectBtn=tr.querySelector("[data-action=reject]");
    if(rejectBtn) rejectBtn.addEventListener("click", function(){ decideRequestItem(kind, id, "rejected").then(renderLeaveTab).catch(function(){}); });
    var reopenBtn=tr.querySelector("[data-action=reopen]");
    if(reopenBtn) reopenBtn.addEventListener("click", function(){ decideRequestItem(kind, id, "pending").then(renderLeaveTab).catch(function(){}); });
    var confirmCancelBtn=tr.querySelector("[data-action=confirm-cancel]");
    if(confirmCancelBtn) confirmCancelBtn.addEventListener("click", function(){
      if(!confirm("Confirmer l'annulation de ce congé déjà approuvé ? La demande sera supprimée définitivement.")) return;
      sb.from("leave_requests").delete().eq("id", id).then(function(res){
        if(res.error){ alert("Erreur : "+res.error.message); return; }
        return loadLeaveRequests().then(renderLeaveTab);
      });
    });
    var keepBtn=tr.querySelector("[data-action=keep]");
    if(keepBtn) keepBtn.addEventListener("click", function(){
      sb.from("leave_requests").update({cancel_requested:false}).eq("id", id).then(function(res){
        if(res.error){ alert("Erreur : "+res.error.message); return; }
        return loadLeaveRequests().then(renderLeaveTab);
      });
    });
  });
}
function decideLeaveRequest(id, status){
  return sb.from("leave_requests").update({status:status}).eq("id", id).then(function(res){
    if(res.error){ alert("Erreur : "+res.error.message); throw res.error; }
    return loadLeaveRequests();
  });
}
function decideRequestItem(kind, id, status){
  if(kind==="hours") return sb.from("hour_logs").update({status:status}).eq("id", id).then(function(res){
    if(res.error){ alert("Erreur : "+res.error.message); throw res.error; }
    return loadHourLogs();
  });
  return decideLeaveRequest(id, status);
}

/* ---------- Absences dashboard (admin/manager): a month calendar of who's off and why ---------- */
var absencesPeriod={year:(new Date()).getFullYear(), month:(new Date()).getMonth()};
function holidaysOnDate(ds){
  var scope=managerStoreIds();
  return state.holidays.filter(function(h){
    if(h.date!==ds) return false;
    return !scope || scope.some(function(sid){ return holidayAppliesToStore(h, sid); });
  });
}
// Everyone off on a given day: confirmed absences (from employees' own records -- includes ones an
// approved request already turned into an absence) and, separately, still-pending requests.
function absenceDayInfo(ds){
  var confirmed=[], pending=[];
  state.employees.forEach(function(emp){
    (emp.absences||[]).forEach(function(ab){
      if(ds>=ab.startDate && ds<=ab.endDate) confirmed.push({emp:emp, type:ab.type});
    });
  });
  leaveRequests.forEach(function(lr){
    if(lr.status!=="pending" || ds<lr.start_date || ds>lr.end_date) return;
    var emp=getEmployee(lr.employee_id);
    if(emp) pending.push({emp:emp, type:lr.type, lr:lr});
  });
  return {holidays:holidaysOnDate(ds), confirmed:confirmed, pending:pending};
}
function shiftAbsencesMonth(delta){
  var m=absencesPeriod.month+delta, y=absencesPeriod.year;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  absencesPeriod={year:y, month:m};
  renderAbsencesTab();
}
// One month's calendar grid (dow header + day cells) as a self-contained block.
function buildAbsenceMonthHtml(y, m){
  var startDow=(new Date(y,m,1).getDay()+6)%7; // Monday=0
  var gridStart=new Date(y,m,1-startDow);
  var days=[]; for(var i=0;i<42;i++){ var d=new Date(gridStart); d.setDate(gridStart.getDate()+i); days.push(d); }
  if(days.slice(35).every(function(d){ return d.getMonth()!==m; })) days=days.slice(0,35); // drop an all-next-month trailing row
  var today=dateStr(new Date());
  var html="<div class='abs-cal'><div class='abs-cal-title'>"+MONTH_LABELS[m].charAt(0).toUpperCase()+MONTH_LABELS[m].slice(1)+" "+y+"</div>";
  html+="<div class='abs-dow'>"+DOW_SHORT.map(function(d){ return "<div>"+d+"</div>"; }).join("")+"</div><div class='abs-grid'>";
  days.forEach(function(d){
    var ds=dateStr(d), inMonth=d.getMonth()===m, info=absenceDayInfo(ds);
    var isSun=dowFromDate(d)===6;
    html+="<div class='abs-day"+(inMonth?"":" out")+(ds===today?" today":"")+(isSun?" sun":"")+(info.holidays.length?" holiday":"")+"' data-date='"+ds+"'>";
    html+="<div class='abs-daynum'>"+d.getDate()+"</div>";
    info.holidays.forEach(function(h){ html+="<div class='abs-holiday' title='"+escAttr(h.label||"Férié")+"'>🎉</div>"; });
    html+="<div class='abs-chips'>";
    info.confirmed.forEach(function(x){
      html+="<span class='abs-chip' style='background:"+x.emp.color+"' title='"+escAttr(x.emp.name)+" — "+(LEAVE_TYPE_LABELS[x.type]||x.type)+"'>"+escAttr(x.emp.initials||x.emp.name.charAt(0))+"</span>";
    });
    info.pending.forEach(function(x){
      html+="<span class='abs-chip pending' style='border-color:"+x.emp.color+";color:"+x.emp.color+"' title='"+escAttr(x.emp.name)+" — "+(LEAVE_TYPE_LABELS[x.type]||x.type)+" (en attente)'>"+escAttr(x.emp.initials||x.emp.name.charAt(0))+"</span>";
    });
    html+="</div></div>";
  });
  html+="</div></div>";
  return html;
}

// The logo is whatever image named "logo.*" sits in Data/logo/. A page opened from disk can't list
// a folder, so each common extension is tried in turn and the first one that loads wins.
var LOGO_CANDIDATES=["png","jpg","jpeg","svg","webp","gif"].map(function(ext){ return "Data/logo/logo."+ext; });
var logoSrc=null;
function loadLogo(){
  var i=0;
  (function tryNext(){
    if(i>=LOGO_CANDIDATES.length) return;
    var src=LOGO_CANDIDATES[i++];
    var img=new Image();
    img.onload=function(){
      logoSrc=src;
      var el=document.getElementById("app-logo");
      el.src=src; el.style.display="block";
      document.querySelectorAll(".login-logo").forEach(function(im){ im.src=src; im.hidden=false; });
    };
    img.onerror=tryNext;
    img.src=src;
  })();
}

// A "flexible" (worksFromHome) employee logs their own hours instead of being scheduled in shifts.
// Logging within the week's normal target saves immediately; going over it needs a manager/admin to
// confirm (same shape as a leave request) -- see the "send" policy on hour_logs in schema.sql.
function renderMyHours(){
  var el=document.getElementById("card-myhours");
  if(!el || !currentProfile) return;
  var empId=currentProfile.employee_id, emp=empId && getEmployee(empId);
  if(!emp){ el.innerHTML="<h2>Mes heures</h2><p class='empty-note'>Votre compte n'est lié à aucune fiche employé.</p>"; return; }
  var weekKey=state.ui.currentWeekKey;
  var dates=weekDates(weekKey);
  var weekLabel=weekDisplay(weekKey)+" — "+pad2(dates[0].getDate())+"."+pad2(dates[0].getMonth()+1)+" au "+pad2(dates[6].getDate())+"."+pad2(dates[6].getMonth()+1)+"."+dates[6].getFullYear();
  var scheduled=employeeUsedMinutes(empId, weekKey), logged=weekHourLogMinutes(empId, weekKey);
  var target=employeeTargetMinutes(emp, weekKey), total=scheduled+logged, small=fteInWeek(emp, weekKey)<1;
  var html="<h2>Mes heures</h2>";
  html+="<div class='row' style='align-items:center;gap:10px;margin:4px 0 10px'><button class='btn btn-sm' style='flex:none' id='mh-prev'>‹</button><strong style='flex:none'>"+weekLabel+"</strong><button class='btn btn-sm' style='flex:none' id='mh-next'>›</button><button class='btn btn-sm' style='flex:none' id='mh-today'>Aujourd'hui</button></div>";
  html+="<p class='hint'>Semaine : "+fmtHoursDisplay(scheduled, small)+"h planifiées + "+fmtHoursDisplay(logged, small)+"h imputées = "+fmtHoursDisplay(total, small)+"h / "+fmtHoursDisplay(target, small)+"h cible"+
    (total>target?" <b style='color:var(--danger)'>(+"+fmtHoursDisplay(total-target, small)+"h)</b>":"")+".</p>";

  html+="<h3>Imputer des heures</h3>";
  html+="<table><thead><tr><th>Jour</th><th>Heures</th><th>Note</th><th>Statut</th></tr></thead><tbody>";
  dates.forEach(function(d,i){
    var ds=dateStr(d);
    var entry=hourLogs.filter(function(h){ return h.employee_id===empId && h.log_date===ds; })[0];
    html+="<tr data-date='"+ds+"'>";
    html+="<td style='white-space:nowrap;font-weight:600'>"+DOW_LABELS[i]+" "+pad2(d.getDate())+"."+pad2(d.getMonth()+1)+"</td>";
    html+="<td><input type='number' class='hl-hours' min='0' max='24' step='0.25' style='width:80px' value='"+(entry?Number(entry.hours):"")+"'></td>";
    html+="<td><input type='text' class='hl-note' style='width:100%;min-width:160px' value='"+(entry?escAttr(entry.note||""):"")+"'></td>";
    html+="<td>"+(entry?"<span class='leave-status "+entry.status+"'>"+LEAVE_STATUS_LABELS[entry.status]+"</span>"+(entry.overtime?" <span class='hint'>(heures sup.)</span>":""):"")+"</td>";
    html+="</tr>";
  });
  html+="</tbody></table>";
  html+="<button class='btn btn-sm' id='hl-send' style='margin-top:10px'>Enregistrer la semaine</button>";

  html+="<h3>Historique</h3>";
  var mine=hourLogs.filter(function(h){ return h.employee_id===empId; }).slice().sort(function(a,b){ return a.log_date<b.log_date?1:-1; });
  var cutoff=dateStr(new Date(Date.now()-14*86400000));
  var recent=mine.filter(function(h){ return h.log_date>=cutoff; }), older=mine.filter(function(h){ return h.log_date<cutoff; });
  function rowsTable(list){
    var h="<table><thead><tr><th>Date</th><th>Heures</th><th>Note</th><th>Statut</th><th></th></tr></thead><tbody>";
    list.forEach(function(r){
      h+="<tr data-hl='"+r.id+"'><td>"+r.log_date+"</td><td class='num'>"+r.hours+"</td><td>"+escAttr(r.note||"")+"</td>"+
        "<td><span class='leave-status "+r.status+"'>"+LEAVE_STATUS_LABELS[r.status]+"</span>"+(r.overtime?" <span class='hint'>(heures sup.)</span>":"")+"</td>"+
        "<td><button class='icon-btn' data-action='del-hl' title='Supprimer'>✕</button></td></tr>";
    });
    h+="</tbody></table>";
    return h;
  }
  if(!mine.length) html+="<p class='empty-note'>Aucune heure imputée.</p>";
  else {
    html += recent.length ? rowsTable(recent) : "<p class='empty-note'>Aucune entrée récente.</p>";
    if(older.length) html+="<details style='margin-top:14px'><summary class='setup-group-title'>Plus de 2 semaines ("+older.length+")</summary>"+rowsTable(older)+"</details>";
  }
  el.innerHTML=html;

  document.getElementById("mh-prev").addEventListener("click", function(){ state.ui.currentWeekKey=shiftWeekKey(state.ui.currentWeekKey,-1); saveState(); renderMyHours(); });
  document.getElementById("mh-next").addEventListener("click", function(){ state.ui.currentWeekKey=shiftWeekKey(state.ui.currentWeekKey,1); saveState(); renderMyHours(); });
  document.getElementById("mh-today").addEventListener("click", function(){ state.ui.currentWeekKey=weekKeyOf(new Date()); saveState(); renderMyHours(); });
  // Employees have no update permission on hour_logs (only insert/delete of their own -- see
  // schema.sql), so changing a day's value here deletes its old entry (if any) and inserts a fresh
  // one. Days are processed in order, each checked against a running weekly total, so a later day's
  // overtime warning reflects every earlier day's value already saved this round.
  document.getElementById("hl-send").addEventListener("click", function(){
    var weekTarget=employeeTargetMinutes(emp, weekKey);
    var rows=Array.prototype.slice.call(el.querySelectorAll("tr[data-date]")).map(function(tr){
      var ds=tr.getAttribute("data-date");
      var entry=hourLogs.filter(function(h){ return h.employee_id===empId && h.log_date===ds; })[0];
      var hoursStr=tr.querySelector(".hl-hours").value.trim();
      var newHours=hoursStr===""?null:parseFloat(hoursStr);
      var newNote=tr.querySelector(".hl-note").value.trim();
      var oldHours=entry?Number(entry.hours):null, oldNote=entry?(entry.note||""):"";
      var changed = entry ? (newHours!==oldHours || newNote!==oldNote) : (newHours!=null);
      return {ds:ds, entry:entry, newHours:newHours, newNote:newNote, changed:changed};
    });
    var baseMinutes=scheduled;
    rows.forEach(function(r){ if(!r.changed && r.entry && r.entry.status==="approved") baseMinutes+=Math.round(Number(r.entry.hours)*60); });
    var btn=document.getElementById("hl-send"); btn.disabled=true;
    var chain=Promise.resolve();
    rows.filter(function(r){ return r.changed; }).forEach(function(r){
      chain=chain.then(function(){
        var delPart = r.entry ? sb.from("hour_logs").delete().eq("id", r.entry.id) : Promise.resolve({error:null});
        if(r.newHours==null) return delPart.then(function(res){ if(res.error) throw res.error; }); // cleared: delete only
        var prospective=baseMinutes+Math.round(r.newHours*60);
        var isOvertime=prospective>weekTarget;
        if(isOvertime && !confirm(DOW_LABELS[dowFromDate(parseDateStr(r.ds))]+" "+r.ds+" : cela dépasse votre horaire normal de "+fmtHoursDisplay(prospective-weekTarget, small)+"h cette semaine. Ces heures supplémentaires devront être validées par un responsable. Confirmer ?")) return;
        return delPart.then(function(res){
          if(res.error) throw res.error;
          return sb.from("hour_logs").insert({employee_id:empId, log_date:r.ds, hours:r.newHours, note:r.newNote, overtime:isOvertime, status:isOvertime?"pending":"approved"});
        }).then(function(res){
          if(res.error) throw res.error;
          baseMinutes=prospective;
        });
      });
    });
    chain.then(function(){ return loadHourLogs().then(renderMyHours); })
      .catch(function(err){ alert("Erreur : "+(err&&err.message||err)); btn.disabled=false; });
  });
  el.querySelectorAll("[data-action=del-hl]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id=btn.closest("[data-hl]").getAttribute("data-hl");
      if(!confirm("Supprimer cette entrée ?")) return;
      sb.from("hour_logs").delete().eq("id", id).then(function(res){
        if(res.error){ alert("Erreur : "+res.error.message); return; }
        return loadHourLogs().then(renderMyHours);
      });
    });
  });
}
