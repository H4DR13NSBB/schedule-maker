// Wires the page up and draws it; `state` is already loaded (from the browser or the database).
// Admin léger ("view only"): intercept any click/focus on something that would mutate data and
// show a popup instead of letting it through -- the database refuses the write either way
// (is_write_admin() in schema.sql), this is just about a clean read-only feel instead of a
// confusing failed-save error after the fact. Everything not explicitly allowlisted here as pure
// navigation is treated as a mutation and blocked.
var ADMIN_LIGHT_SAFE=".tab-btn,.store-tab-btn,.nav-item,.nav-toggle,#btn-prev-week,#btn-next-week,#btn-today,"+
  "#mp-prev,#mp-next,#mh-prev,#mh-next,#mh-today,#btn-data-prev,#btn-data-next,#btn-data-year,#data-month,"+
  "#lf-emp,#lf-type,#lf-status,#lf-reset,[data-action=back],[data-action=edit-emp],[data-action=profile],"+
  "[data-action=cancel],[data-action=toggle-archived],#btn-print-all,#btn-files-menu,#btn-export,#btn-export-params,#btn-logout,"+
  ".modal-overlay[data-light-safe]";
function adminLightBlock(){ alert("Mode consultation (admin léger) : vous voyez tout, mais vous ne pouvez rien modifier ici."); }
function setupAdminLightGuard(){
  document.addEventListener("click", function(e){
    if(!isAdminLight()) return;
    var t=e.target.closest("button,[data-action],input[type=checkbox],input[type=radio],input[type=color]");
    if(!t || t.closest(ADMIN_LIGHT_SAFE)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    adminLightBlock();
  }, true);
  document.addEventListener("focusin", function(e){
    if(!isAdminLight()) return;
    var t=e.target, tag=t.tagName, type=(t.type||"").toLowerCase();
    var editable = tag==="SELECT" || tag==="TEXTAREA" || (tag==="INPUT" && ["checkbox","radio","color","button","submit"].indexOf(type)<0);
    if(!editable || t.closest(ADMIN_LIGHT_SAFE)) return;
    t.blur();
    adminLightBlock();
  }, true);
}
function startApp(){
  setupAdminLightGuard();
  lastSavedJSON=JSON.stringify(state);
  document.getElementById("btn-undo").addEventListener("click", undoLastChange);
  document.getElementById("btn-redo").addEventListener("click", redoLastChange);
  updateUndoRedoButtons();
  document.addEventListener("keydown", function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    var key=e.key.toLowerCase();
    var isRedo = key==="y" || (key==="z" && e.shiftKey);
    if(key!=="z" && !isRedo) return;
    var tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input" || tag==="textarea" || e.target.isContentEditable) return;
    e.preventDefault();
    if(isRedo) redoLastChange(); else undoLastChange();
  });
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); }); });
  switchTab("schedule");

  document.getElementById("btn-prev-week").addEventListener("click", function(){ state.ui.currentWeekKey=shiftWeekKey(state.ui.currentWeekKey,-1); saveState(); renderSchedule(); });
  document.getElementById("btn-next-week").addEventListener("click", function(){ state.ui.currentWeekKey=shiftWeekKey(state.ui.currentWeekKey,1); saveState(); renderSchedule(); });
  document.getElementById("btn-today").addEventListener("click", function(){ state.ui.currentWeekKey=weekKeyOf(new Date()); saveState(); renderSchedule(); });

  document.getElementById("btn-sync-fixed").addEventListener("click", function(){
    if(isWeekFrozen(state.ui.currentWeekKey)){ alert(FROZEN_MSG); return; }
    var week=getWeek(state.ui.currentWeekKey);
    var fixScope = genGuardScope();
    var fixSnapshot = fixScope ? week.shifts.filter(function(s){ return fixScope.indexOf(s.storeId)<0; }) : null;
    var beforeCount=week.shifts.filter(function(s){return s.source==="fixed" && (!fixScope || fixScope.indexOf(s.storeId)>=0);}).length;
    week.fixedSynced=false;
    materializeFixedPatterns(state.ui.currentWeekKey);
    if(fixSnapshot) week.shifts = week.shifts.filter(function(s){ return fixScope.indexOf(s.storeId)>=0; }).concat(fixSnapshot);
    var afterCount=week.shifts.filter(function(s){return s.source==="fixed" && (!fixScope || fixScope.indexOf(s.storeId)>=0);}).length;
    saveState(); renderSchedule();
    alert(afterCount+" créneau(x) d'horaire fixe à jour depuis les profils employés ("+beforeCount+" avant).");
  });
  // One button for both jobs: keeping existing auto shifts is identical to a fresh generation on a
  // week without a proposal, and on a week with one it fills the gaps without undoing manual tweaks.
  document.getElementById("btn-generate").addEventListener("click", function(){
    if(isWeekFrozen(state.ui.currentWeekKey)){ alert(FROZEN_MSG); return; }
    runGeneration([state.ui.currentWeekKey], "Cette semaine", true);
  });
  // Month generation starts at the current week: earlier weeks of the month are left as they are.
  document.getElementById("btn-generate-month").addEventListener("click", function(){
    var cur=state.ui.currentWeekKey, ym=weekMonth(cur);
    var weeks=weeksOfMonth(ym.year, ym.month).filter(function(wk){ return wk>=cur; });
    runGeneration(weeks, "La fin de "+MONTH_LABELS[ym.month]+" ("+weeks[0]+(weeks.length>1?" à "+weeks[weeks.length-1]:"")+")");
  });
  // TEMP (test): whole-year generation for trying out the Données tab — remove with its button.
  document.getElementById("btn-generate-year").addEventListener("click", function(){
    var year=weekMonth(state.ui.currentWeekKey).year, weeks=[];
    for(var m=0;m<12;m++) weeks=weeks.concat(weeksOfMonth(year, m));
    if(!confirm("Générer / compléter les "+weeks.length+" semaines de "+year+", y compris les semaines passées ?\nCela peut prendre un moment. « Annuler » en haut annule tout d'un coup.")) return;
    runGeneration(weeks, "L'année "+year, false, true); // already confirmed above
  });
  // Clears generated shifts over the chosen range; frozen weeks are always left untouched.
  document.getElementById("btn-clear-auto").addEventListener("click", function(){
    var scope=document.getElementById("clear-scope").value, cur=state.ui.currentWeekKey;
    var year=weekMonth(cur).year;
    var weeks = scope==="week" ? [cur] : Object.keys(state.weeks).filter(function(wk){
      if(scope==="rest-of-year") return wk>=cur && weekMonth(wk).year===year;
      return true;
    });
    var frozen=weeks.filter(isWeekFrozen);
    weeks=weeks.filter(function(wk){ return !isWeekFrozen(wk) && weekHasAutoShifts(wk, genGuardScope()); }).sort();
    if(!weeks.length){ alert(frozen.length ? "Rien à effacer (semaine(s) figée(s) : "+frozen.join(", ")+")." : "Aucune proposition à effacer sur cette période."); return; }
    var what = weeks.length===1 ? "la semaine "+weeks[0] : "les "+weeks.length+" semaines ("+weeks[0]+" à "+weeks[weeks.length-1]+")";
    if(!confirm("Effacer les créneaux générés automatiquement pour "+what+" ?"+(frozen.length?"\nLes semaines figées ("+frozen.join(", ")+") ne sont pas touchées.":"")+"\nLes horaires fixes et les créneaux placés à la main restent.")) return;
    // One undo step for the whole range.
    var before=lastSavedJSON, undoDepth=undoStack.length;
    var clearScope = genGuardScope();
    var clearSnapshot = clearScope ? weeks.map(function(wk){
      var w=getWeek(wk); return {wk:wk, other:w.shifts.filter(function(s){ return clearScope.indexOf(s.storeId)<0; })};
    }) : null;
    weeks.forEach(clearAutoShifts);
    if(clearSnapshot) clearSnapshot.forEach(function(sn){
      var w=getWeek(sn.wk); w.shifts = w.shifts.filter(function(s){ return clearScope.indexOf(s.storeId)>=0; }).concat(sn.other);
    });
    undoStack.length=undoDepth; undoStack.push(before);
    window.__lastGaps=[];
    renderSchedule();
  });
  document.getElementById("btn-print-all").addEventListener("click", function(){
    askChoice("Imprimer",
      "Choisissez la mise en page.",
      [{label:"Un magasin par page, avec case de signature", value:"full"},
       {label:"Tous les magasins sur une page, sans signatures", value:"compact"}],
      function(mode){
        var title="Plannings — "+weekDisplay(state.ui.currentWeekKey);
        var isAdmin=!currentProfile || currentProfile.role==="admin"; // offline: single user, treated as admin
        if(isAdmin && !isAdminLight()){
          getWeek(state.ui.currentWeekKey).printedAt=new Date().toISOString();
          getWeek(state.ui.currentWeekKey).frozen=true; // a printed / sent week is locked until unticked
          renderSchedule();
          saveState();
          saveJSONFile(stampedFileName("save"), true);
        }
        if(mode==="compact") doPrintCompact(myPrintStores(), title);
        else doPrint(myPrintStores(), title);
      }, true);
  });
  document.getElementById("chk-freeze").addEventListener("change", function(e){
    var week=getWeek(state.ui.currentWeekKey);
    if(e.target.checked) week.frozen=true; else delete week.frozen;
    saveState(); renderSchedule();
  });

  document.getElementById("btn-savedir").addEventListener("click", onSaveDirButton);
  document.getElementById("btn-data-prev").addEventListener("click", function(){ shiftDataPeriod(-1); });
  document.getElementById("btn-data-next").addEventListener("click", function(){ shiftDataPeriod(1); });
  document.getElementById("data-month").addEventListener("change", function(e){ dataPeriod.month=dataPeriod.lastMonth=+e.target.value; renderData(); });
  document.getElementById("btn-data-year").addEventListener("click", function(){
    dataPeriod.month = dataPeriod.month<0 ? dataPeriod.lastMonth : -1;
    renderData();
  });
  document.getElementById("btn-export").addEventListener("click", exportJSON);
  document.getElementById("btn-export-params").addEventListener("click", exportParametersJSON);
  document.getElementById("btn-clear-all").addEventListener("click", clearAllData);
  document.getElementById("btn-import").addEventListener("click", function(){ document.getElementById("file-import").click(); });
  document.getElementById("file-import").addEventListener("change", function(e){
    if(e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value="";
  });

  window.__lastGaps=[];
  loadLogo();
  renderAll();
  initSavesDir();
}

document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
