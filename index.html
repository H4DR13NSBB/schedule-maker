<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Maker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel-2:#f8fafc; --border:#e2e6ec; --border-strong:#cfd6df;
  --text:#18202a; --muted:#667085;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-fg:#ffffff; --accent-soft:rgba(37,99,235,.10); --ring:rgba(37,99,235,.35);
  --danger:#dc2626; --danger-soft:rgba(220,38,38,.08); --warn:#d97706; --warn-soft:rgba(217,119,6,.10); --ok:#16a34a;
  --understaff:#fca5a5; --overstaff:#fde68a; --closed:#e5e7eb; --grid-line:#edf0f4;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 20px 40px -12px rgba(16,24,40,.25), 0 4px 12px rgba(16,24,40,.08);
  --radius:12px; --radius-sm:8px;
  --row-h:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101318; --panel:#191d24; --panel-2:#1f242c; --border:#2b313a; --border-strong:#3a414c;
    --text:#e7eaee; --muted:#9aa4b1;
    --accent:#3b82f6; --accent-hover:#60a5fa; --accent-fg:#0b1220; --accent-soft:rgba(59,130,246,.16); --ring:rgba(59,130,246,.45);
    --danger:#f87171; --danger-soft:rgba(248,113,113,.12); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12); --ok:#4ade80;
    --understaff:#5b2323; --overstaff:#5c4a1a; --closed:#262b33; --grid-line:#232830;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.35);
    --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button{font:inherit;cursor:pointer;}
input,select{font:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* Scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background-color:var(--muted);}
::-webkit-scrollbar-track{background:transparent;}

/* Buttons */
.btn{border:1px solid var(--border-strong);background:var(--panel);color:var(--text);border-radius:var(--radius-sm);padding:6px 12px;font-weight:500;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,color .15s,box-shadow .15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-fg);}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 45%, var(--border));}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:4px 10px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:.5;cursor:default;transform:none;}
.btn:disabled:hover{border-color:var(--border-strong);color:var(--text);}
.icon-btn{background:none;border:none;color:var(--muted);padding:3px 7px;border-radius:6px;transition:background .15s,color .15s;}
.icon-btn:hover{color:var(--danger);background:var(--danger-soft);}

/* Header */
header.topnav{display:flex;align-items:center;gap:16px;padding:10px 20px;background:color-mix(in srgb, var(--panel) 88%, transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:20;}
header.topnav h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;margin-right:12px;}
.app-logo{height:32px;width:auto;display:none;}
.tabs{display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:10px;}
.tab-btn{border:none;background:none;padding:6px 16px;border-radius:7px;color:var(--muted);font-weight:600;transition:background .15s,color .15s,box-shadow .15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.12), 0 0 0 1px var(--border);}
.spacer{flex:1;}
.brand{display:flex;align-items:center;gap:10px;}
.tool-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 7px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);}
header .tool-group{background:var(--bg);box-shadow:none;}
header.topnav{flex-wrap:wrap;row-gap:8px;}
header.topnav h1, header.topnav .btn{white-space:nowrap;}
header .tool-group{flex-wrap:nowrap;}
.group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 6px 0 4px;border-right:1px solid var(--border);margin-right:2px;}
.btn-attention{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);}

/* Setup */
.setup-group{margin-bottom:28px;}
.setup-layout{display:flex;gap:20px;align-items:flex-start;}
.setup-main{flex:1;min-width:0;}
.setup-nav{width:220px;flex:none;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);}
.setup-nav .setup-group-title{margin:14px 0 4px 6px;}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;padding:6px 8px;border-radius:7px;color:var(--text);font-size:13px;transition:background .12s;}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-item.inactive{opacity:.55;}
.nav-item .emp-name{flex:1;}
.setup-nav.collapsed{width:auto;padding:6px;}
.setup-nav.collapsed .nav-body{display:none;}
.nav-toggle{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:13px;margin-bottom:6px;transition:border-color .15s,color .15s;}
.nav-toggle:hover{border-color:var(--accent);color:var(--text);}
.setup-nav.collapsed .nav-toggle{margin:0;}
.setup-main .card{overflow-x:auto;} /* wide tables scroll inside their card instead of spilling out */
.data-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.data-toolbar .period{font-weight:700;min-width:50px;text-align:center;}
.btn.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
#data-table td.num,#data-table th.num{text-align:right;font-variant-numeric:tabular-nums;}
#data-table tfoot td{font-weight:700;border-top:2px solid var(--border-strong);background:var(--panel-2);}
.delta-pos{color:var(--ok);} .delta-neg{color:var(--danger);}
.setup-group-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:0 0 10px 2px;}
summary.setup-group-title{cursor:pointer;user-select:none;}
summary.setup-group-title::marker{font-size:10px;color:var(--muted);}

main{padding:20px;max-width:1500px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:view-in .18s ease-out;}
@keyframes view-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* Cards & tables */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);}
.card h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:18px 0 8px;color:var(--muted);}
table{border-collapse:collapse;width:100%;}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:middle;}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;background:var(--panel-2);white-space:nowrap;}
tbody tr{transition:background .1s;}
tbody tr:hover{background:var(--panel-2);}
tbody tr:last-child td{border-bottom:none;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select{background:var(--panel);border:1px solid var(--border-strong);color:var(--text);border-radius:7px;padding:5px 8px;transition:border-color .15s,box-shadow .15s;}
input[type=text]:hover,input[type=password]:hover,input[type=number]:hover,input[type=date]:hover,input[type=time]:hover,select:hover{border-color:var(--muted);}
input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,input[type=date]:focus,input[type=time]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);}
input::placeholder{color:var(--muted);opacity:.7;}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}
input[type=color]{width:32px;height:26px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;}
.color-swatch-btn{width:32px;height:26px;padding:0;border:1px solid var(--border-strong);border-radius:7px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--panel);transition:transform .12s;}
.color-swatch-btn:hover{transform:scale(1.08);}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.color-swatch{width:32px;height:32px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s;}
.color-swatch:hover{transform:scale(1.1);}
.color-swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--panel) inset;}
.color-swatch.used::after{content:"";position:absolute;inset:0;border-radius:6px;
  background:
    linear-gradient(to top right, transparent calc(50% - 1.5px), rgba(0,0,0,.65) calc(50% - 1.5px), rgba(0,0,0,.65) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    linear-gradient(to top left, transparent calc(50% - 1.5px), rgba(0,0,0,.65) calc(50% - 1.5px), rgba(0,0,0,.65) calc(50% + 1.5px), transparent calc(50% + 1.5px));
}
.row-actions{white-space:nowrap;}
.dow-toggles{display:flex;gap:3px;}
.dow-toggles button{width:30px;height:26px;border:1px solid var(--border-strong);background:var(--panel);color:var(--muted);border-radius:6px;font-size:11px;font-weight:600;padding:0;transition:filter .12s,border-color .12s;}
.dow-toggles button:hover{border-color:var(--accent);filter:brightness(1.05);}
.dow-toggles button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
.dow-toggles:not(.store-toggles) button.on{background:#6b7280;color:#fff;border-color:#6b7280;}
.dow-toggles button.soft{background:#eab308;color:#1c2126;border-color:#eab308;}
.dow-toggles button.mandatory{background:#f97316;color:#fff;border-color:#f97316;}
.dow-chip{display:inline-block;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:600;background:var(--panel-2);color:var(--muted);}
.dow-chip.on{background:var(--accent);color:var(--accent-fg);}
.dow-chip.soft{background:#eab308;color:#1c2126;}
.dow-chip.mandatory{background:#f97316;color:#fff;}
.abs-cal-row{display:flex;gap:20px;margin-top:8px;align-items:flex-start;}
.abs-cal{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;flex:1 1 0;min-width:0;}
.abs-cal-title{padding:8px 10px;font-size:14px;font-weight:700;background:var(--panel-2);border-bottom:1px solid var(--border);}
.abs-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;}
.abs-dow div{padding:5px 6px;}
.abs-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.abs-day{min-height:68px;border:1px solid var(--border);padding:4px 5px;cursor:pointer;transition:background .12s;}
.abs-day:hover{background:var(--accent-soft);}
.abs-day.out{opacity:.35;}
.abs-day.sun{background:color-mix(in srgb, var(--muted) 14%, transparent);}
.abs-day.holiday{background:color-mix(in srgb, #eab308 16%, transparent);}
.abs-day.sun.holiday{background:color-mix(in srgb, #eab308 24%, transparent);}
.abs-day.today{outline:2px solid var(--accent);outline-offset:-2px;}
.abs-day.today .abs-daynum{color:var(--accent);}
.abs-daynum{font-size:12.5px;font-weight:700;margin-bottom:2px;}
.abs-holiday{font-size:11px;color:#eab308;line-height:1;}
.abs-chips{display:flex;flex-wrap:wrap;gap:3px;}
.abs-chip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;color:#111;}
.abs-chip.pending{background:transparent;border:1.5px dashed currentColor;font-weight:700;}
.dow-toggles button.work{background:#16a34a;color:#fff;border-color:#16a34a;}
.dow-toggles button.store-acc-yes{background:#16a34a;color:#fff;border-color:#16a34a;}
.dow-toggles button.store-acc-necessary{background:#eab308;color:#1c2126;border-color:#eab308;}
.dow-toggles button.store-acc-no{background:#6b7280;color:#fff;border-color:#6b7280;}
.empty-note{color:var(--muted);font-style:italic;padding:8px 0;}
.hint{color:var(--muted);font-size:12px;margin-top:4px;}
details>summary{border-radius:6px;padding:2px 4px;}
details>summary:hover{color:var(--text) !important;}

/* Schedule view */
.sched-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.freeze-toggle{display:flex;align-items:center;gap:6px;padding:3px 10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:7px;transition:background .15s,color .15s;}
.freeze-toggle:hover{background:var(--bg);color:var(--text);}
.freeze-toggle.on{color:var(--warn);background:var(--warn-soft);}
.grid-scroll.frozen{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn), var(--shadow);}
.grid-scroll.frozen .shift-block,.grid-scroll.frozen .day-body{cursor:default;}
.sched-actions{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.week-label{font-weight:700;min-width:220px;text-align:center;font-size:14.5px;}
.store-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.store-tab-btn{border:1px solid var(--border-strong);background:var(--panel);color:var(--text);padding:6px 14px;border-radius:999px;font-weight:600;box-shadow:var(--shadow-sm);transition:border-color .15s,color .15s;}
.store-tab-btn:hover{border-color:var(--accent);color:var(--accent);}
.store-tab-btn.active{background:var(--accent);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);border-color:var(--accent);box-shadow:0 2px 6px rgba(16,24,40,.15);}

.summary-bar{display:flex;gap:18px;flex-wrap:wrap;padding:9px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;font-size:13px;box-shadow:var(--shadow-sm);}
.summary-bar:empty{display:none;}
.summary-item{display:flex;align-items:center;gap:7px;}
.summary-dot{width:9px;height:9px;border-radius:50%;}
.summary-item.danger .summary-dot{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
.summary-item.warn .summary-dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);}
.summary-item.ok .summary-dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 15%, transparent);}

.layout{display:flex;gap:16px;align-items:flex-start;}
.sidebar{width:236px;flex:none;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);margin:2px 0 8px;}
.emp-row{display:flex;align-items:center;gap:7px;padding:5px 4px;font-size:12.5px;border-bottom:1px solid var(--border);border-radius:6px;}
.emp-row.draggable{cursor:grab;transition:background .12s;}
.emp-row.draggable:hover{background:var(--accent-soft);}
.emp-row.draggable:active{cursor:grabbing;}
.emp-row:last-child{border-bottom:none;}
.emp-row.has-reserve{border-bottom:none;padding-bottom:1px;}
.emp-reserve{display:flex;justify-content:space-between;gap:6px;padding:0 20px 5px 21px;font-size:11px;color:var(--muted);opacity:.85;border-bottom:1px solid var(--border);cursor:help;}
.emp-reserve:last-child{border-bottom:none;}
.emp-reserve span{font-variant-numeric:tabular-nums;font-weight:500;font-size:10.5px;}
.emp-reserve .delta-neg{color:color-mix(in srgb, var(--danger) 60%, var(--panel));}
.emp-reserve .delta-pos{color:color-mix(in srgb, var(--ok) 60%, var(--panel));}
.emp-swatch{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.emp-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.emp-hours{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.status-dot.under{background:var(--ok);} /* green: still has room */
.status-dot.ok{background:var(--warn);} /* orange: at/on target, full */
.status-dot.over{background:var(--danger);} /* red: over target */

.grid-scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px 12px;flex:1;min-width:0;box-shadow:var(--shadow);}
.grid-flex{display:flex;align-items:flex-start;width:100%;}
.axis-col{flex:none;width:44px;padding-top:46px;}
.axis-label{height:var(--row-h);font-size:10px;color:var(--muted);position:relative;font-variant-numeric:tabular-nums;}
.axis-label span{position:absolute;top:-6px;right:6px;}
.day-col{flex:1 1 0;min-width:110px;border-left:1px solid var(--border);}
.day-head{height:46px;padding:3px 6px;font-size:11.5px;text-align:center;border-bottom:1px solid var(--border-strong);line-height:1.3;}
.day-head .dname{font-weight:700;}
.day-head .ddate{color:var(--muted);}
.day-head .dhours{color:var(--muted);font-size:10px;}
.day-body{position:relative;background:repeating-linear-gradient(to bottom, transparent, transparent calc(var(--row-h) - 1px), var(--grid-line) calc(var(--row-h) - 1px), var(--grid-line) var(--row-h));cursor:crosshair;}
.day-body.drop-target-day{outline:2px dashed var(--accent);outline-offset:-2px;background-color:var(--accent-soft);}
.slot-band{position:absolute;left:0;right:0;pointer-events:none;}
.slot-band.understaff{background:var(--understaff);opacity:.55;}
.slot-band.overstaff{background:var(--overstaff);opacity:.55;}
.slot-band.closed{background:var(--closed);opacity:.9;}
.slot-band.buffer{background:repeating-linear-gradient(45deg, var(--closed), var(--closed) 6px, transparent 6px, transparent 12px);opacity:.6;}
.shift-block{position:absolute;border-radius:6px;font-size:10.5px;font-weight:600;color:#111;padding:2px 5px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.12);cursor:grab;transition:box-shadow .12s, filter .12s;}
.shift-block:hover{box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.18);filter:brightness(1.04);z-index:2;}
.shift-block:active{cursor:grabbing;}
.shift-block.fixed{border:1px dashed rgba(0,0,0,.5);}
.shift-block.conflict{outline:2px solid var(--danger);outline-offset:-2px;}
.shift-block.will-delete{outline:2px dashed var(--danger);outline-offset:-2px;opacity:.5;}
.shift-block.dragging-source{opacity:.35;}
.shift-block .lock-ico{position:absolute;top:1px;right:2px;font-size:9px;}
.handle{position:absolute;left:0;right:0;height:5px;cursor:ns-resize;}
.handle.top{top:0;} .handle.bottom{bottom:0;}
.shift-block:hover .handle.bottom::after{content:"";position:absolute;left:50%;bottom:1px;width:14px;height:2px;margin-left:-7px;border-radius:2px;background:rgba(0,0,0,.35);}
.ghost-block{position:absolute;border:2px dashed var(--accent);border-radius:6px;background:rgba(37,99,235,.15);pointer-events:none;}

.gaps-panel{margin-top:12px;padding:10px 14px;background:var(--warn-soft);border:1px solid color-mix(in srgb, var(--warn) 50%, transparent);border-left:4px solid var(--warn);border-radius:10px;font-size:12.5px;}
.gaps-panel h4{margin:0 0 6px;color:var(--warn);font-size:12.5px;}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,28,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;animation:overlay-in .15s ease-out;}
.modal{background:var(--panel);border-radius:14px;padding:20px 22px;width:380px;max-width:92vw;max-height:85vh;overflow:auto;border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:modal-in .18s cubic-bezier(.2,.8,.3,1);}
@keyframes overlay-in{from{opacity:0;}to{opacity:1;}}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.modal h3{margin:0 0 14px;font-size:16px;font-weight:700;letter-spacing:-.01em;}
.field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
.field label{font-size:12px;font-weight:600;color:var(--muted);}
.field label.opt-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;cursor:pointer;}
.field label.opt-check input{flex:none;margin:1px 0 0;}
.opt-check .opt-title{font-weight:600;color:var(--text);}
.opt-check .opt-desc{font-weight:400;color:var(--muted);}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
#card-detail h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:20px 0 8px;color:var(--muted);padding-top:14px;border-top:1px solid var(--border);}
#card-detail table{max-width:520px;}
.modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;padding-top:14px;border-top:1px solid var(--border);}
.modal-actions .left{display:flex;gap:8px;}

/* ---- Top area: header menu, week navigation, action bar ---- */
.header-actions{display:flex;align-items:center;gap:8px;}
.menu-trigger .caret{font-size:10px;color:var(--muted);margin-left:2px;}
.topnav:has(#btn-savedir.btn-attention) .menu-trigger{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);}
.topnav:has(#btn-savedir.btn-attention) .menu-trigger::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle;}
.menu-panel{position:fixed;inset:auto;top:54px;right:20px;margin:0;min-width:240px;padding:6px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);}
.menu-panel:popover-open{display:flex;flex-direction:column;gap:2px;animation:modal-in .14s ease-out;}
.menu-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);padding:6px 10px 4px;}
.menu-sep{height:1px;background:var(--border);margin:4px 2px;}
.menu-item{width:100%;text-align:left;border-color:transparent;background:none;box-shadow:none;padding:7px 10px;font-size:13px;}
.menu-item:hover{background:var(--bg);border-color:transparent;color:var(--text);}
.menu-item.btn-danger{color:var(--danger);border-color:transparent;}
.menu-item.btn-danger:hover{background:var(--danger-soft);color:var(--danger);}
.menu-item.btn-attention{color:var(--warn);background:var(--warn-soft);border-color:transparent;}

.sched-toolbar{gap:10px;margin-bottom:12px;}
.week-nav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden;}
.week-nav .nav-arrow{border:none;border-radius:0;box-shadow:none;font-size:18px;line-height:1;padding:6px 14px;color:var(--muted);}
.week-nav .nav-arrow:hover{background:var(--bg);color:var(--accent);}
.week-nav .week-label{min-width:0;padding:0 14px;font-size:14.5px;white-space:nowrap;border-left:1px solid var(--border);border-right:1px solid var(--border);align-self:stretch;display:flex;align-items:center;}
.freeze-toggle{border:1px solid transparent;}
.freeze-toggle.on{border-color:color-mix(in srgb, var(--warn) 40%, transparent);}

.action-bar{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin-bottom:14px;}
.action-section{flex:1 1 auto;padding:8px 14px 10px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.action-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);}
.action-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.action-controls select{padding:4px 8px;font-size:12.5px;}
.check-label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap;padding:3px 6px;border-radius:7px;}
.check-label:hover{background:var(--bg);}

/* Active store tab: soft tint of the store colour (set inline by the script) so the name stays readable on any colour */
.store-tabs{gap:6px;margin-bottom:10px;}
.store-tab-btn{padding:5px 14px;font-size:13px;}
.store-tab-btn.active{color:var(--text);text-shadow:none;box-shadow:inset 0 0 0 100px color-mix(in srgb, var(--panel) 78%, transparent);border-width:2px;padding:4px 13px;}
.store-tab-btn.active:hover{color:var(--text);}

.summary-bar{background:transparent;border:none;box-shadow:none;padding:0 2px;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:12px;}

.login-screen{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);}
.login-screen[hidden]{display:none;}
.login-card{width:360px;max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 26px 22px;box-shadow:var(--shadow-lg);}
.login-card[hidden]{display:none;}
.login-logo{display:block;height:96px;width:auto;max-width:100%;margin:0 auto 14px;}
.login-logo[hidden]{display:none;}
.login-card h1{margin:0 0 4px;font-size:20px;letter-spacing:-.01em;}
.login-sub{margin:0 0 18px;color:var(--muted);}
.login-card input{width:100%;padding:8px 10px;font-size:15px;}
.login-error{color:var(--danger);font-size:13px;min-height:18px;margin:-2px 0 8px;}
.login-submit{width:100%;padding:9px;font-size:15px;}
.login-card .hint{text-align:center;margin-top:12px;}
.sync-status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.sync-status:empty{display:none;}
.sync-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
.sync-status.saved{color:var(--ok);}
.sync-status.pending,.sync-status.saving{color:var(--muted);}
.sync-status.error{color:var(--danger);font-weight:600;}
.menu-note{padding:2px 10px 6px;font-size:12.5px;color:var(--text);}
body:not(.is-online) .online-only{display:none;}
body.role-manager .admin-only,body.role-employee .admin-only{display:none!important;}
body.role-manager:not(.is-store-admin) .store-admin-ok,body.role-employee .store-admin-ok{display:none!important;}
body:not(.has-employee-link) .mypage-only,body.role-employee .mypage-only{display:none!important;}
body:not(.is-flex-employee) .flex-hours-only{display:none!important;}
.leave-status{padding:2px 7px;border-radius:999px;font-size:11.5px;font-weight:600;}
.leave-status.pending{background:color-mix(in srgb, orange 20%, transparent);color:orange;}
.leave-status.approved{background:color-mix(in srgb, var(--ok) 20%, transparent);color:var(--ok);}
.leave-status.rejected{background:color-mix(in srgb, var(--danger) 20%, transparent);color:var(--danger);}
body.role-employee .staff-only{display:none!important;}
body.role-employee .shift-block{pointer-events:none;}
body.role-employee .day-body{cursor:default;}
/* Admin léger: never let the planning grid itself be dragged/clicked into an edit -- everything
   else (buttons, inputs) is intercepted in JS with a popup instead, but the grid is dense enough
   that a popup per shift block would be unusable, so it's just inert like an employee's view. */
body.is-admin-light .shift-block{pointer-events:none;}
body.is-admin-light .day-body{cursor:default;}
body.is-admin-light .emp-row.draggable{cursor:default;pointer-events:none;}
.shift-block.not-mine{opacity:.5;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}

/* Phones: most employees only read their schedule and send leave requests here, so the stacked
   single-column layout and bigger tap targets matter more than screen real estate does. */
@media (max-width: 760px){
  main{padding:10px;}
  .card{padding:12px;overflow-x:auto;} /* a wide table scrolls inside its own card instead of the page */
  header.topnav{padding:8px 10px;gap:10px;}
  header.topnav h1{font-size:15px;}
  .tabs{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab-btn{padding:8px 13px;white-space:nowrap;}
  /* align-items:flex-start (set for the desktop side-by-side row) makes a stacked flex child shrink
     to its content's width instead of filling the screen -- which is exactly why a wide table or
     the schedule grid was spilling past the edge instead of getting its own scrollbar. Stretching
     them back to full width lets each child's own overflow-x:auto actually contain and scroll it. */
  .layout,.setup-layout{flex-direction:column;align-items:stretch;}
  .sidebar,.setup-nav,.grid-scroll{width:100%;min-width:0;position:static;max-height:none;}
  .week-label{min-width:0;}
  .btn{padding:8px 13px;}
  .btn-sm{padding:7px 11px;font-size:13px;}
  /* 16px keeps iOS Safari from auto-zooming the page when one of these gets focused */
  input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select{font-size:16px;}
}

#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;}
  .print-page{page-break-after:always;padding:6mm;position:relative;height:246mm;box-sizing:border-box;display:flex;flex-direction:column;}
  .print-page .pbottom-row{display:flex;align-items:stretch;gap:6mm;}
  .print-page .pbottom-row .plegend{flex:none;}
  .print-page .plogo-box{flex:1;display:flex;align-items:flex-start;justify-content:center;min-width:0;}
  .print-page .print-logo{height:40mm;width:auto;max-width:70mm;object-fit:contain;} /* fixed size */
  .print-page:last-child{page-break-after:auto;}
  .print-page h2{margin:0 0 4px;font-size:44px;color:#111;}
  .print-page .sub{color:#444;font-size:16px;margin-bottom:8px;}
  .print-page table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .print-page th,.print-page td{border:1px solid #999;padding:3px 5px;}
  .print-page .pgrid-wrap{display:flex;border:2px solid #000;margin-bottom:6mm;}
  .print-page .pgrid-axis{flex:none;width:13mm;border-collapse:collapse;}
  .print-page .pgrid-axis th,.print-page .pgrid-axis td{border:none;padding:0;font-size:10px;font-weight:600;text-align:right;padding-right:3px;box-sizing:border-box;vertical-align:top;}
  .print-page .pgrid-day{flex:1;border-left:2px solid #000;border-collapse:collapse;table-layout:fixed;}
  .print-page .pgrid-day th{border-bottom:1px solid #999;padding:2px 0;font-size:13px;line-height:1.25;box-sizing:border-box;text-align:center;color:#000;}
  .print-page .pgrid-day td{border:none;box-sizing:border-box;padding:0;}
  .print-page .pgrid-day td.slot-closed{background:#e2e2e2;}
  /* Arrivée / Départ: plain light grey, lighter than a closed store (a patterned fill gets rasterised
     cell by cell and blows the PDF up to tens of MB). */
  .print-page .pgrid-day td.slot-buffer{background:#f0f0f0;}
  .print-page .pgrid-day tr.half td.slot-open,.print-page .pgrid-day tr.half td.slot-buffer{border-bottom:1px dotted #bbb;}
  .print-page .pgrid-block{color:#111;font-weight:700;font-size:10px;line-height:1.15;border:1px solid rgba(0,0,0,.4);box-sizing:border-box;padding:0;position:relative;}
  .print-page .pgrid-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;}
  .print-page .plegend{width:60%;border-collapse:collapse;font-size:18px;}
  .print-page .plegend th,.print-page .plegend td{border:2px solid #000;padding:2px 2px;text-align:center;box-sizing:border-box;line-height:1.1;}
  .print-page .plegend th{font-size:20px;}
  .print-page .plegend td.pname{text-align:left;font-weight:700;color:#111;padding-left:4px;}
  .print-page .psign{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:auto;}
  .print-page .psign th,.print-page .psign td{border:2px solid #000;padding:2px 2px;box-sizing:border-box;line-height:1.1;}
  .print-page .psign th{font-size:22px;}
  .print-page .psign td.psign-name{text-align:left;font-weight:700;color:#111;width:35%;padding-left:6px;font-size:22px;}
  .print-page .psign td.psign-box{width:45%;}
  /* Compact combined printout: natural flowing height instead of forcing exactly one page per
     store, smaller fonts/rows, no signatures -- an overview rather than the per-store document. */
  .print-page-compact{height:auto!important;display:block!important;}
  .print-page-compact .pstore-compact{margin-bottom:5mm;break-inside:avoid;}
  .print-page-compact h3{margin:0 0 2mm;font-size:13px;color:#111;}
  .print-page-compact .pcompact-closed{font-size:10px;color:#444;margin:0 0 4mm;}
  .print-page-compact .pgrid-wrap{margin-bottom:0;}
  .print-page-compact .pgrid-axis th,.print-page-compact .pgrid-axis td{font-size:6.5px;}
  .print-page-compact .pgrid-day th{font-size:7.5px;line-height:1.1;padding:1px 0;}
  .print-page-compact .pgrid-block{font-size:6.5px;}
  .print-page-compact .pgrid-label-h{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;color:#111;font-weight:700;}
  @page{size:A4 portrait;margin:8mm;}
}
</style>

<body>

function toMin(hhmm){ var p=hhmm.split(":"); return (+p[0])*60+(+p[1]); }
function fromMin(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60), mm=m%60; return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm; }
function pad2(n){ return (n<10?"0":"")+n; }
function dateStr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseDateStr(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtHuman(d){ return pad2(d.getDate())+"."+pad2(d.getMonth()+1)+"."+d.getFullYear(); }
function dowFromDate(d){ return (d.getDay()+6)%7; } // Monday=0 ... Sunday=6
function overlap(aS,aE,bS,bE){ return aS<bE && bS<aE; }
function uid(){ return "id"+Math.random().toString(36).slice(2,9)+Date.now().toString(36); }

function isoWeekInfo(date){
  var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  var dayNum=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  var firstThursday=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  var week=1+Math.round(((d-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return {year:d.getUTCFullYear(), week:week};
}
function weekKeyOf(date){ var i=isoWeekInfo(date); return i.year+"-W"+pad2(i.week); }
// Display form of a week key: "2027-W03" -> "2027 S03" (the key itself stays ISO, it is the storage format)
function weekDisplay(weekKey){ return weekKey.replace("-W"," S"); }
function mondayOfISOWeek(year,week){
  var jan4=new Date(year,0,4);
  var jan4Dow=(jan4.getDay()+6)%7;
  var week1Mon=new Date(jan4); week1Mon.setDate(jan4.getDate()-jan4Dow);
  var mon=new Date(week1Mon); mon.setDate(week1Mon.getDate()+(week-1)*7);
  return mon;
}
function weekDates(weekKey){
  var p=weekKey.split("-W"); var mon=mondayOfISOWeek(+p[0], +p[1]);
  var out=[];
  for(var i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); out.push(d); }
  return out;
}
function shiftWeekKey(weekKey, delta){
  var mon=weekDates(weekKey)[0];
  mon.setDate(mon.getDate()+delta*7);
  return weekKeyOf(mon);
}

// Brings data of any age (browser, save file, online database) up to the current format.
function migrateState(raw){
  var s = raw && typeof raw==="object" ? raw : defaultState();
  s.stores = s.stores||[]; s.employees = s.employees||[]; s.staffingRules = s.staffingRules||[];
  s.holidays = s.holidays||[];
  s.staffingRules.forEach(function(r){
    if(r.maxStaff===undefined) r.maxStaff=null;
    if(!Array.isArray(r.dow)) r.dow = r.dow==="all" ? [0,1,2,3,4,5,6] : [r.dow];
  });
  s.stores.forEach(function(store){
    if(!store.hoursHistory && store.hoursByDow){
      store.hoursHistory=[{id:uid(), effectiveFrom:"2000-01-01", effectiveTo:null, label:"Horaire standard", hoursByDow:store.hoursByDow}];
      delete store.hoursByDow;
    }
    if(!store.hoursHistory) store.hoursHistory=[];
    if(store.saturdayLateRule==null) store.saturdayLateRule=false;
    if(!store.lunchClosure) store.lunchClosure={days:[], start:"12:00", end:"13:30"};
    if(store.lunchClosure.days==null) store.lunchClosure.days = store.lunchClosure.enabled ? [0,1,2,3,4,5,6] : [];
    delete store.lunchClosure.enabled;
    var legacyBuffer=store.preOpenBufferMinutes||0;
    store.hoursHistory.forEach(function(period){
      for(var dow=0; dow<7; dow++){
        var h=period.hoursByDow[dow];
        if(h && h.preOpen==null) h.preOpen=fromMin(Math.max(0, toMin(h.open)-legacyBuffer));
      }
    });
    delete store.preOpenBufferMinutes;
  });
  s.employees.forEach(function(emp){
    emp.preferredDaysOff = emp.preferredDaysOff || [];
    emp.mandatoryDaysOff = emp.mandatoryDaysOff || [];
    if(emp.worksFromHome==null) emp.worksFromHome=false;
    // Employment periods: older data had a single contract type with no dates — keep it as one
    // open-ended period so nothing changes until dates are entered.
    if(!Array.isArray(emp.contracts)) emp.contracts=[{id:uid(), startDate:"", endDate:"", type:emp.contractType||"salaried"}];
    // Rate and max working days vary with the contract: move them onto each period.
    emp.contracts.forEach(function(c){
      if(c.fte==null) c.fte=emp.fte||0;
      if(c.minGuaranteedMinutes==null) c.minGuaranteedMinutes=emp.minGuaranteedMinutes||0;
      if(c.maxWorkDays===undefined) c.maxWorkDays = emp.maxWorkDaysOverride!=null ? emp.maxWorkDaysOverride : null;
    });
    if(emp.vacationDaysPerYear===undefined) emp.vacationDaysPerYear=null;
    if(!Array.isArray(emp.yearCarryOvers)) emp.yearCarryOvers=[];
    syncCurrentContract(emp);
    if(emp.minGuaranteedMinutes==null) emp.minGuaranteedMinutes=0;
    (emp.fixedPattern||[]).forEach(function(fp){
      if(fp.breakStart===undefined) fp.breakStart=null;
      if(fp.breakEnd===undefined) fp.breakEnd=null;
    });
    if(emp.saturdayCompensationDay!=null){
      (emp.saturdayCompensationMandatory ? emp.mandatoryDaysOff : emp.preferredDaysOff).push(emp.saturdayCompensationDay);
      emp.saturdayCompensationDay=null; emp.saturdayCompensationMandatory=false;
    }
    if(!emp.storeAccess){
      emp.storeAccess={};
      if(emp.allowedStoreIds && emp.allowedStoreIds.length){
        s.stores.forEach(function(st){ emp.storeAccess[st.id] = emp.allowedStoreIds.indexOf(st.id)>=0 ? "yes" : "no"; });
      }
      emp.allowedStoreIds=null;
    }
  });
  s.holidays.forEach(function(h){ if(h.storeIds===undefined) h.storeIds=null; });
  if(!s.cantonHolidaysSeeded_2026_2028){
    s.cantonHolidaysSeeded_2026_2028=true;
    // Every Swiss public holiday 2026-2028 (national + every canton's own) is added here, unassigned
    // to any store (storeIds:[]) -- which store observes which one is entirely for the admin to pick
    // in the Jours fériés card below, nothing is guessed from store names.
    var merged={};
    [GE_HOLIDAYS, VD_HOLIDAYS, VS_HOLIDAYS].forEach(function(list){
      list.forEach(function(pair){ merged[pair[0]+"|"+pair[1]]={date:pair[0], label:pair[1]}; });
    });
    Object.keys(merged).forEach(function(key){
      var m=merged[key];
      var already=s.holidays.some(function(h){ return h.date===m.date && h.label===m.label; });
      if(already) return;
      s.holidays.push({id:uid(), date:m.date, label:m.label, storeIds:[]});
    });
  }
  s.weeks = s.weeks||{}; s.settings = s.settings || {minShiftMinutes:240,maxShiftMinutes:540};
  delete s.settings.carryFromJan1; // replaced by the per-employee "Report de l'année passée"
  if(s.settings.minShiftMinutes===120) s.settings.minShiftMinutes=240; // bump the old 2h default up to the new 4h floor (never user-editable before now)
  s.ui = s.ui || {currentWeekKey: weekKeyOf(new Date()), currentStoreId:null};
  if(!s.ui.currentStoreId && s.stores.length) s.ui.currentStoreId = s.stores[0].id;
  return s;
}
var undoStack=[];

function saveState(){
  var json=JSON.stringify(state);
  if(lastSavedJSON!==null && json!==lastSavedJSON){
    undoStack.push(lastSavedJSON);
    if(undoStack.length>50) undoStack.shift();
    redoStack.length=0; // a fresh change invalidates whatever could have been redone
  }
  if(json!==lastSavedJSON) localStorage.setItem(SAVED_AT_KEY, String(Date.now()));
  persistState(json);
  lastSavedJSON=json;
  updateUndoRedoButtons();
}
// Online: the database gets the change (see section 2b) and only the view settings stay in the
// browser. Offline (no online database configured): the whole state is kept in the browser.
function persistState(json){
  if(ONLINE){
    try{ localStorage.setItem(UI_KEY, JSON.stringify(state.ui)); }catch(e){}
    scheduleSync();
  } else localStorage.setItem(STORAGE_KEY, json);
}
function undoLastChange(){
  if(!undoStack.length){ alert("Rien à annuler."); return; }
  var prev=undoStack.pop();
  redoStack.push(lastSavedJSON);
  if(redoStack.length>50) redoStack.shift();
  state=JSON.parse(prev);
  lastSavedJSON=prev;
  persistState(prev);
  localStorage.setItem(SAVED_AT_KEY, String(Date.now()));
  updateUndoRedoButtons();
  renderAll();
}
function redoLastChange(){
  if(!redoStack.length){ alert("Rien à rétablir."); return; }
  var next=redoStack.pop();
  undoStack.push(lastSavedJSON);
  if(undoStack.length>50) undoStack.shift();
  state=JSON.parse(next);
  lastSavedJSON=next;
  persistState(next);
  localStorage.setItem(SAVED_AT_KEY, String(Date.now()));
  updateUndoRedoButtons();
  renderAll();
}
function updateUndoRedoButtons(){
  var btn=document.getElementById("btn-redo");
  if(btn) btn.style.display = redoStack.length ? "" : "none";
}

function getStore(id){ return state.stores.find(function(s){return s.id===id;}); }
function getEmployee(id){ return state.employees.find(function(e){return e.id===id;}); }
function getWeek(weekKey){
  if(!state.weeks[weekKey]) state.weeks[weekKey] = { employeeAdjustments:{}, shifts:[], fixedSynced:false, carryOverApplied:false };
  return state.weeks[weekKey];
}
/* Automatic carry-over ("report des écarts"): before a week is generated, each salaried employee's
   gap from the previous week (hours worked − target) is carried into this week's target — hours
   over reduce it, hours missing increase it. It's stored apart from the old manual carry-overs
   (rattrapageMinutes) and recomputed on every generation, so regenerating never stacks it twice.
   Only a planned previous week counts, and one that already got a manual carry-over is skipped. */
// The carried balance never exceeds 8h either way — more would mean a whole extra (or missing) day.
var MAX_CARRY_MINUTES=480;
function applyAutoCarryOver(weekKey){
  var prevKey=shiftWeekKey(weekKey,-1);
  var prev=state.weeks[prevKey];
  var week=getWeek(weekKey);
  week.employeeAdjustments=week.employeeAdjustments||{};
  var usable = prev && weekIsPlanned(prevKey) && !prev.carryOverApplied;
  // The running balance restarts every year (the first week of a year starts from zero); what is
  // left from the year before is entered by hand in the profile ("Report de l'année passée").
  if(weekMonth(prevKey).year!==weekMonth(weekKey).year) usable=false;
  applyYearCarryOver(weekKey);
  state.employees.forEach(function(emp){
    var adj=week.employeeAdjustments[emp.id];
    if(adj) adj.autoCarryMinutes=0; // recomputed from scratch
    if(!usable) return;
    if(emp.reserveOvertime) return; // "heures sup. de côté": the gap stays in reserve, not carried
    if(emp.worksFromHome || contractTypeInWeek(emp, prevKey)==="hourly" || contractTypeInWeek(emp, weekKey)==="hourly") return;
    if(!weekDates(weekKey).some(function(d){ return isEmployedOn(emp, dateStr(d)); })) return; // not under contract this week
    var diff=employeeUsedMinutes(emp.id, prevKey)-employeeTargetMinutes(emp, prevKey);
    if(Math.abs(diff)<1) return;
    adj=week.employeeAdjustments[emp.id]=adj||{vacationMinutes:0, rattrapageMinutes:0, targetOverrideMinutes:null};
    adj.autoCarryMinutes=Math.max(-MAX_CARRY_MINUTES, Math.min(MAX_CARRY_MINUTES, -diff)); // running balance, capped
  });
}
/* Report de l'année passée: the hours balance entered in the profile for year Y−1 is planned into
   year Y, a part of it (MAX_CARRY_MINUTES at most) in each of the year's first weeks where the
   employee has a target — overtime lowers the target, missing hours raise it. What is still to plan
   after a week is kept in week.yearCarryLeft, so each week picks up where the one before stopped
   (the latest earlier week of the same year that exists — oldest weeks take it first). */
function yearCarryEntries(emp, year){
  return (emp.yearCarryOvers||[]).filter(function(c){ return +c.fromYear===year-1; });
}
function yearCarryHoursMinutes(emp, year){
  return yearCarryEntries(emp, year).reduce(function(s,c){ return s+(c.hoursMinutes||0); }, 0);
}
function yearCarryVacationDays(emp, year){
  return yearCarryEntries(emp, year).reduce(function(s,c){ return s+(c.vacationDays||0); }, 0);
}
/* "Heures en réserve" of an employee who sets overtime aside: last year's report plus every planned
   week of the year so far, up to and including `weekKey` (hours worked − target, carries left out). */
function employeeReserveMinutes(emp, weekKey){
  var year=weekMonth(weekKey).year;
  var r=employeePeriodSummary(emp, year+"-01-01", dateStr(weekDates(weekKey)[6]));
  return yearCarryHoursMinutes(emp, year) + (r.hasTarget ? r.worked-r.target : 0);
}
function applyYearCarryOver(weekKey){
  var week=getWeek(weekKey), year=weekMonth(weekKey).year;
  var before=null;
  Object.keys(state.weeks).forEach(function(wk){
    if(wk<weekKey && (!before || wk>before) && weekMonth(wk).year===year) before=wk;
  });
  var leftBefore = before ? (state.weeks[before].yearCarryLeft||{}) : null;
  week.yearCarryLeft={};
  state.employees.forEach(function(emp){
    var adj=week.employeeAdjustments[emp.id];
    if(adj) adj.yearCarryMinutes=0; // recomputed from scratch
    var remaining = emp.reserveOvertime ? 0 : // kept in reserve (see employeeReserveMinutes)
      leftBefore ? (leftBefore[emp.id]||0) : -yearCarryHoursMinutes(emp, year); // overtime (+) → target lowered
    var part=0;
    var eligible = remaining && !emp.worksFromHome && contractTypeInWeek(emp, weekKey)!=="hourly" && !(adj && adj.targetOverrideMinutes!=null);
    if(eligible){

/* Generates (or completes) a list of weeks, planning free Saturdays first: the weekly generator

function weeksOfMonth(year, month){

function planFreeSaturdays(year, month, inRangeWeeks, assigned, notPossible){
  var saturdays=saturdaysInMonth(year, month).map(dateStr);
  var inRange=saturdays.filter(function(ds){ return inRangeWeeks.indexOf(weekKeyOf(parseDateStr(ds)))>=0; });
  if(!inRange.length) return;
  var offCount={}; inRange.forEach(function(ds){ offCount[ds]=0; });
  var options=[];
  state.employees.forEach(function(emp){
    if(emp.waivesMonthlySaturdayOff) return;
    var alreadyFree=saturdays.some(function(ds){
      if(employeeObservesHoliday(emp, ds)) return false; // a public holiday doesn't count as the free Saturday
      if(!isEmployeeAvailable(emp.id, ds, 0, 1440)) return true;
      if(inRange.indexOf(ds)>=0) return false; // about to be (re)generated — decided below
      return !getWeek(weekKeyOf(parseDateStr(ds))).shifts.some(function(s){ return s.employeeId===emp.id && s.date===ds; });
    });
    if(alreadyFree) return;
    var possible=hasFixedPatternDay(emp, 5) ? [] : inRange.filter(function(ds){ // a recurring Saturday shift can't be moved
      if(employeeObservesHoliday(emp, ds)) return false; // closed anyway: can't be their free Saturday
      return !getWeek(weekKeyOf(parseDateStr(ds))).shifts.some(function(s){ return s.employeeId===emp.id && s.date===ds && s.source!=="auto"; });
    });

  options.sort(function(a,b){ return a.possible.length-b.possible.length; });
  options.forEach(function(o){
    if(!o.possible.length){ if(notPossible.indexOf(o.emp.name)<0) notPossible.push(o.emp.name); return; }
    var pick=o.possible.slice().sort(function(a,b){ return offCount[a]-offCount[b] || (a<b?-1:1); })[0];
    offCount[pick]++;

function generateWeeks(weekKeys){
  var frozen=weekKeys.filter(isWeekFrozen);

  weekKeys.forEach(function(wk){ materializeFixedPatterns(wk); });
  var months=[];
  weekKeys.forEach(function(wk){
    var ym=weekMonth(wk);
    if(!months.some(function(m){ return m.year===ym.year && m.month===ym.month; })) months.push(ym);
  });
  var assigned={}, notPossible=[];
  months.forEach(function(m){ planFreeSaturdays(m.year, m.month, weekKeys, assigned, notPossible); });
  // Remember each week's planned free Saturdays: it opens up their compensation day that week.
  weekKeys.forEach(function(wk){ getWeek(wk).freeSaturdays = (assigned[dateStr(weekDates(wk)[5])]||[]).slice(); });
  var gaps=[];
  weekKeys.forEach(function(wk){
    var blocked=[];
    weekDates(wk).map(dateStr).forEach(function(ds){
      (assigned[ds]||[]).forEach(function(empId){ blocked.push({employeeId:empId, date:ds, start:0, end:1440}); });
    });
    applyAutoCarryOver(wk); // after the previous week of the run is done, so gaps chain through
    gaps=gaps.concat(generateDraft(wk, true, blocked).gaps);
  });
  var violators=[];
  months.forEach(function(m){
    monthlySaturdayViolators(m.year, m.month).forEach(function(name){ violators.push(name+" ("+MONTH_LABELS[m.month]+")"); });
  });
  var autoCount=weekKeys.reduce(function(n,wk){ return n+getWeek(wk).shifts.filter(function(s){ return s.source==="auto"; }).length; },0);
  // Salaried staff should end at most 8h under target (the rest can be added by hand); list anyone
  // the generator couldn't bring that close, so it never goes unnoticed.
  var shortfalls=[];
  weekKeys.forEach(function(wk){
    state.employees.forEach(function(emp){
      var missing=salariedShortfall(emp, wk);
      if(missing>MAX_SALARIED_SHORTFALL) shortfalls.push(emp.name+" "+wk+" (−"+(Math.round(missing/6)/10)+"h)");
    });
  });
  return {weekKeys:weekKeys, gaps:gaps, violators:violators, notPossible:notPossible, autoCount:autoCount, shortfalls:shortfalls, frozen:frozen};
}
// Small multiple-choice dialog; onPick receives the chosen option's value (nothing on cancel).
function askChoice(title, text, choices, onPick, safe){
  var root=document.getElementById("modal-root");
  var html="<div class='modal-overlay'"+(safe?" data-light-safe='1'":"")+"><div class='modal' style='width:440px'><h3>"+title+"</h3><p style='margin:0 0 12px'>"+text+"</p>";
  html+="<div style='display:flex;flex-direction:column;gap:8px'>"+choices.map(function(c,i){
    return "<button class='btn"+(i===0?" btn-primary":"")+"' data-choice='"+i+"' style='text-align:left'>"+c.label+"</button>";
  }).join("")+"</div>";
  html+="<div class='modal-actions'><div class='left'></div><button class='btn' data-action='cancel'>Annuler</button></div></div></div>";
  root.innerHTML=html;
  root.querySelectorAll("[data-choice]").forEach(function(btn){
    btn.addEventListener("click", function(){ root.innerHTML=""; onPick(choices[+btn.getAttribute("data-choice")].value); });

/* Shared by the generate buttons. `baseWeeks` is what the button covers from the current week on.
   The single-week button (askLater) lets the user choose whether later weeks that already hold a
   proposal are redone too; the month button stays within its month and only warns instead. */
function runGeneration(baseWeeks, scopeLabel, askLater, skipWarning){
  var lastBase=baseWeeks[baseWeeks.length-1];
  var guardScope = genGuardScope();
  var later=laterGeneratedWeeks(lastBase, guardScope);
  function go(weekKeys){
    // Collapse the per-week saves into a single undo step.
    var before=lastSavedJSON, undoDepth=undoStack.length;
    var guardSnapshot = guardScope ? weekKeys.map(function(wk){
      var w=getWeek(wk); return {wk:wk, other:w.shifts.filter(function(s){ return guardScope.indexOf(s.storeId)<0; })};
    }) : null;
    var r=generateWeeks(weekKeys);
    if(guardSnapshot) guardSnapshot.forEach(function(sn){
      var w=getWeek(sn.wk); w.shifts = w.shifts.filter(function(s){ return guardScope.indexOf(s.storeId)>=0; }).concat(sn.other);
    });
    if(guardScope){
      // The solver ran (and counted) over every store; now that the non-scoped stores' shifts are
      // back to what they were, recount from what's actually left so the summary matches reality.
      r.gaps = r.gaps.filter(function(g){ return guardScope.indexOf(g.storeId)>=0; });
      r.autoCount = weekKeys.reduce(function(n, wk){
        return n + getWeek(wk).shifts.filter(function(s){ return s.source==="auto" && guardScope.indexOf(s.storeId)>=0; }).length;
      }, 0);
    }
    undoStack.length=undoDepth; undoStack.push(before);
    window.__lastGaps=r.gaps;
    renderSchedule();
    if(!r.weekKeys.length){ alert(r.frozen.length ? "Rien à générer : semaine(s) figée(s) ("+r.frozen.join(", ")+")." : "Rien à générer."); return; }
    var msg=(r.weekKeys.length===1 ? "Semaine "+r.weekKeys[0] : r.weekKeys.length+" semaines ("+r.weekKeys[0]+" à "+r.weekKeys[r.weekKeys.length-1]+")")+
      " : "+r.autoCount+" créneau(x) automatique(s), "+r.gaps.length+" manque(s) non résolu(s).";
    if(r.frozen.length) msg+="\n\nSemaine(s) figée(s), non modifiée(s) : "+r.frozen.join(", ")+".";
    if(r.shortfalls.length) msg+="\n\nPlus de 8h sous la cible (aucun jour possible — à compléter à la main) : "+r.shortfalls.join(", ")+".";
    if(r.violators.length) msg+="\n\nSans samedi libre : "+r.violators.join(", ")+".";
    if(r.notPossible.length) msg+="\n(Impossible à libérer — horaire fixe ou créneau manuel tous les samedis : "+r.notPossible.join(", ")+".)";
    alert(msg);
  }
  if(!askLater){
    // Weeks of the range (other than the one shown) that already hold a proposal get completed too.
    var touched=baseWeeks.filter(function(wk){ return wk!==state.ui.currentWeekKey && weekHasAutoShifts(wk, guardScope) && !isWeekFrozen(wk); });
    if(touched.length && !skipWarning && !confirm("Les semaines "+touched.join(", ")+" contiennent déjà une proposition : elles seront aussi complétées / ajustées (samedis libres compris). Les créneaux placés à la main sont conservés, et aucune autre semaine n'est modifiée.\n\nContinuer ?")) return;
    go(baseWeeks);
    return;
  }
  if(!later.length){ go(baseWeeks); return; }
  askChoice("Semaines suivantes déjà générées",
    "Les semaines "+later[0]+(later.length>1?" à "+later[later.length-1]:"")+" contiennent déjà une proposition. Les semaines passées ne sont jamais modifiées ; les créneaux placés à la main sont toujours conservés.",
    [{label:scopeLabel+" seulement", value:"base"},
     {label:scopeLabel+" et les semaines suivantes déjà générées (jusqu'à "+later[later.length-1]+")", value:"all"}],
    function(v){ go(v==="all" ? baseWeeks.concat(later) : baseWeeks); });
}

// Writes the state into the connected save folder, or downloads it when no folder is connected.

// Replaces the whole state with imported data. It goes through loadState() so older files get the
// same migrations as data loaded from the browser; the previous state stays on the undo stack.
function applyImportedData(data){
  if(!data || !Array.isArray(data.stores)) throw new Error("format invalide");
  undoStack.push(lastSavedJSON);
  var ui=state && state.ui;
  state=migrateState(JSON.parse(JSON.stringify(data)));
  if(ONLINE && ui) state.ui=ui; // online, where you stand is your own, not the file's
  lastSavedJSON=null; // forces saveState to write the migrated state and stamp it as fresh
  saveState();
  renderAll();
}

/* Save folder (Data/saves). A page opened from disk can't read a folder by path, so the user picks
   it once through the browser (Edge/Chrome only); the handle is remembered in IndexedDB. On boot
   the newest .json in it is loaded when it is more recent than the data already in the browser,
   and Export writes into it instead of downloading. */
var savesDir=null, savesDirGranted=false;
var localSavedAtOnBoot=0;
function idbHandles(mode, fn){
  return new Promise(function(resolve, reject){
    var req=indexedDB.open("scheduleMaker", 1);
    req.onupgradeneeded=function(){ req.result.createObjectStore("handles"); };
    req.onerror=function(){ reject(req.error); };
    req.onsuccess=function(){
      var tx=req.result.transaction("handles", mode);
      var r=fn(tx.objectStore("handles"));
      tx.oncomplete=function(){ resolve(r && r.result); };
      tx.onerror=function(){ reject(tx.error); };
    };
  });
}

function loadNewestFromSavesDir(interactive){
  var newest=null;
  var it=savesDir.values();
  function next(){
    return it.next().then(function(step){
      if(step.done) return;
      var entry=step.value;
      // Parameters exports hold no schedules, so they're never picked as the save to reload.
      if(entry.kind!=="file" || !/\.json$/i.test(entry.name) || isParametersFileName(entry.name)) return next();
      return entry.getFile().then(function(f){
        if(!newest || f.lastModified>newest.lastModified) newest=f;
        return next();
      });
    });
  }
  return next().then(function(){
    if(!newest){ if(interactive) alert("Aucun fichier .json dans « "+savesDir.name+" »."); return; }
    var when=new Date(newest.lastModified).toLocaleString("fr-CH");
    var localIsNewer = localSavedAtOnBoot && localSavedAtOnBoot>=newest.lastModified;
    if(!interactive && localIsNewer) return; // browser data is more recent than any save — keep it
    // Unknown local age (first time) or a manual reload: ask rather than silently overwrite.
    if(interactive || !localSavedAtOnBoot){
      var msg="Charger « "+newest.name+" » ("+when+") ?\nLes données actuelles seront remplacées (« Annuler » en haut permet de revenir en arrière).";
      if(localIsNewer) msg+="\n\nAttention : les données actuelles sont plus récentes que ce fichier.";
      if(!confirm(msg)) return;
    }
    return newest.text().then(function(txt){ applyImportedData(JSON.parse(txt)); });
  }).catch(function(e){ alert("Échec du chargement depuis le dossier : "+e.message); });
}

function loginEmail(name){ name=name.trim(); return name.indexOf("@")>=0 ? name.toLowerCase() : loginSlug(name)+"@"+LOGIN_DOMAIN; }
function loginPassword(secret){ return /^\d{4,6}$/.test(secret) ? "pin-"+secret+"-code" : secret; }

// The database returns JSON with its keys re-ordered: compare with sorted keys so a row that came
// back unchanged is not taken for a change.
function stableJSON(v){
  if(v===null || typeof v!=="object") return JSON.stringify(v===undefined ? null : v);
  if(Array.isArray(v)) return "["+v.map(stableJSON).join(",")+"]";
  return "{"+Object.keys(v).filter(function(k){ return v[k]!==undefined; }).sort().map(function(k){ return JSON.stringify(k)+":"+stableJSON(v[k]); }).join(",")+"}";
}
var TABLE_COLUMNS={
  stores:["id","position","data"], employees:["id","position","data"], config:["key","data"], weeks:["week_key","data"],
  week_adjustments:["week_key","employee_id","data"], shifts:["id","week_key","store_id","employee_id","date","data"]
};
var TABLE_ORDER=["config","stores","employees","weeks","week_adjustments","shifts"];
function rowKey(table, row){
  if(table==="config") return row.key;
  if(table==="weeks") return row.week_key;
  if(table==="week_adjustments") return row.week_key+"|"+row.employee_id;
  return row.id;
}
function cleanRow(table, row){
  var out={}; TABLE_COLUMNS[table].forEach(function(c){ out[c]=row[c]===undefined ? null : row[c]; });
  return out;
}
function rowEntry(table, row){
  row=cleanRow(table, row);
  return {table:table, key:rowKey(table,row), row:row, json:stableJSON(row)};
}
function stateToRows(s){
  var rows={};
  function put(table, row){ var e=rowEntry(table, row); rows[table+"|"+e.key]=e; }
  s.stores.forEach(function(st,i){ put("stores", {id:st.id, position:i, data:st}); });
  s.employees.forEach(function(e,i){ put("employees", {id:e.id, position:i, data:e}); });
  put("config", {key:"staffingRules", data:s.staffingRules||[]});
  put("config", {key:"holidays", data:s.holidays||[]});
  put("config", {key:"settings", data:s.settings||{}});
  put("config", {key:"meta", data:{version:s.version||1, cantonHolidaysSeeded_2026_2028:!!s.cantonHolidaysSeeded_2026_2028}});
  Object.keys(s.weeks||{}).forEach(function(wk){
    var w=s.weeks[wk], meta={};
    Object.keys(w).forEach(function(k){ if(k!=="shifts" && k!=="employeeAdjustments") meta[k]=w[k]; });
    put("weeks", {week_key:wk, data:meta});
    Object.keys(w.employeeAdjustments||{}).forEach(function(eid){
      put("week_adjustments", {week_key:wk, employee_id:eid, data:w.employeeAdjustments[eid]});
    });
    (w.shifts||[]).forEach(function(sh){
      put("shifts", {id:sh.id, week_key:wk, store_id:sh.storeId, employee_id:sh.employeeId||null, date:sh.date, data:sh});
    });
  });
  return rows;
}
function rowsToState(rows){
  var s={version:1, stores:[], employees:[], staffingRules:[], holidays:[], settings:null, weeks:{}};
  var byTable={}; Object.keys(rows).forEach(function(k){ var e=rows[k]; (byTable[e.table]=byTable[e.table]||[]).push(e.row); });
  function sorted(t){ return (byTable[t]||[]).slice().sort(function(a,b){ return a.position-b.position; }).map(function(r){ return clone(r.data); }); }
  s.stores=sorted("stores"); s.employees=sorted("employees");
  (byTable.config||[]).forEach(function(r){
    if(r.key==="meta"){ s.version=r.data.version||1; s.cantonHolidaysSeeded_2026_2028=!!r.data.cantonHolidaysSeeded_2026_2028; }
    else s[r.key]=clone(r.data);
  });
  function week(wk){ return s.weeks[wk] || (s.weeks[wk]={shifts:[], employeeAdjustments:{}}); }
  (byTable.weeks||[]).forEach(function(r){ var w=week(r.week_key); Object.keys(r.data||{}).forEach(function(k){ w[k]=clone(r.data[k]); }); });
  (byTable.week_adjustments||[]).forEach(function(r){ week(r.week_key).employeeAdjustments[r.employee_id]=clone(r.data); });
  (byTable.shifts||[]).slice().sort(function(a,b){ return (a.date+(a.data.start||"")+a.id)<(b.date+(b.data.start||"")+b.id)?-1:1; })
    .forEach(function(r){ week(r.week_key).shifts.push(clone(r.data)); });
  if(!s.settings) delete s.settings;
  return s;
}
function clone(v){ return v==null ? v : JSON.parse(JSON.stringify(v)); }

// A manager only sees/edits their own store(s); null means "no restriction" (admin, or offline).
function isManager(){ return !!(currentProfile && currentProfile.role==="manager"); }
function managerStoreIds(){ return isManager() ? (currentProfile.store_ids||[]) : null; }
// A manager granted "admin privilege": full admin rights, confined to their own store(s).
function isStoreAdmin(){ return isManager() && !!currentProfile.store_admin; }
function isTrueAdmin(){ return !!(currentProfile && currentProfile.role==="admin"); }
// "Admin léger": sees exactly what a true admin sees, but every write is refused server-side
// (RLS's is_write_admin()) and the page itself intercepts clicks on anything that would mutate data.
function isAdminLight(){ return isTrueAdmin() && !!currentProfile.view_only; }
// Has admin-level UI access (full admin, or a store-admin manager) -- still store-scoped for the latter.
function hasAdminAccess(){ return isTrueAdmin() || isStoreAdmin(); }
// Generate / Effacer / Actualiser horaires fixes all act on just the currently selected store tab,
// for everyone (not only a store admin) -- the solver itself has no notion of store scope (it runs
// over the whole week), so every entry point snapshots every other store's shifts first and
// restores them afterward, discarding whatever the solver computed for them.
function genGuardScope(){ return state.ui.currentStoreId ? [state.ui.currentStoreId] : null; }
// Planning scope for the signed-in person: a manager's own store(s), an employee's own store(s)
// (wherever their storeAccess allows working), or null for admin/offline (no restriction).
function myStoreScope(){
  if(!currentProfile) return null;
  if(currentProfile.role==="manager") return currentProfile.store_ids||[];
  if(currentProfile.role==="employee"){
    var emp=currentProfile.employee_id && getEmployee(currentProfile.employee_id);
    if(!emp) return [];
    return state.stores.filter(function(s){ return storeAccessState(emp, s.id)!=="no"; }).map(function(s){ return s.id; });
  }
  return null;
}
// What this user may send (the database checks it again; this only avoids refused requests).
function mayWrite(entry){
  if(!currentProfile) return false;
  if(currentProfile.role==="admin") return true;
  if(currentProfile.role==="manager"){
    if(entry.table==="shifts") return (currentProfile.store_ids||[]).indexOf(entry.row.store_id)>=0 && !isWeekFrozen(entry.row.week_key);
    if(entry.table==="config" && entry.row.key==="holidays") return true; // managers may add holidays for their own store
    if(entry.table==="config" && entry.row.key==="staffingRules") return isStoreAdmin(); // store admin only
    if(entry.table==="stores") return isStoreAdmin() && (currentProfile.store_ids||[]).indexOf(entry.row.id)>=0;
    // managers may add/change absences for their own employees; a store admin may change the whole
    // record. state.employees for a manager only ever contains rows the "employees" read policy
    // already scoped to their store, so anything present locally is fair game to push -- the
    // server-side trigger rejects any other field change for a plain manager (not a store admin).
    if(entry.table==="employees") return true;
  }
  return false;
}
// Login accounts: the admin sees every profile; a store admin sees their own plus the employee
// accounts of their own store(s) (RLS scopes the rest to nothing).
function loadAccounts(){
  if(!sb || !currentProfile || !hasAdminAccess()) return Promise.resolve();
  return sb.from("profiles").select("*").then(function(res){
    if(res.error){ console.error("loadAccounts failed", res.error); return; }
    accountsByEmployee={}; accountsByUserId={};
    (res.data||[]).forEach(function(p){ accountsByUserId[p.user_id]=p; if(p.employee_id) accountsByEmployee[p.employee_id]=p; });
  });
}
// Leave requests (vacances / congé / indisponibilité / maladie): the database's row rules already
// scope what comes back -- an employee's own, a manager's own store(s), or everything for the admin.
var leaveRequests=[];
function loadLeaveRequests(){
  if(!sb || !currentProfile) return Promise.resolve();
  return sb.from("leave_requests").select("*").order("start_date",{ascending:false}).then(function(res){
    if(res.error){ console.error("loadLeaveRequests failed", res.error); return; }
    leaveRequests=res.data||[];
  });
}
// Hours a "flexible" (worksFromHome) employee logs themselves instead of being scheduled in shifts
// -- same read scope as leave requests (own / own store's / everyone for the admin).
var hourLogs=[];
function loadHourLogs(){
  if(!sb || !currentProfile) return Promise.resolve();
  return sb.from("hour_logs").select("*").order("log_date",{ascending:false}).then(function(res){
    if(res.error){ console.error("loadHourLogs failed", res.error); return; }
