  });
}
// Calls the "manage-account" edge function (create/update/set-secret/delete a login) — admin only.
function manageAccount(action, payload){
  var body=Object.assign({action:action}, payload||{});
  return sb.functions.invoke("manage-account", {body:body}).then(function(res){
    if(res.error){
      // supabase-js only gives a generic "non-2xx" message here; the real reason is the JSON body
      // our function sent, reachable via error.context (the raw Response) on a FunctionsHttpError.
      var ctx=res.error.context;
      if(ctx && typeof ctx.json==="function"){
        return ctx.json().then(function(body){ throw new Error((body && body.error) || res.error.message); },
          function(){ throw new Error(res.error.message||String(res.error)); });
      }
      throw new Error(res.error.message||String(res.error));
    }
    if(res.data && res.data.error) throw new Error(res.data.error);
    return res.data;
  });
}
function scheduleSync(){
  if(!sb || !currentProfile) return;
  setSyncStatus("pending");
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncNow, 600);
}
function syncNow(){
  if(!sb || !currentProfile) return;
  if(syncBusy){ syncAgain=true; return; }
  var local=stateToRows(state), upserts={}, deletes={}, sent=[];
  Object.keys(local).forEach(function(k){
    var e=local[k], old=serverRows[k];
    if(old && old.json===e.json) return;
    if(!mayWrite(e) || (old && !mayWrite(old))) return; // e.g. a manager's view of another shop
    (upserts[e.table]=upserts[e.table]||[]).push(e.row); sent.push(["set",k,e]);
  });
  Object.keys(serverRows).forEach(function(k){
    if(local[k]) return;
    var old=serverRows[k];
    if(!mayWrite(old)) return;
    (deletes[old.table]=deletes[old.table]||[]).push(old.row); sent.push(["del",k,old]);
  });
  if(!sent.length){ setSyncStatus("saved"); return; }
  syncBusy=true; setSyncStatus("saving");
  var jobs=[];
  TABLE_ORDER.forEach(function(t){
    var ups=upserts[t]||[];
    for(var i=0;i<ups.length;i+=500){
      jobs.push(sb.from(t).upsert(ups.slice(i,i+500), t==="week_adjustments"?{onConflict:"week_key,employee_id"}:undefined));
    }
    var dels=deletes[t]||[];
    if(!dels.length) return;
    if(t==="week_adjustments"){
      var byWeek={}; dels.forEach(function(r){ (byWeek[r.week_key]=byWeek[r.week_key]||[]).push(r.employee_id); });
      Object.keys(byWeek).forEach(function(wk){ jobs.push(sb.from(t).delete().eq("week_key",wk).in("employee_id",byWeek[wk])); });
    } else {
      var col=TABLE_COLUMNS[t][0];
      for(var j=0;j<dels.length;j+=200) jobs.push(sb.from(t).delete().in(col, dels.slice(j,j+200).map(function(r){ return r[col]; })));
    }
  });
  Promise.all(jobs.map(function(p){ return p.then(function(res){ if(res.error) throw res.error; return res; }); })).then(function(){
    sent.forEach(function(s){ if(s[0]==="set") serverRows[s[1]]=s[2]; else delete serverRows[s[1]]; });
    syncBusy=false;
    if(syncAgain){ syncAgain=false; syncNow(); } else setSyncStatus("saved");
  }).catch(function(err){
    syncBusy=false;
    console.error("Sync failed", err);
    setSyncStatus("error", err && err.message);
    // Some requests may have gone through: re-read the server state before trying again.
    clearTimeout(syncRetryTimer);
    syncRetryTimer=setTimeout(function(){ refreshServerRows().then(syncNow); }, 5000);
  });
}
function setSyncStatus(st, detail){
  var el=document.getElementById("sync-status");
  if(!el) return;
  el.className="sync-status "+st;
  el.textContent={pending:"Modifié", saving:"Enregistrement…", saved:"Enregistré", error:"Non enregistré — nouvel essai…", offline:"Hors ligne"}[st]||"";
  el.title = st==="error" ? "La dernière modification n'a pas pu être enregistrée en ligne"+(detail?" : "+detail:"")+". Nouvel essai automatique." :
    st==="saved" ? "Toutes les modifications sont enregistrées en ligne." : "";
}
// Warn before closing the page while a change is not saved online yet.
window.addEventListener("beforeunload", function(e){
  var st=document.getElementById("sync-status");
  if(ONLINE && st && /pending|saving|error/.test(st.className)){ e.preventDefault(); e.returnValue=""; }
});

// Reads every table (1000 rows per request is Supabase's cap).
function fetchAll(table){
  var out=[];
  function page(from){
    return sb.from(table).select(TABLE_COLUMNS[table].join(",")).range(from, from+999).then(function(res){
      if(res.error) throw res.error;
      out=out.concat(res.data);
      return res.data.length===1000 ? page(from+1000) : out;
    });
  }
  return page(0);
}
function refreshServerRows(){
  return Promise.all(TABLE_ORDER.map(function(t){ return fetchAll(t).then(function(rows){ return [t,rows]; }); })).then(function(all){
    var fresh={};
    all.forEach(function(pair){ pair[1].forEach(function(r){ var e=rowEntry(pair[0], r); fresh[pair[0]+"|"+e.key]=e; }); });
    serverRows=fresh;
    return fresh;
  });
}

// Live changes from other people: merge the row into the state and redraw.
var leaveRefreshTimer=null, hourLogRefreshTimer=null;
function onRemoteChange(p){
  var table=p.table;
  if(table==="leave_requests"){
    clearTimeout(leaveRefreshTimer);
    leaveRefreshTimer=setTimeout(function(){
      loadLeaveRequests().then(function(){ if(document.getElementById("view-leave").classList.contains("active")) renderLeaveTab(); });
    }, 400);
    return;
  }
  if(table==="hour_logs"){
    clearTimeout(hourLogRefreshTimer);
    hourLogRefreshTimer=setTimeout(function(){
      loadHourLogs().then(function(){
        if(document.getElementById("view-leave").classList.contains("active")) renderLeaveTab();
        if(document.getElementById("view-myhours") && document.getElementById("view-myhours").classList.contains("active")) renderMyHours();
      });
    }, 400);
    return;
  }
  if(!TABLE_COLUMNS[table]) return;
  if(p.eventType==="DELETE"){
    var gone=rowEntry(table, p.old||{}), k=table+"|"+gone.key;
    if(!serverRows[k]) return;
    var old=serverRows[k]; delete serverRows[k];
    removeRowFromState(old);
  } else {
    var e=rowEntry(table, p.new), key=table+"|"+e.key;
    if(serverRows[key] && serverRows[key].json===e.json) return; // our own change coming back
    var prev=serverRows[key];
    serverRows[key]=e;
    if(prev && prev.table==="shifts" && prev.row.week_key!==e.row.week_key) removeRowFromState(prev);
    putRowInState(e);
  }
  lastSavedJSON=JSON.stringify(state); // a change from someone else is not something to undo here
  scheduleRemoteRender();
}
function putRowInState(e){
  var r=e.row, list, i;
  if(e.table==="stores" || e.table==="employees"){
    list=state[e.table]; i=list.findIndex(function(x){ return x.id===r.id; });
    if(i>=0) list[i]=clone(r.data); else list.splice(Math.min(r.position, list.length), 0, clone(r.data));
    if(e.table==="employees") migrateState(state); // fills in defaults a remote record may lack
  } else if(e.table==="config"){
    if(r.key==="meta"){ state.version=r.data.version||1; state.cantonHolidaysSeeded_2026_2028=!!r.data.cantonHolidaysSeeded_2026_2028; }
    else state[r.key]=clone(r.data);
  } else if(e.table==="weeks"){
    var w=getWeek(r.week_key), keep={shifts:w.shifts, employeeAdjustments:w.employeeAdjustments};
    Object.keys(w).forEach(function(k){ delete w[k]; });
    Object.keys(r.data||{}).forEach(function(k){ w[k]=clone(r.data[k]); });
    w.shifts=keep.shifts; w.employeeAdjustments=keep.employeeAdjustments;
  } else if(e.table==="week_adjustments"){
    var wa=getWeek(r.week_key); wa.employeeAdjustments=wa.employeeAdjustments||{};
    wa.employeeAdjustments[r.employee_id]=clone(r.data);
  } else if(e.table==="shifts"){
    var ws=getWeek(r.week_key); i=ws.shifts.findIndex(function(x){ return x.id===r.id; });
    if(i>=0) ws.shifts[i]=clone(r.data); else ws.shifts.push(clone(r.data));
  }
}
function removeRowFromState(e){
  var r=e.row;
  if(e.table==="stores" || e.table==="employees") state[e.table]=state[e.table].filter(function(x){ return x.id!==r.id; });
  else if(e.table==="weeks") delete state.weeks[r.week_key];
  else if(e.table==="week_adjustments"){ if(state.weeks[r.week_key]) delete (state.weeks[r.week_key].employeeAdjustments||{})[r.employee_id]; }
  else if(e.table==="shifts"){ if(state.weeks[r.week_key]) state.weeks[r.week_key].shifts=state.weeks[r.week_key].shifts.filter(function(x){ return x.id!==r.id; }); }
}
// Redraw after a remote change, but not in the middle of a drag or while something is being typed.
function scheduleRemoteRender(){
  clearTimeout(remoteRenderTimer);
  remoteRenderTimer=setTimeout(function(){
    var a=document.activeElement, typing=a && /^(input|select|textarea)$/i.test(a.tagName) && a.closest("#card-detail, .modal");
    if(dragState || typing || document.querySelector(".modal-overlay")){ scheduleRemoteRender(); return; }
    renderAll();
  }, 400);
}

/* Sign-in and start-up */
function showLoginScreen(message){
  var el=document.getElementById("login-screen");
  el.hidden=false;
  document.getElementById("login-form").hidden=false;
  document.getElementById("login-wait").hidden=true;
  document.getElementById("login-error").textContent=message||"";
  setTimeout(function(){ document.getElementById("login-name").focus(); }, 0);
}
function showLoginWait(text){
  var el=document.getElementById("login-screen");
  el.hidden=false;
  document.getElementById("login-form").hidden=true;
  document.getElementById("login-wait").hidden=false;
  document.getElementById("login-wait-text").textContent=text;
}
function initOnline(){
  loadLogo(); // so it's already on the login card too, not just the header shown after signing in
  sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  document.getElementById("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    var name=document.getElementById("login-name").value, secret=document.getElementById("login-secret").value;
    if(!name.trim() || !secret){ document.getElementById("login-error").textContent="Entrez votre prénom et votre mot de passe."; return; }
    showLoginWait("Connexion…");
    sb.auth.signInWithPassword({email:loginEmail(name), password:loginPassword(secret)}).then(function(res){
      if(res.error){
        var msg=/invalid/i.test(res.error.message) ? "Prénom ou mot de passe incorrect." :
          /rate|too many/i.test(res.error.message) ? "Trop d'essais. Réessayez dans quelques minutes." : res.error.message;
        document.getElementById("login-secret").value="";
        showLoginScreen(msg);
        return;
      }
      bootOnline(res.data.user);
    });
  });
  document.getElementById("btn-logout").addEventListener("click", function(){
    if(/pending|saving|error/.test(document.getElementById("sync-status").className) &&
       !confirm("Des modifications ne sont pas encore enregistrées en ligne. Se déconnecter quand même ?")) return;
    sb.auth.signOut().then(function(){ location.reload(); });
  });
  showLoginWait("Chargement…");
  sb.auth.getSession().then(function(res){
    var session=res.data && res.data.session;
    if(session) bootOnline(session.user); else showLoginScreen();
  }).catch(function(){ showLoginScreen("Impossible de joindre le serveur. Vérifiez la connexion internet."); });
}
function bootOnline(user){
  showLoginWait("Chargement des données…");
  sb.from("profiles").select("*").eq("user_id", user.id).maybeSingle().then(function(res){
    if(res.error) throw res.error;
    if(!res.data){ sb.auth.signOut(); showLoginScreen("Ce compte n'a pas encore de profil. Contactez l'administrateur."); return; }
    currentProfile=res.data;
    return Promise.all([refreshServerRows(), loadAccounts(), loadLeaveRequests(), loadHourLogs()]).then(function(results){
      var rows=results[0];
      var empty=!Object.keys(rows).some(function(k){ return rows[k].table==="stores" || rows[k].table==="employees"; });
      var local=null;
      try{ local=JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){}
      var s;
      if(empty && currentProfile.role==="admin" && local && (local.employees||[]).length &&
         confirm("La base en ligne est vide.\n\nY copier les données enregistrées dans ce navigateur ("+local.employees.length+" employé(s), "+(local.stores||[]).length+" magasin(s), "+Object.keys(local.weeks||{}).length+" semaine(s)) ?\n\n(Annuler : partir des magasins par défaut. Vous pourrez aussi importer un fichier .json.)")){
        s=local;
      } else s = empty ? null : rowsToState(rows);
      state=migrateState(s);
      try{ var ui=JSON.parse(localStorage.getItem(UI_KEY)); if(ui && ui.currentWeekKey) state.ui=ui; }catch(e){}
      document.body.classList.remove("role-admin","role-manager","role-employee");
      document.body.classList.add("role-"+currentProfile.role);
      document.body.classList.toggle("is-store-admin", isStoreAdmin());
      document.body.classList.toggle("has-employee-link", !!currentProfile.employee_id);
      var linkedEmp=currentProfile.employee_id && getEmployee(currentProfile.employee_id);
      document.body.classList.toggle("is-flex-employee", currentProfile.role==="employee" && !!(linkedEmp && linkedEmp.worksFromHome));
      document.body.classList.toggle("is-admin-light", isAdminLight());
      var scope=myStoreScope();
      if(scope && state.stores.length && !scope.some(function(id){ return id===state.ui.currentStoreId; }))
        state.ui.currentStoreId = scope[0] || (state.stores[0] ? state.stores[0].id : null);
      if(state.ui.currentStoreId && !getStore(state.ui.currentStoreId)) state.ui.currentStoreId = state.stores[0] ? state.stores[0].id : null;
      document.getElementById("login-screen").hidden=true;
      document.getElementById("account-label").textContent=currentProfile.display_name+" · "+({admin:"administrateur", manager:"gérant(e)", employee:"employé(e)"}[currentProfile.role]||currentProfile.role)+(isAdminLight()?" (lecture seule)":"");
      document.getElementById("tab-leave-btn").textContent = currentProfile.role==="employee" ? "Mes demandes" : "Demandes";
      startApp();
      scheduleSync(); // sends what the migration or the first import changed (admin only)
      sb.channel("db").on("postgres_changes", {event:"*", schema:"public"}, onRemoteChange).subscribe();
    });
  }).catch(function(err){ showLoginScreen("Erreur au chargement : "+(err && err.message || err)); });
}

/* ---------- 3. Domain selectors ---------- */
function resolveStoreHoursEntry(store, ds){
  var matches=store.hoursHistory.filter(function(h){ return h.effectiveFrom<=ds && (!h.effectiveTo || ds<=h.effectiveTo); });
  if(!matches.length) return null;
  matches.sort(function(a,b){

}
function findAbsenceConflicts(weekKey){
  var week=getWeek(weekKey);
  return week.shifts.filter(function(s){ return !isEmployeeAvailable(s.employeeId, s.date, toMin(s.start), toMin(s.end)); });
}
function findStoreRestrictionConflicts(weekKey){
  var week=getWeek(weekKey);
  return week.shifts.filter(function(s){
    var emp=getEmployee(s.employeeId);
    return emp && !employeeAllowedAtStore(emp, s.storeId);
  });
}
function findFixedPatternOverageConflicts(weekKey){
  var week=getWeek(weekKey);
  return week.shifts.filter(function(s){
    var emp=getEmployee(s.employeeId); if(!emp) return false;
    var dow=dowFromDate(parseDateStr(s.date));
    var dayPatterns=(emp.fixedPattern||[]).filter(function(fp){return fp.dow===dow;});
    if(!dayPatterns.length) return false;
    return !dayPatterns.some(function(fp){ return toMin(s.start)>=toMin(fp.startTime) && toMin(s.end)<=toMin(fp.endTime); });

function findShortShiftConflicts(weekKey){

  // (e.g. morning + afternoon around a lunch break) is fine as long as the total reaches it.
  var week=getWeek(weekKey);
  var minMin=(state.settings.minShiftMinutes)||240;
  var byEmpDate={};
  week.shifts.forEach(function(s){
    var key=s.employeeId+"|"+s.date;
    (byEmpDate[key]=byEmpDate[key]||[]).push(s);
  });
  var flagged=[];
  Object.keys(byEmpDate).forEach(function(key){
    var list=byEmpDate[key];
    var total=list.reduce(function(sum,s){ return sum+(toMin(s.end)-toMin(s.start)); },0);
    if(total<minMin) flagged=flagged.concat(list);
  });

}
function findMissingBreakConflicts(weekKey){
  // Flags a day (any shift source — auto, fixed, or manual) whose total on-site span doesn't
  // contain the break its total worked time requires: 30min at 5.5h+, a full 1h over 6h.
  var week=getWeek(weekKey);
  var byEmpDate={};
  week.shifts.forEach(function(s){
    var key=s.employeeId+"|"+s.date;
    (byEmpDate[key]=byEmpDate[key]||[]).push(s);
  });
  var flagged=[];
  Object.keys(byEmpDate).forEach(function(key){
    var list=byEmpDate[key].slice().sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
    var totalWork=list.reduce(function(sum,s){ return sum+(toMin(s.end)-toMin(s.start)); },0);
    var required=requiredBreakMinutes(totalWork);
    if(required<=0) return;
    var totalSpan=toMin(list[list.length-1].end)-toMin(list[0].start);
    if((totalSpan-totalWork)<required) flagged=flagged.concat(list);
  });

}
function splitGapTolerance(storeIdA, storeIdB, ds){
  if(storeIdA!==storeIdB) return 60;
  var closure=storeLunchClosure(getStore(storeIdA), ds);
  return closure ? Math.max(60, toMin(closure.end)-toMin(closure.start)) : 60;
}
function findSplitGapConflicts(weekKey){
  var week=getWeek(weekKey);
  var byEmpDate={};
  week.shifts.forEach(function(s){
    var key=s.employeeId+"|"+s.date;
    (byEmpDate[key]=byEmpDate[key]||[]).push(s);
  });
  var flagged=[];
  Object.keys(byEmpDate).forEach(function(key){
    var list=byEmpDate[key].slice().sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
    for(var i=1;i<list.length;i++){
      var gap=toMin(list[i].start)-toMin(list[i-1].end);
      if(gap>splitGapTolerance(list[i-1].storeId, list[i].storeId, list[i].date)){ flagged.push(list[i-1]); flagged.push(list[i]); }

  });

}
function findWorkDaysOverConflicts(weekKey){
  var week=getWeek(weekKey);
  var flagged=[];
  state.employees.forEach(function(emp){
    var max=employeeWeekDayLimit(emp, weekKey);
    var dates=employeeWorkedDates(emp.id, weekKey).sort();
    if(dates.length<=max) return;
    dates.slice(max).forEach(function(ds){
      week.shifts.filter(function(s){return s.employeeId===emp.id && s.date===ds;}).forEach(function(s){ flagged.push(s); });
    });
  });

}
/* An employee's "finish time" for a day is the latest end among all their shifts that day (not

function employeeDayEndMinutes(week, empId, date){
  var ends=week.shifts.filter(function(s){ return s.employeeId===empId && s.date===date; }).map(function(s){ return toMin(s.end); });
  return ends.length ? Math.max.apply(null, ends) : null;
}
function employeeOtherWorkedDates(week, empId, excludeDate){
  var set={};
  week.shifts.forEach(function(s){ if(s.employeeId===empId && s.date!==excludeDate) set[s.date]=true; });
  return Object.keys(set);
}
/* Only a salaried (mensuel), >=90% FTE employee who works past 17:30 on Saturday at a store

function findSaturdayRuleViolations(weekKey){

  var violations=[];
  state.stores.forEach(function(store){
    if(!store.saturdayLateRule) return;
    week.shifts.filter(function(s){ return s.storeId===store.id && s.date===satDs && toMin(s.end)>toMin("17:30"); })
      .forEach(function(s){
        var emp=getEmployee(s.employeeId);
        if(!emp || contractTypeInWeek(emp, weekKey)==="hourly" || !(fteInWeek(emp, weekKey)>=0.9)) return;
        var hasEarlyFinish=employeeOtherWorkedDates(week, s.employeeId, satDs).some(function(d){
          return employeeDayEndMinutes(week, s.employeeId, d)<=toMin("17:00");

}
function recomputeValidation(weekKey){
  var coverage=computeCoverage(weekKey);
  var understaffed=[];
  var overstaffed=[];
  Object.keys(coverage).forEach(function(storeId){
    Object.keys(coverage[storeId]).forEach(function(ds){
      coverage[storeId][ds].forEach(function(slot){
        if(slot.actual<slot.required) understaffed.push({storeId:storeId,date:ds,start:slot.start,required:slot.required,actual:slot.actual});
        if(slot.max!=null && slot.actual>slot.max) overstaffed.push({storeId:storeId,date:ds,start:slot.start,max:slot.max,actual:slot.actual});
      });
    });
  });
  var absenceConflicts=findAbsenceConflicts(weekKey);
  var doubleBookings=findDoubleBookings(weekKey);
  var saturdayRuleViolations=findSaturdayRuleViolations(weekKey);
  var storeRestrictionConflicts=findStoreRestrictionConflicts(weekKey);
  var fixedPatternOverageConflicts=findFixedPatternOverageConflicts(weekKey);
  var shortShiftConflicts=findShortShiftConflicts(weekKey);
  var splitGapConflicts=findSplitGapConflicts(weekKey);
  var missingBreakConflicts=findMissingBreakConflicts(weekKey);
  var workDaysOverConflicts=findWorkDaysOverConflicts(weekKey);
  var conflictShiftIds={};
  absenceConflicts.forEach(function(s){ conflictShiftIds[s.id]="absence"; });
  doubleBookings.forEach(function(pair){ conflictShiftIds[pair.a.id]="double"; conflictShiftIds[pair.b.id]="double"; });
  saturdayRuleViolations.forEach(function(v){ conflictShiftIds[v.shiftId]="saturday-rule"; });
  storeRestrictionConflicts.forEach(function(s){ conflictShiftIds[s.id]="store-restriction"; });
  fixedPatternOverageConflicts.forEach(function(s){ conflictShiftIds[s.id]="fixed-overage"; });
  shortShiftConflicts.forEach(function(s){ if(!conflictShiftIds[s.id]) conflictShiftIds[s.id]="short-shift"; });
  splitGapConflicts.forEach(function(s){ if(!conflictShiftIds[s.id]) conflictShiftIds[s.id]="split-gap"; });
  missingBreakConflicts.forEach(function(s){ if(!conflictShiftIds[s.id]) conflictShiftIds[s.id]="missing-break"; });
  workDaysOverConflicts.forEach(function(s){ if(!conflictShiftIds[s.id]) conflictShiftIds[s.id]="workdays-over"; });
  var employeeHours={};
  state.employees.forEach(function(emp){
    var used=employeeUsedMinutes(emp.id, weekKey);
    var target=employeeTargetMinutes(emp, weekKey);
    // Compare at the same precision fmtHoursDisplay actually shows (1 decimal, or the nearest
    // half-hour for part-timers) — otherwise a few minutes of float/rounding noise invisible in
    // the displayed "37.0h/37.0h" can still flag the dot as over/under target, which reads as a
    // contradiction to whoever's looking at it.
    var isPartTime=fteInWeek(emp, weekKey)<1;

    var targetDisplay=parseFloat(fmtHoursDisplay(target, isPartTime));

          absenceConflicts:absenceConflicts, doubleBookings:doubleBookings,
          saturdayRuleViolations:saturdayRuleViolations, storeRestrictionConflicts:storeRestrictionConflicts,
          fixedPatternOverageConflicts:fixedPatternOverageConflicts,
          shortShiftConflicts:shortShiftConflicts, splitGapConflicts:splitGapConflicts, missingBreakConflicts:missingBreakConflicts,
          workDaysOverConflicts:workDaysOverConflicts,
          conflictShiftIds:conflictShiftIds, employeeHours:employeeHours};

// A manager/employee's summary bar must not reveal counts from stores they can't see -- everything
// used by renderGrid/renderSidebar (conflictShiftIds, employeeHours, coverage) stays untouched since
// those are already naturally scoped by which store's shifts actually get rendered.
function scopeValidationToStore(v, storeId){
  function byStore(arr){ return arr.filter(function(x){ return x.storeId===storeId; }); }
  return {coverage:v.coverage, conflictShiftIds:v.conflictShiftIds, employeeHours:v.employeeHours,
    understaffed:byStore(v.understaffed), overstaffed:byStore(v.overstaffed),
    absenceConflicts:byStore(v.absenceConflicts),
    doubleBookings:v.doubleBookings.filter(function(p){ return p.a.storeId===storeId || p.b.storeId===storeId; }),
    saturdayRuleViolations:byStore(v.saturdayRuleViolations), storeRestrictionConflicts:byStore(v.storeRestrictionConflicts),
    fixedPatternOverageConflicts:byStore(v.fixedPatternOverageConflicts),
    shortShiftConflicts:byStore(v.shortShiftConflicts), splitGapConflicts:byStore(v.splitGapConflicts),
    missingBreakConflicts:byStore(v.missingBreakConflicts), workDaysOverConflicts:byStore(v.workDaysOverConflicts)};
}

/* ---------- 5. Solver ---------- */
function mergeShifts(week){
  var groups={};
  week.shifts.forEach(function(s){
    var key=s.employeeId+"|"+s.storeId+"|"+s.date+"|"+s.source;
    (groups[key]=groups[key]||[]).push(s);
  });
  var merged=[];
  Object.keys(groups).forEach(function(key){
    var list=groups[key].sort(function(a,b){return toMin(a.start)-toMin(b.start);});
    var cur=null;
    list.forEach(function(s){
      if(cur && toMin(s.start)<=toMin(cur.end)){
        if(toMin(s.end)>toMin(cur.end)) cur.end=s.end;
      } else {
        if(cur) merged.push(cur);
        cur={id:s.id, storeId:s.storeId, employeeId:s.employeeId, date:s.date, start:s.start, end:s.end, source:s.source, locked:s.locked, note:s.note};
      }
    });
    if(cur) merged.push(cur);
  });
  week.shifts = merged;
}
function enforceSaturdayLateRule(weekKey){
  // If an auto-generated Saturday shift runs past 17:30 at a store with the late rule, the
  // employee must also finish at 17:00 some other day that week. Rather than just flagging it
  // after the fact, actively truncate one of their other auto shifts down to a 17:00 finish —
  // any coverage gap that opens up gets patched by the follow-up fillDeficits() pass.
  var week=getWeek(weekKey);
  var saturday=weekDates(weekKey)[5], satDs=dateStr(saturday);
  var trimmed=[];
  state.stores.forEach(function(store){
    if(!store.saturdayLateRule) return;
    var lateShifts=week.shifts.filter(function(s){ return s.storeId===store.id && s.date===satDs && toMin(s.end)>toMin("17:30"); });
    var handled={};
    lateShifts.forEach(function(s){
      if(handled[s.employeeId]) return;
      handled[s.employeeId]=true;
      var emp=getEmployee(s.employeeId);
      if(!emp || contractTypeInWeek(emp, weekKey)==="hourly" || !(fteInWeek(emp, weekKey)>=0.9)) return;
      var earlyFinishDate=employeeOtherWorkedDates(week, s.employeeId, satDs).find(function(d){
        return employeeDayEndMinutes(week, s.employeeId, d)<=toMin("17:00");
      });
      if(earlyFinishDate){
        // Already compliant — but still block 17:00-onward on that day, or the top-up pass
        // that runs right after this one (to restore minutes trimmed off Saturday) is free to
        // stretch this same day past 17:00 again, silently undoing compliance.
        trimmed.push({employeeId:s.employeeId, date:earlyFinishDate, start:toMin("17:00"), end:1440});
        return;
      }
      var toTruncate=week.shifts.filter(function(s2){
        return s2.employeeId===s.employeeId && s2.date!==satDs && s2.source==="auto"
          && toMin(s2.start)<toMin("17:00") && toMin(s2.end)>toMin("17:00");
      }).sort(function(a,b){ return toMin(b.end)-toMin(a.end); })[0];
      if(toTruncate){
        trimmed.push({employeeId:s.employeeId, date:toTruncate.date, start:toMin("17:00"), end:1440});
        toTruncate.end="17:00";
      }
      // else: no other auto shift that week to trim — left as-is, still flagged for manual review
    });
  });
  return trimmed;
}
/* Break length required for a given shift duration: none under 5.5h (unpaid 15min breaks apply
   but aren't scheduled), 30min from 5.5h up to and including 6h, a full 1h once over 6h. */
function requiredBreakMinutes(durationMinutes){
  if(durationMinutes>360) return 60; // strictly over 6h
  if(durationMinutes>=330) return 30; // 5.5h up to and including 6h
  return 0; // under 5.5h: unpaid 15min breaks apply but aren't scheduled
}
/* Staggered lunch-break start times for a store/day. With exactly 2 people breaking (the common
   case, offset 0) they get the widest possible spread — 12:00 & 13:00 — rather than sitting back
   to back at 12:00/12:30. With 1 person it's just 12:00. From 3 people on (or offset>0, meaning a
   later pass is adding more people to a store/day already partly staggered), it's a repeating
   cascade: 12:00, 12:30, 13:00, 12:00, 12:30, 13:00, ... —
   offset picks up the sequence where an earlier pass left off instead of restarting at 12:00. */
function staggeredBreakStarts(n, offset){
  var STARTS=[720,750,780]; // 12:00, 12:30, 13:00

  for(var i=0;i<n;i++){ out.push(STARTS[(offset+i)%3]); } // 12:00, 12:30, 13:00, 12:00, 12:30, 13:00, …

function insertMandatoryBreaks(weekKey, alreadyBrokenDays, staggerCounters, blockedWindows){

  // it, sized to the required minutes (30min at 5.5h+, 1h over 6h) and positioned at this store/day's
  // assigned staggered anchor. Re-carving unconditionally (rather than only acting when a gap is
  // literally missing) matters because the deficit solver can independently leave several
  // employees with a similar natural gap around the same low-demand slot on its own — left alone
  // that silently un-staggers everyone onto the same window and can leave it looking understaffed.
  // alreadyBrokenDays (an employeeId|date -> true map, shared across repeated calls) makes sure a
  // day already handled in an earlier pass isn't re-processed. staggerCounters (a storeId|date ->

  // sequence continuing correctly across passes instead of restarting at the first anchor each
  // time a later pass discovers another employee needing a break at the same store/day.
  var week=getWeek(weekKey);

    if(blockedWindows.some(function(b){ return b.employeeId===empId && b.date===ds && overlap(b.start,b.end,testStart,testEnd); })) return true;

    var offset=staggerCounters[k]||0;

    // shared closure is the synchronization point, not the per-employee rotation.

  pending.forEach(function(p){

    // fine) — only grow the span when there genuinely isn't enough room for the required break yet.

    if(shortfall>0){

  for(var iter=0; iter<30; iter++){
    var improved=false;

      var base=badCount(store.id);

        if(improved) return;
        var days={};
        week.shifts.forEach(function(x){ if(x.employeeId===emp.id) (days[x.date]=days[x.date]||[]).push(x); });
        var dates=Object.keys(days).filter(function(ds){
          return ds!==satDs && days[ds].every(function(x){ return x.source==="auto" && !x.locked && x.storeId===store.id; });
        });
        for(var i=0;i<dates.length && !improved;i++) for(var j=i+1;j<dates.length && !improved;j++){

/* Final lunch-break cascade, per store and day, among generated days split by one break around
   lunch: ordered by who starts earliest, 2 people break at 12:00 and 13:00; 3 or more rotate
   12:00, 12:30, 13:00, 12:00, … Each break keeps its length and the day its hours (at least 1h of
   work before and after it). A store/day is put back as it was if the new order would leave a slot
   short of its minimum staff (or over its maximum). Fixed, hand-placed and lunch-closure days are
   left alone. */
function cascadeBreaks(weekKey){
  var week=getWeek(weekKey);
  var demand=buildDemandGrid(weekKey);
  var STARTS=[720,750,780];
  function badSlots(storeId, ds){
    var n=0;
    ((demand[storeId]||{})[ds]||[]).forEach(function(sl){
      var c=week.shifts.filter(function(x){ return x.storeId===storeId && x.date===ds && toMin(x.start)<=sl.start && toMin(x.end)>sl.start; }).length;
      if(c<sl.required) n++;
      if(sl.max!=null && c>sl.max) n++;

    return n;
  }
  var byEmpDay={};
  week.shifts.forEach(function(x){ var k=x.employeeId+"|"+x.date; (byEmpDay[k]=byEmpDay[k]||[]).push(x); });
  var groups={};
  Object.keys(byEmpDay).forEach(function(k){
    var list=byEmpDay[k].sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
    if(list.length!==2 || list.some(function(x){ return x.source!=="auto" || x.locked; }) || list[0].storeId!==list[1].storeId) return;
    var gap=toMin(list[1].start)-toMin(list[0].end);
    if(gap<30 || gap>60) return;
    if(storeLunchClosure(getStore(list[0].storeId), list[0].date)) return;
    var from=toMin(list[0].start), to=toMin(list[1].end);
    if(!(from<870 && to>660)) return; // not around lunch time
    var g=list[0].storeId+"|"+list[0].date;
    (groups[g]=groups[g]||[]).push({a:list[0], b:list[1], gap:gap, from:from, to:to});
  });
  Object.keys(groups).forEach(function(g){
    var ppl=groups[g].sort(function(x,y){ return x.from-y.from || (x.a.employeeId<y.a.employeeId?-1:1); });
    var anchors = ppl.length===2 ? [720,780] : ppl.map(function(p,i){ return STARTS[i%3]; });
    var storeId=g.split("|")[0], ds=g.split("|")[1];

    ppl.forEach(function(p,i){
      var order=[anchors[i]].concat(STARTS.filter(function(x){ return x!==anchors[i]; }));

        if(st-p.from>=60 && p.to-en>=60){ p.a.end=fromMin(st); p.b.start=fromMin(en); break; }
      }
    });
    if(badSlots(storeId, ds)>before) ppl.forEach(function(p,i){ p.a.end=saved[i].aEnd; p.b.start=saved[i].bStart; });
  });
}
/* Salaried staff must not end over their target. Anyone still over gets generated time taken off,
   30 min at a time — from the start of the day first (days are built from closing time backwards),

   least the minimum shift length. Fixed and hand-placed shifts are never trimmed. */
// Salaried staff have a hard limit: only a manual edit may take them over their target.
function hoursCapped(emp, weekKey){ return !emp.worksFromHome && contractTypeInWeek(emp, weekKey)!=="hourly"; }

  var demand=buildDemandGrid(weekKey);

  function coverage(storeId, ds, m){ return week.shifts.filter(function(x){ return x.storeId===storeId && x.date===ds && toMin(x.start)<=m && toMin(x.end)>m; }).length; }
  // hard: the target wins over coverage — any slot left short is reported as a gap instead.
  function canDrop(sh, m){ return hard || coverage(sh.storeId, sh.date, m)-1>=required(sh.storeId, sh.date, m); }

  // clearing the proposition brings the full fixed shift back); hand-placed shifts never.
  function trimmable(sh){ return sh.source!=="manual" && !sh.locked; }
  function trimmed(sh){ if(sh.source==="fixed") sh.source="auto"; }
  state.employees.forEach(function(emp){
    if(!hoursCapped(emp, weekKey)) return;
    var over=employeeUsedMinutes(emp.id, weekKey)-employeeTargetMinutes(emp, weekKey);
    // "Only full days": a day may not be trimmed below their full day.
    var dayMin = emp.fullDaysOnly ? Math.max(minDay, employeeFullDayMinutes(emp, weekKey)) : minDay;
    var progress=true;
    while(over>=30 && progress){
      progress=false;
      // Longest days first.
      var dates=employeeWorkedDates(emp.id, weekKey).map(function(ds){
        var list=week.shifts.filter(function(x){ return x.employeeId===emp.id && x.date===ds; }).sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
        return {ds:ds, list:list, work:list.reduce(function(n,x){ return n+toMin(x.end)-toMin(x.start); },0)};
      }).sort(function(a,b){ return b.work-a.work; });
      for(var i=0;i<dates.length && !progress;i++){
        var d=dates[i];
        if(d.work-30<dayMin) continue;
        if(d.list.some(function(x){ return !trimmable(x); })) continue; // a day with hand-placed shifts stays as set
        var first=d.list[0], last=d.list[d.list.length-1];

        var list=week.shifts.filter(function(x){ return x.employeeId===emp.id && x.date===ds; });
        return {ds:ds, list:list, work:list.reduce(function(n,x){ return n+toMin(x.end)-toMin(x.start); },0)};
      }).filter(function(d){ return d.list.every(trimmable); }).sort(function(a,b){ return a.work-b.work; }).forEach(function(d){
        if(over<30) return;
        week.shifts=week.shifts.filter(function(x){ return d.list.indexOf(x)<0; });

      });
    }
  });
}
// Auto shifts that end at closing time carry on until the store's "Départ" (closing tasks).

    var emp=getEmployee(s.employeeId);
    var store=getStore(s.storeId), hours=store && resolveStoreHours(store, s.date);
    if(!hours || toMin(s.end)!==toMin(hours.close)) return;
    var endMin=workEndMin(hours);

    var clash=week.shifts.some(function(o){ return o!==s && o.employeeId===s.employeeId && o.date===s.date && overlap(toMin(o.start),toMin(o.end),toMin(s.end),endMin); });

  });

  // against absences/availability that may have been added *after* they were created — a stale
  // fixed-pattern slot from a week synced before someone's vacation was entered would otherwise
  // never get cleared out, since materializeFixedPatterns only adds, it doesn't remove. Manual
  // and locked shifts are left alone (deliberate placement) and simply surface as a conflict.

    }).length;

    return week.shifts.some(function(sh){ return sh.employeeId===empId && sh.date===ds && overlap(toMin(sh.start),toMin(sh.end),s,e); });

  function fillDeficits(){
  var iterations=0;
  while(iterations++ < 2000){
    var worst=null;
    for(var storeId in demand){
      for(var di=0; di<dates.length; di++){
        var ds=dates[di];
        var slots=demand[storeId][ds]||[];
        for(var si=0; si<slots.length; si++){
          var slot=slots[si];

        var daysLeftIncludingToday=Math.max(1, employeeWeekDayLimit(chosen, weekKey)-priorDates.length);
        var idealMinutes=Math.min(settings.maxShiftMinutes, Math.max(hi-lo, Math.round((remain/daysLeftIncludingToday)/30)*30));
        if(chosen.fullDaysOnly) idealMinutes=Math.max(idealMinutes, employeeFullDayMinutes(chosen, weekKey)+FULL_DAY_BREAK);
        function slotHasRoom(slotStart){
          // A slot is off-limits if it's a lunch closure, or if it's already at its configured

    mergeShifts(week);
  }
  // The break pass can occasionally shrink a day again (carving a break out of a span that had no
  // room to extend) — a final top-up mops up whatever's left, best-effort.
  topUpUnderTargetEmployees(weekKey, blockedWindows);
  mergeShifts(week);
  // Salaried staff must not end more than 8h under target when a day is still possible: give
  // anyone still that short a whole new day, then size its breaks like every other shift.
  var stillShort=state.employees.some(function(emp){ return salariedShortfall(emp, weekKey)>MAX_SALARIED_SHORTFALL; });
  if(stillShort){
    topUpUnderTargetEmployees(weekKey, blockedWindows, true);
    mergeShifts(week);
    for(var extraPass=0; extraPass<5; extraPass++){
      var moreBreaks=insertMandatoryBreaks(weekKey, alreadyBrokenDays, staggerCounters, blockedWindows);
      if(!moreBreaks.length) break;
      blockedWindows = blockedWindows.concat(moreBreaks);
      fillDeficits();
      mergeShifts(week);
    }
  }
  // Anyone salaried still 30 min or more short is usually stuck on a break-less day capped at 5h
  // (it can't grow after the break pass without a break it doesn't have). Let those days grow,
  // give them their break, then top up once more within the new gaps.
  for(var shortPass=0; shortPass<2; shortPass++){
    var someoneShort=state.employees.some(function(emp){ return salariedShortfall(emp, weekKey)>=30; });
    if(!someoneShort) break;
    topUpUnderTargetEmployees(weekKey, blockedWindows, false, true);
    mergeShifts(week);
    for(var spBreak=0; spBreak<5; spBreak++){
      var spBreaks=insertMandatoryBreaks(weekKey, alreadyBrokenDays, staggerCounters, blockedWindows);
      if(!spBreaks.length) break;
      blockedWindows = blockedWindows.concat(spBreaks);
      fillDeficits();
      mergeShifts(week);
    }
    topUpUnderTargetEmployees(weekKey, blockedWindows);
    mergeShifts(week);
  }
  extendClosingShifts(week, weekKey); // shifts added by the later passes too
  mergeShifts(week);
  for(var fdPass=0; fdPass<3; fdPass++){
    if(!enforceFullDays(weekKey, blockedWindows)) break;
    fillDeficits();
    mergeShifts(week);
    for(var fdBreak=0; fdBreak<5; fdBreak++){
      var fdBreaks=insertMandatoryBreaks(weekKey, alreadyBrokenDays, staggerCounters, blockedWindows);
      if(!fdBreaks.length) break;
      blockedWindows = blockedWindows.concat(fdBreaks);
      fillDeficits();
      mergeShifts(week);
    }
    extendClosingShifts(week, weekKey);
    mergeShifts(week);
  }
  trimOverTarget(weekKey);
  mergeShifts(week);
  // Only a manual edit may take someone salaried over target: if coverage kept anyone over, trim
  // them regardless and let people who still have room pick up the slack.
  for(var hardPass=0; hardPass<2; hardPass++){
    if(!state.employees.some(function(emp){ return hoursCapped(emp, weekKey) && employeeUsedMinutes(emp.id, weekKey)-employeeTargetMinutes(emp, weekKey)>=30; })) break;
    trimOverTarget(weekKey, true);
    mergeShifts(week);
    if(hardPass===1) break; // last pass: no refill, whatever is left short is reported as a gap
    fillDeficits();
    mergeShifts(week);
    for(var hpBreak=0; hpBreak<5; hpBreak++){
      var hpBreaks=insertMandatoryBreaks(weekKey, alreadyBrokenDays, staggerCounters, blockedWindows);
      if(!hpBreaks.length) break;
      blockedWindows = blockedWindows.concat(hpBreaks);
      fillDeficits();
      mergeShifts(week);
    }
  }
  // Salaried staff still short take over generated days from flexible / hourly colleagues.
  if(swapDaysToSalaried(weekKey, blockedWindows)){
    mergeShifts(week);
    trimOverTarget(weekKey);
    mergeShifts(week);
  }
  // Full-timers stay until closing on Saturday (except in a holiday week).
  if(saturdayCloseForFullTimers(weekKey)){
    trimOverTarget(weekKey);
    mergeShifts(week);
  }
  // Step 2 — the Saturday-late rule, checked on the finished schedule (earlier steps can undo it):
  // anyone still in breach finishes at 17:00 on one weekday, the evening is covered by others and
  // their missing hours go back in the mornings (earlier starts, never before "Arrivée").
  for(var satPass=0; satPass<3; satPass++){
    var satBefore=findSaturdayRuleViolations(weekKey).length;
    if(!satBefore) break;
    blockedWindows = blockedWindows.concat(enforceSaturdayLateRule(weekKey));
    fillDeficits();
    mergeShifts(week);
    topUpUnderTargetEmployees(weekKey, blockedWindows, true);
    mergeShifts(week);
    for(var satBreak=0; satBreak<5; satBreak++){
      var satBreaks=insertMandatoryBreaks(weekKey, alreadyBrokenDays, staggerCounters, blockedWindows);
      if(!satBreaks.length) break;
      blockedWindows = blockedWindows.concat(satBreaks);
      fillDeficits();
      mergeShifts(week);
    }
    topUpUnderTargetEmployees(weekKey, blockedWindows, false, true);
    mergeShifts(week);
    if(findSaturdayRuleViolations(weekKey).length>=satBefore) break; // nothing more it can fix
  }
  trimOverTarget(weekKey);
  mergeShifts(week);
  // Step 3 — early finishes moved to days with more people at closing (whole days swapped).
  swapDaysForCoverage(weekKey);
  // Step 4 — lunch breaks cascade per store and day, in the order people start their day.
  cascadeBreaks(weekKey);
  delete week.needsRebalance;
  saveState();
  var createdCount=week.shifts.filter(function(s){return s.source==="auto";}).length;
  return {createdCount:createdCount, gaps:gaps};
}
function clearAutoShifts(weekKey){
  var week=getWeek(weekKey);
  week.shifts = week.shifts.filter(function(s){return s.source!=="auto";});
  week.fixedSynced=false; // fixed shifts shortened by a trim are rebuilt in full
  saveState();
}

function renderHolidaysCard(){

      }).join("")+"</div></td>"+

    tr.querySelector("[data-field=date]").addEventListener("change", function(e){
      h.date=e.target.value; invalidateFixedSync(); saveState(); renderSchedule();
      // no renderHolidaysCard() here: rebuilding this row cuts off the date input after its first segment.
      // The row will settle into date order next time this card naturally re-renders.
    });
    tr.querySelector("[data-field=label]").addEventListener("change", function(e){ h.label=e.target.value; invalidateFixedSync(); saveState(); renderSchedule(); });
    tr.querySelectorAll("[data-holidaystore]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sid=btn.getAttribute("data-holidaystore");
        var current = h.storeIds==null ? state.stores.map(function(s){return s.id;}) : h.storeIds.slice();
        var idx=current.indexOf(sid);
        if(idx>=0) current.splice(idx,1); else current.push(sid);
        h.storeIds = current.length===state.stores.length ? null : current;
        invalidateFixedSync(); saveState(); renderHolidaysCard(); renderSchedule();
      });
    });
    var delBtn=tr.querySelector("[data-action=delete-h]");

    });

    state.holidays.push({id:uid(), date:dateStr(new Date()), label:"Férié", storeIds: mgrStores ? mgrStores.slice() : null});

    state.holidays.forEach(function(h){ h.storeIds=[]; });
    invalidateFixedSync(); saveState(); renderHolidaysCard(); renderSchedule();
  });
}

function escAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
/* Part-time targets/used hours (fte<1) land on messy decimals (e.g. 41h*0.6=24.6h) — round those
   to the nearest half hour for display so they read as clean, human-friendly numbers. Full-time
   figures are shown exactly since they're precise to begin with. */
function fmtHoursDisplay(mins, isPartTime){
  var h=mins/60;
  if(isPartTime) h=Math.round(h*2)/2;
  return h.toFixed(1);
}

      fte:1, contractType:"salaried", baselineWeeklyMinutes:2460, minGuaranteedMinutes:0,
      contracts:[{id:uid(), startDate:"", endDate:"", type:"salaried", fte:1, maxWorkDays:null}], vacationDaysPerYear:null,
      fixedPattern:[], recurringDaysOff:[], preferredDaysOff:[], mandatoryDaysOff:[], availabilityWindows:[], absences:[], waivesMonthlySaturdayOff:false, allowedStoreIds:null,
      storeAccess:storeAccess
    });

  el.querySelector("[data-action=apply-colors]").addEventListener("click", applyExcelSeedColors);

function renderRulesTable(container, filterStoreId){
  var rules = filterStoreId ? state.staffingRules.filter(function(r){return r.storeId===filterStoreId;}) : state.staffingRules;
  var html = filterStoreId ? "" : "<h2>Règles d'effectif</h2><p class='hint'>Ces règles pilotent le nombre d'employés requis (min) et, si besoin (ex : petite surface, un seul poste de caisse), le nombre maximum autorisé par magasin/jour/plage horaire. Laisser le maximum vide = pas de limite. Modifiables à tout moment pour coller aux besoins saisonniers.</p>";
  html+="<table><thead><tr>"+(filterStoreId?"":"<th>Magasin</th>")+"<th>Jour</th><th>Début</th><th>Fin</th><th>Min</th><th>Max</th><th>Dès le</th><th>Jusqu'au</th><th>Libellé</th><th></th></tr></thead><tbody>";
  rules.forEach(function(r){
    html+="<tr data-rule='"+r.id+"'>";
    if(!filterStoreId) html+="<td><select data-field='storeId'>"+state.stores.map(function(s){return "<option value='"+s.id+"' "+(s.id===r.storeId?"selected":"")+">"+escAttr(s.name)+"</option>";}).join("")+"</select></td>";
    html+="<td><div class='dow-toggles' style='flex-wrap:nowrap'>"+DOW_SHORT.map(function(d,i){ return "<button type='button' data-ruledow='"+i+"' class='"+(r.dow.indexOf(i)>=0?"work":"")+"'>"+d+"</button>"; }).join("")+"</div></td>";
    html+="<td><input type='time' data-field='startTime' value='"+r.startTime+"' style='width:80px'></td>";
    html+="<td><input type='time' data-field='endTime' value='"+r.endTime+"' style='width:80px'></td>";
    html+="<td><input type='number' data-field='minStaff' min='0' value='"+r.minStaff+"' style='width:50px'></td>";
    html+="<td><input type='number' data-field='maxStaff' min='0' value='"+(r.maxStaff!=null?r.maxStaff:"")+"' placeholder='—' style='width:50px'></td>";
    html+="<td><input type='date' data-field='effectiveFrom' value='"+r.effectiveFrom+"' style='width:130px'></td>";
    html+="<td><input type='date' data-field='effectiveTo' value='"+(r.effectiveTo||"")+"' style='width:130px'></td>";
    html+="<td><input type='text' data-field='label' value='"+escAttr(r.label||"")+"' style='width:110px'></td>";
    html+="<td class='row-actions'><button class='icon-btn' data-action='delete-rule'>✕</button></td>";
    html+="</tr>";
  });
  html+="</tbody></table><button class='btn btn-sm' style='margin-top:8px' data-action='add-rule'>+ Ajouter une règle</button>";
  container.innerHTML=html;

  container.querySelectorAll("tr[data-rule]").forEach(function(tr){
    var ruleId=tr.getAttribute("data-rule"); var rule=state.staffingRules.find(function(r){return r.id===ruleId;});
    function bind(field, parse){
      var inp=tr.querySelector("[data-field="+field+"]"); if(!inp) return;
      inp.addEventListener("change", function(e){ rule[field]= parse? parse(e.target.value): e.target.value; saveState(); renderSchedule(); });
    }
    bind("storeId");
    bind("startTime"); bind("endTime");
    bind("minStaff", function(v){ return parseInt(v)||0; });
    bind("maxStaff", function(v){ return v===""?null:Math.max(0,parseInt(v)||0); });
    bind("effectiveFrom"); bind("effectiveTo", function(v){ return v||null; });
    bind("label");
    tr.querySelectorAll("[data-ruledow]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var d=+btn.getAttribute("data-ruledow");
        var idx=rule.dow.indexOf(d);
        if(idx>=0) rule.dow.splice(idx,1); else rule.dow.push(d);
        saveState(); renderRulesTable(container, filterStoreId); renderSchedule();
      });
    });
    tr.querySelector("[data-action=delete-rule]").addEventListener("click", function(){
      state.staffingRules=state.staffingRules.filter(function(r){return r.id!==ruleId;});
      saveState(); renderRulesTable(container, filterStoreId); renderSchedule();
    });
  });
  container.querySelector("[data-action=add-rule]").addEventListener("click", function(){
    state.staffingRules.push({id:uid(), storeId: filterStoreId || (state.stores[0]?state.stores[0].id:null), dow:[0,1,2,3,4,5,6],
      startTime:"12:00", endTime:"14:00", minStaff:2, maxStaff:null, effectiveFrom:"2000-01-01", effectiveTo:null, label:"", priority:0});
    saveState(); renderRulesTable(container, filterStoreId); renderSchedule();
  });
}

    if(isTrueAdmin()){
      html+="<h3>Équipe &amp; accès</h3>";
      var people = state.employees.filter(function(e){ return !e.archived && storeAccessState(e, storeId)!=="no"; })
        .map(function(e){ return {emp:e, acct:accountsByEmployee[e.id]}; });

      Object.keys(accountsByUserId).forEach(function(uid){
        var p=accountsByUserId[uid];
        if(p.role==="manager" && (p.store_ids||[]).indexOf(storeId)>=0 && (!p.employee_id || coveredEmpIds.indexOf(p.employee_id)<0)){
          people.push({emp:null, acct:p});
        }
      });
      if(people.length){
        html+="<table><thead><tr><th>Nom</th><th>Rôle</th></tr></thead><tbody>";
        people.forEach(function(p){
          var name = p.emp ? p.emp.name : (p.acct.display_name||p.acct.login_name);
          var color = p.emp ? p.emp.color : "#999";
          var roleLabel = !p.acct ? "<span style='color:var(--muted)'>Pas de compte</span>" :
            p.acct.role==="admin" ? "Administrateur" :
            p.acct.role==="manager" ? ("Gérant(e)"+(p.acct.store_admin?" + privilège admin":"")) : "Employé(e)";
          html+="<tr"+(p.emp?" data-emp='"+p.emp.id+"' style='cursor:pointer'":"")+"><td><span class='emp-swatch' style='display:inline-block;width:10px;height:10px;border-radius:50%;background:"+color+";margin-right:6px'></span>"+escAttr(name)+"</td><td>"+roleLabel+"</td></tr>";
        });
        html+="</tbody></table>";
      } else html+="<p class='hint'>Personne n'est assigné à ce magasin pour l'instant.</p>";
    }

    html+="<h3>Horaires d'ouverture</h3>";
    html+="<p class='hint'>Le planning de chaque semaine utilise automatiquement l'horaire en vigueur à sa date. L'horaire « en cours » (sans date de fin) s'applique jusqu'à ce qu'il soit remplacé ; une période avec date de fin (ex : horaires de Noël) prime temporairement sans toucher au reste. Les semaines déjà planifiées avec un ancien horaire ne changent pas rétroactivement.</p>";
    var periods=store.hoursHistory.slice().sort(function(a,b){ return a.effectiveFrom<b.effectiveFrom?1:-1; });
    // Old periods are kept (past weeks still use them) but folded away: those that ended before
    // today, and those replaced by a newer ongoing schedule that starts after they end.
    var today=dateStr(new Date());
    var pastPeriods=periods.filter(function(pd){
      if(!pd.effectiveTo) return false;
      if(pd.effectiveTo<today) return true;
      return periods.some(function(q){ return q!==pd && !q.effectiveTo && q.effectiveFrom>pd.effectiveTo; });
    });
    var livePeriods=periods.filter(function(pd){ return pastPeriods.indexOf(pd)<0; });
    function periodBox(period){
      var html="";
      html+="<div style='margin-bottom:12px;padding:8px 10px;border:1px solid var(--border);border-radius:6px' data-period='"+period.id+"'>";
      html+="<div class='row' style='align-items:center;margin-bottom:6px;flex-wrap:wrap'>";
      html+="<input type='text' data-pf='label' value='"+escAttr(period.label)+"' style='font-weight:600;flex:2;min-width:140px'>";
      html+="<span style='flex:none;font-size:11px;color:var(--muted)'>dès le</span>";

        html+="<span style='flex:none;font-size:11px;color:var(--muted)'>jusqu'au</span><input type='date' data-pf='effectiveTo' value='"+period.effectiveTo+"' style='flex:none'>";
      }
      // "En cours" = no end date: applies until replaced. Unticking reveals an end date (to its left).
      html+="<label style='flex:none;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap"+(period.effectiveTo?"":";color:var(--ok)")+"'><input type='checkbox' data-pf='ongoing' "+(period.effectiveTo?"":"checked")+"> En cours</label>";
      if(periods.length>1) html+="<button class='icon-btn' data-action='delete-period' style='flex:none'>✕</button>";
      html+="</div>";
      html+="<table><thead><tr><th>Jour</th><th>Ouvert</th><th>Arrivée</th><th>Ouverture</th><th>Fermeture</th><th>Départ</th></tr></thead><tbody>";
      for(var dow=0; dow<7; dow++){
        var h=period.hoursByDow[dow];
        html+="<tr><td>"+DOW_LABELS[dow]+"</td><td><input type='checkbox' data-pdow='"+dow+"' data-pf='open' "+(h?"checked":"")+"></td>"+
          "<td><input type='time' data-pdow='"+dow+"' data-pf='preopen' value='"+(h?h.preOpen:"10:00")+"' "+(h?"":"disabled")+" title='Arrivée possible dès cette heure (nettoyage, préparation)'></td>"+
          "<td><input type='time' data-pdow='"+dow+"' data-pf='start' value='"+(h?h.open:"10:00")+"' "+(h?"":"disabled")+"></td>"+
          "<td><input type='time' data-pdow='"+dow+"' data-pf='end' value='"+(h?h.close:"19:00")+"' "+(h?"":"disabled")+"></td>"+
          "<td><input type='time' data-pdow='"+dow+"' data-pf='postclose' value='"+(h?(h.postClose||h.close):"19:00")+"' "+(h?"":"disabled")+" title='Départ possible jusqu&#39;à cette heure (rangement, caisse)'></td></tr>";
      }
      html+="</tbody></table></div>";
      return html;
    }
    html+=livePeriods.map(periodBox).join("");
    if(pastPeriods.length){
      html+="<details id='sp-old-hours' style='margin-bottom:12px'"+(storeOldHoursOpen?" open":"")+"><summary style='cursor:pointer;color:var(--muted);font-weight:600;margin-bottom:8px'>Anciens horaires ("+pastPeriods.length+")</summary>";
      html+=pastPeriods.map(periodBox).join("")+"</details>";
    }
    html+="<button class='btn btn-sm' data-action='add-permanent'>Changer l'horaire permanent à partir d'une date</button> ";
    html+="<button class='btn btn-sm' data-action='add-temp'>+ Ajouter une période spéciale (ex : Noël)</button>";

    html+="<h3>Pause de midi</h3><p class='hint'>Optionnel — pour les magasins avec peu d'employés : sur les jours cochés, le magasin ferme entièrement sur cette plage (aucun effectif requis).</p>";
    html+="<div class='field'><div class='dow-toggles'>"+DOW_SHORT.map(function(d,i){ var on=store.lunchClosure.days.indexOf(i)>=0; return "<button data-lunchdow='"+i+"' class='"+(on?"work":"")+"'>"+d+"</button>"; }).join("")+"</div></div>";
    html+="<div class='row' style='max-width:280px;align-items:center'>"+
      "<div class='field' style='flex:none'><label>De</label><input type='time' id='sp-lunch-start' value='"+store.lunchClosure.start+"'></div>"+
      "<div class='field' style='flex:none'><label>À</label><input type='time' id='sp-lunch-end' value='"+store.lunchClosure.end+"'></div></div>";

    html+="<h3>Règles d'effectif pour ce magasin</h3><div id='sp-rules'></div>";
    html+="<div style='margin-top:18px'><button class='btn btn-danger btn-sm' data-action='delete'>Supprimer ce magasin</button></div>";
    el.innerHTML=html;

    el.querySelectorAll("tr[data-emp]").forEach(function(tr){
      tr.addEventListener("click", function(){ openEmployeeProfile(tr.getAttribute("data-emp")); });
    });
    document.getElementById("sp-name").addEventListener("change", function(e){ store.name=e.target.value; saveState(); renderSchedule(); });
    document.getElementById("sp-color").addEventListener("click", function(){

    el.querySelectorAll("[data-period]").forEach(function(box){

      box.querySelector("[data-pf=label]").addEventListener("change", function(e){ period.label=e.target.value; saveState(); });
      var fromInp=box.querySelector("[data-pf=effectiveFrom]");
      fromInp.addEventListener("change", function(e){ period.effectiveFrom=e.target.value; invalidateFixedSync(); saveState(); renderSchedule(); });
      var toInp=box.querySelector("[data-pf=effectiveTo]");
      if(toInp) toInp.addEventListener("change", function(e){ period.effectiveTo=e.target.value; invalidateFixedSync(); saveState(); renderSchedule(); });
      box.querySelector("[data-pf=ongoing]").addEventListener("change", function(e){
        if(e.target.checked) period.effectiveTo=null;

    el.querySelector("[data-action=add-permanent]").addEventListener("click", function(){
      var fromDate=prompt("À partir de quelle date ce nouvel horaire permanent s'applique-t-il ? (AAAA-MM-JJ)\nL'horaire actuellement en cours restera valide pour les semaines avant cette date.", dateStr(new Date()));
      if(!fromDate) return;
      var current=store.hoursHistory.find(function(p){return !p.effectiveTo;});
      if(current){
        var prevDay=parseDateStr(fromDate); prevDay.setDate(prevDay.getDate()-1);
        current.effectiveTo=dateStr(prevDay);
      }
      var base=(current||store.hoursHistory[0]).hoursByDow;
      store.hoursHistory.push({id:uid(), effectiveFrom:fromDate, effectiveTo:null, label:"Horaire dès le "+fromDate, hoursByDow:JSON.parse(JSON.stringify(base))});
      invalidateFixedSync(); saveState(); render(); renderSchedule();
    });
    el.querySelector("[data-action=add-temp]").addEventListener("click", function(){
      var label=prompt("Nom de cette période spéciale (ex : Horaires de Noël)", "Horaires spéciaux");

      var from=prompt("Date de début (AAAA-MM-JJ)", dateStr(new Date()));
      if(!from) return;
      var to=prompt("Date de fin (AAAA-MM-JJ)", dateStr(new Date()));
      if(!to) return;
      var baseEntry=resolveStoreHoursEntry(store, from) || store.hoursHistory[0];
      store.hoursHistory.push({id:uid(), effectiveFrom:from, effectiveTo:to, label:label, hoursByDow:JSON.parse(JSON.stringify(baseEntry.hoursByDow))});
      invalidateFixedSync(); saveState(); render(); renderSchedule();
    });

    renderRulesTable(document.getElementById("sp-rules"), storeId);
    el.querySelector("[data-action=back]").addEventListener("click", closeSetupDetail);
    el.querySelector("[data-action=delete]").addEventListener("click", function(){
      if(!confirm("Supprimer ce magasin ?")) return;
      state.stores=state.stores.filter(function(s){return s.id!==storeId;});
      state.staffingRules=state.staffingRules.filter(function(r){return r.storeId!==storeId;});
      if(state.ui.currentStoreId===storeId) state.ui.currentStoreId=state.stores[0]?state.stores[0].id:null;
      closeSetupDetail();
    });
  }
  render();
}

      emp.absences.forEach(function(ab,i){

    var today=dateStr(new Date());
    html+="<div class='row' style='max-width:520px;flex-wrap:wrap;align-items:flex-end;margin-top:8px'>"+
      "<div class='field' style='margin:0;flex:none;width:140px'><label>Type</label><select id='mgr-ab-type'>"+

      "<div class='field' style='margin:0'><label>Du</label><input type='date' id='mgr-ab-start' value='"+today+"'></div>"+
      "<div class='field' style='margin:0'><label>Au</label><input type='date' id='mgr-ab-end' value='"+today+"'></div>"+
      "<button class='btn btn-sm' data-action='add-ab' style='margin-bottom:0'>+ Ajouter une absence</button></div>";
    el.innerHTML=html;
    el.querySelector("[data-action=back]").addEventListener("click", closeSetupDetail);
    el.querySelectorAll("[data-action=del-ab]").forEach(function(btn){
      btn.addEventListener("click", function(){
        emp.absences.splice(+btn.getAttribute("data-i"),1);
        invalidateFixedSync(); saveState(); render(); renderSchedule();
      });
    });
    el.querySelector("[data-action=add-ab]").addEventListener("click", function(){
      var type=document.getElementById("mgr-ab-type").value;

      emp.absences.push({id:uid(), type:type, startDate:start, endDate:end, note:""});
      invalidateFixedSync(); saveState(); render(); renderSchedule();
    });
  }
  render();
}

// An employee's store tabs are not their general storeAccess permission (myStoreScope) but strictly
// where they actually have a shift THIS week — so a store they're merely allowed at, but idle in
// this week, never shows up (and never leaks that store's schedule to them).
function employeeStoresThisWeek(weekKey){
  if(!currentProfile || !currentProfile.employee_id) return [];
  var empId=currentProfile.employee_id, ids={};
  (getWeek(weekKey).shifts||[]).forEach(function(s){ if(s.employeeId===empId) ids[s.storeId]=true; });
  return Object.keys(ids);
}

  if(!stores.some(function(s){return s.id===state.ui.currentStoreId;})) state.ui.currentStoreId = stores.length ? stores[0].id : null;
  if(!stores.length){ el.innerHTML = isEmp ? "<p class='hint' style='margin:0'>Aucun horaire dans un magasin cette semaine.</p>" : ""; return; }
  el.innerHTML = stores.map(function(s){

function renderSummaryBar(validation){

/* True if an absence (vacation, congé, indisponibilité) covers every day of the given week —
   an employee who's only away part of the week can still be dragged onto their free days, so
   they stay in the sidebar; only a fully-absent week hides them entirely. */
function employeeFullyAbsentThisWeek(emp, weekKey){
  var dates=weekDates(weekKey).map(dateStr);
  return dates.every(function(ds){
    if(!isEmployedOn(emp, ds)) return true; // not (yet / any more) employed that day
    return (emp.absences||[]).some(function(ab){
      return !ab.startTime && !ab.endTime && ds>=ab.startDate && ds<=ab.endDate;
    });
  });
}
var ABSENCE_LABELS={vacation:"Vacances", dayoff:"Congé", unavailable:"Indisponible", sick:"Maladie"};
/* If the employee is absent (whole days) on every day they'd normally work this week — i.e. every
   employed day that isn't a recurring or mandatory day off — returns the absence label(s), else null. */
function employeeWeekAbsenceLabel(emp, weekKey){
  var labels=[], workDays=0;
  var covered=weekDates(weekKey).every(function(d){
    var ds=dateStr(d), dow=dowFromDate(d);
    if(!isEmployedOn(emp, ds)) return true;
    if((emp.recurringDaysOff||[]).indexOf(dow)>=0 || (emp.mandatoryDaysOff||[]).indexOf(dow)>=0) return true;
    workDays++;
    var ab=(emp.absences||[]).find(function(a){ return !a.startTime && ds>=a.startDate && ds<=a.endDate; });
    if(!ab) return false;
    var label=ABSENCE_LABELS[ab.type]||"Absent";
    if(labels.indexOf(label)<0) labels.push(label);
    return true;
  });
  return covered && workDays ? labels.join(" / ") : null;
}
function renderSidebar(validation){
  var el=document.getElementById("sidebar");
  if(!state.employees.length){ el.innerHTML="<p class='empty-note'>Aucun employé. Ajoutez-en dans Configuration.</p>"; return; }
  var available=[], full=[], absent=[];
  var wk=state.ui.currentWeekKey;
  state.employees.forEach(function(emp){
    if(!employeeAllowedAtStore(emp, state.ui.currentStoreId)) return;
    if(!weekDates(wk).some(function(d){ return isEmployedOn(emp, dateStr(d)); })) return; // not under contract this week
    var absence=employeeWeekAbsenceLabel(emp, wk);
    if(absence){ absent.push({emp:emp, label:absence}); return; }
    var h=validation.employeeHours[emp.id] || {used:0,target:0,status:"ok"};
    (h.target>0 && (h.diff!=null ? h.diff>=0 : h.used>=h.target) ? full : available).push({emp:emp, h:h}); // same totals as displayed
  });
  function rowHtml(item, draggable){
    var emp=item.emp, h=item.h;
    var dotTitle = contractTypeInWeek(emp, state.ui.currentWeekKey)==="hourly" ? "Horaire — pas d'objectif contraignant" :
      (h.status==="ok" ? "Cible atteinte — complet" : (h.status==="over"?"Au-dessus de la cible":"En dessous de la cible — encore disponible"));
    var reserve = emp.reserveOvertime ? employeeReserveMinutes(emp, state.ui.currentWeekKey) : 0;
    if(Math.abs(reserve)<1) reserve=0;
    return "<div class='emp-row"+(draggable?" draggable":"")+(reserve?" has-reserve":"")+"'"+(draggable?" draggable='true' data-emp='"+emp.id+"'":"")+">"+
      "<span class='emp-swatch' style='background:"+emp.color+"'></span>"+
      "<span class='emp-name' title='"+escAttr(emp.name)+"'>"+escAttr(emp.name||emp.initials)+"</span>"+
      "<span class='emp-hours'>"+fmtHoursDisplay(h.used, fteInWeek(emp, state.ui.currentWeekKey)<1)+"h/"+fmtHoursDisplay(h.target, fteInWeek(emp, state.ui.currentWeekKey)<1)+"h</span>"+
      "<span class='status-dot "+h.status+"' title='"+escAttr(dotTitle)+"'></span></div>"+
      (reserve ? "<div class='emp-reserve' title='Heures sup. mises de côté : report de l&#39;année passée + écarts des semaines planifiées de l&#39;année, jusqu&#39;à cette semaine incluse. Non reportées automatiquement — à rattraper à la main.'>Heures en réserve <span>"+fmtDelta(reserve).replace("</span>","h</span>")+"</span></div>" : "");
  }
  var html="<h3>Disponibles — glisser sur la grille</h3>";
  html += available.length ? available.map(function(it){return rowHtml(it,true);}).join("") : "<p class='empty-note'>Personne de disponible.</p>";
  if(full.length){
    html += "<h3 style='margin-top:12px'>Au complet ("+full.length+")</h3>";
    html += full.map(function(it){return rowHtml(it,false);}).join("");
  }
  if(absent.length){
    html += "<h3 style='margin-top:12px'>Indisponibles ("+absent.length+")</h3>";
    html += absent.map(function(it){
      return "<div class='emp-row' style='opacity:.7'><span class='emp-swatch' style='background:"+it.emp.color+"'></span>"+
        "<span class='emp-name' title='"+escAttr(it.emp.name)+"'>"+escAttr(it.emp.name||it.emp.initials)+"</span>"+
        "<span class='emp-hours'>"+escAttr(it.label)+"</span></div>";
    }).join("");
  }
  el.innerHTML=html;
  el.querySelectorAll(".emp-row.draggable").forEach(function(row){
    row.addEventListener("dragstart", function(e){
      draggedEmployeeId=row.getAttribute("data-emp");

      e.dataTransfer.effectAllowed="copy";
    });
    row.addEventListener("dragend", function(){ draggedEmployeeId=null; });
  });
}
// An employee's own plain-text agenda (day: hours a store), replacing the drag-source sidebar they
// don't get -- read-only, just a quick reminder of when/where they work this week.
function renderEmployeeAgenda(weekKey){
  var el=document.getElementById("employee-agenda");
  var isEmp=currentProfile && currentProfile.role==="employee";
  el.hidden=!isEmp;
  if(!isEmp) return;
  var empId=currentProfile.employee_id;
  var week=getWeek(weekKey);
  var html="<h3>Mon horaire</h3>";
  weekDates(weekKey).forEach(function(d,i){

      .slice().sort(function(a,b){ return toMin(a.start)-toMin(b.start); });

    }); else html+="<div style='font-size:12px;color:var(--muted)'>—</div>";
    html+="</div>";
  });
